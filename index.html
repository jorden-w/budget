    const onChange = () => window.__applyTheme?.("system");
    mq.addEventListener?.("change", onChange);
    return () => mq.removeEventListener?.("change", onChange);
  }, [themePref]);

  useEffect(() => {
    if (!toast) return;
    const id = setTimeout(() => setToast(null), 2800);
    return () => clearTimeout(id);
  }, [toast]);

  const d = useMemo(() => derive(state), [state]);
  const allRecs = useMemo(() => recommendations(state, d), [state, d]);
  const recs = useMemo(
    () => allRecs.filter((r) => !state.dismissed?.[r.id]),
    [allRecs, state.dismissed]);
  const dismissedCount = allRecs.length - recs.length;
  const roadmap = useMemo(() => buildRoadmap(state, d), [state, d]);

  const update = (fn) => setState((s) => {
    const next = typeof fn === "function" ? fn(s) : { ...s, ...fn };
    return { ...next, unexportedChanges: num(next.unexportedChanges) + 1 };
  });
  const updateQuiet = (fn) => setState((s) => (typeof fn === "function" ? fn(s) : { ...s, ...fn }));

  const setIn = (path, value) => update((s) => {
    const keys = path.split(".");
    const next = { ...s };
    let cur = next;
    for (let i = 0; i < keys.length - 1; i++) {
      cur[keys[i]] = Array.isArray(cur[keys[i]]) ? [...cur[keys[i]]] : { ...cur[keys[i]] };
      cur = cur[keys[i]];
    }
    cur[keys[keys.length - 1]] = value;
    return next;
  });

  const setBucket = (id, patch) => update((s) => ({
    ...s, buckets: s.buckets.map((b) => (b.id === id ? { ...b, ...patch } : b)),
  }));
  const addBucket = (b) => update((s) => ({
    ...s, buckets: [...s.buckets, mkBucket({ slot: s.buckets.length % SERIES_SLOTS, ...b })],
  }));
  const removeBucket = (id) => update((s) => ({ ...s, buckets: s.buckets.filter((b) => b.id !== id) }));
  const moveBucket = (id, dir) => update((s) => {
    const i = s.buckets.findIndex((b) => b.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= s.buckets.length) return s;
    const next = [...s.buckets];
    [next[i], next[j]] = [next[j], next[i]];
    return { ...s, buckets: next };
  });

  const setActual = (mk, bucketId, value) => update((s) => ({
    ...s,
    months: { ...s.months,
      [mk]: { ...(s.months[mk] || {}),
              actual: { ...(s.months[mk]?.actual || {}), [bucketId]: value },
              // Snapshot the plan the first time a month is touched, so history
              // stays true even if you change the budget later.
              budget: { ...(s.buckets.reduce((a, b) => (a[b.id] = num(b.amountMonthly), a), {})),
                        ...(s.months[mk]?.budget || {}) } } },
  }));

  /** Move budget between two categories within a month. */
  const moveMoney = (mk, from, to, amount) => {
    if (!from || !to || from === to || num(amount) <= 0) return;
    update((s) => ({
      ...s,
      months: { ...s.months,
        [mk]: { ...(s.months[mk] || { actual: {} }),
                moves: [...(s.months[mk]?.moves || []),
                        { id: uid(), from, to, amount: num(amount), date: new Date().toISOString() }] } },
    }));
    const fromB = state.buckets.find((b) => b.id === from);
    const toB = state.buckets.find((b) => b.id === to);
    setToast(`Moved ${fmt(amount)} from ${fromB?.name} to ${toB?.name}`);
  };

  const undoMove = (mk, moveId) => update((s) => ({
    ...s,
    months: { ...s.months,
      [mk]: { ...(s.months[mk] || {}), moves: (s.months[mk]?.moves || []).filter((m) => m.id !== moveId) } },
  }));

  // ---- new year ----
  const thisYear = new Date().getFullYear();
  const needsNewYear = state.ytd.year !== thisYear && state.newYearPrompted !== thisYear;
  const rollOverYear = () => update((s) => ({
    ...s,
    ytd: { trad401k: 0, roth401k: 0, rothIra: 0, hsa: 0, match: 0, wagesYtd: 0, year: thisYear },
    buckets: s.buckets.map((b) => ({ ...b, ytd: 0 })),
    newYearPrompted: thisYear,
  }));

  /** Snapshot net worth for a month. Called on paycheck and on month change. */
  const snapshotNetWorth = (s, dd) => {
    const mk = monthKey();
    const rest = (s.netWorthHistory || []).filter((h) => h.month !== mk);
    return [...rest, { month: mk, total: dd.netWorth, date: new Date().toISOString() }]
      .sort((a, b) => (a.month < b.month ? -1 : 1)).slice(-36);
  };

  const addPaycheck = (kind = "paycheck", grossOverride) => {
    const gross = grossOverride !== undefined ? grossOverride : num(state.income.w2.grossPerCheck);
    if (gross <= 0) { setToast("Set your gross pay first"); return; }

    const pay = computePayroll(gross, d.cadence, state.profile, state.preTax, state.postTax,
      state.taxData, num(state.ytd.wagesYtd));
    const match = computeMatch(gross, d.deferralPct, state.match.tiers);
    const scaled = state.buckets.filter((b) => !b.archived).map((b) =>
      b.fill === "pctOfNet" || b.fill === "remainder"
        ? b : { ...b, amountMonthly: fromMonthly(b.amountMonthly, d.cadence) });
    const flow = runWaterfall(pay.netPay, scaled);

    const bucketEffects = {};
    for (const a of flow.allocations) {
      if (a.amount > 0 && ["sinking", "goal", "invest"].includes(a.bucket.kind)) {
        bucketEffects[a.bucket.id] = a.amount;
      }
    }
    const effects = {
      checking: flow.leftover,
      trad401k: pay.trad401k + match.match,
      roth401k: pay.roth401k,
      hsa: pay.hsa,
      ytd: { trad401k: pay.trad401k, roth401k: pay.roth401k, hsa: pay.hsa,
             match: match.match, wagesYtd: gross },
      buckets: bucketEffects,
    };
    const entry = {
      id: uid(), type: kind, date: new Date().toISOString(),
      inputs: { gross, cadence: d.cadence,
                trad401kPct: num(state.preTax.trad401kPct), roth401kPct: num(state.postTax.roth401kPct),
                stateCode: state.profile.stateCode, filingStatus: state.profile.filingStatus },
      summary: { netPay: pay.netPay, tax: pay.taxTotal, match: match.match, leftover: flow.leftover },
      effects,
    };
    update((s) => {
      const applied = applyEntry(s, entry, +1);
      return { ...applied, netWorthHistory: snapshotNetWorth(applied, derive(applied)) };
    });
    setToast(`${kind === "bonus" ? "Bonus" : "Paycheck"} added — ${fmt(pay.netPay)} take-home`);
  };

  const applyEntry = (s, entry, sign) => {
    const e = entry.effects;
    const accounts = { ...s.accounts };
    accounts.checking = num(accounts.checking) + sign * num(e.checking);
    accounts.trad401k = num(accounts.trad401k) + sign * num(e.trad401k);
    accounts.roth401k = num(accounts.roth401k) + sign * num(e.roth401k);
    accounts.hsa = num(accounts.hsa) + sign * num(e.hsa);
    const ytd = { ...s.ytd };
    for (const k of ["trad401k", "roth401k", "hsa", "match", "wagesYtd"]) {
      ytd[k] = num(ytd[k]) + sign * num(e.ytd?.[k]);
    }
    const buckets = s.buckets.map((b) => {
      const delta = num(e.buckets?.[b.id]);
      if (!delta) return b;
      return { ...b, balance: num(b.balance) + sign * delta, ytd: num(b.ytd) + sign * delta };
    });
    const history = sign > 0 ? [entry, ...s.history].slice(0, 200) : s.history.filter((h) => h.id !== entry.id);
    return { ...s, accounts, ytd, buckets, history };
  };

  const undoEntry = (id) => update((s) => {
    const entry = s.history.find((h) => h.id === id);
    return entry ? applyEntry(s, entry, -1) : s;
  });

  // ---- backup ----
  const daysSinceExport = state.lastExportAt ? (Date.now() - state.lastExportAt) / 86400000 : 999;
  const showBackupBanner = num(state.unexportedChanges) >= 20 || (daysSinceExport >= 14 && state.history.length > 0);

  const exportData = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `budget-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    updateQuiet((s) => ({ ...s, lastExportAt: Date.now(), unexportedChanges: 0 }));
    setToast("Backup downloaded");
  };

  const importData = (json) => {
    try {
      setState(migrate(typeof json === "string" ? JSON.parse(json) : json));
      setToast("Data restored");
      return true;
    } catch { setToast("Couldn't read that file"); return false; }
  };

  /** Merge a statement-import file into one month, leaving everything else alone. */
  const importStatements = (json) => {
    let payload;
    try { payload = typeof json === "string" ? JSON.parse(json) : json; }
    catch { setToast("Couldn't read that file"); return false; }

    if (payload.type !== "budget-statement-import") {
      setToast("That's a backup, not a statement import — use Restore instead");
      return false;
    }
    const resolved = resolveBuckets(payload, state.buckets);
    const result = mergeImport(state, resolved);
    if (!result.ok) {
      setToast(result.duplicate ? `${monthLabel(result.month)} was already imported` : result.error);
      return false;
    }
    update(() => result.state);
    const bits = [`${result.added} transaction${result.added === 1 ? "" : "s"} into ${monthLabel(result.month)}`];
    if (result.skipped) bits.push(`${result.skipped} duplicate${result.skipped === 1 ? "" : "s"} skipped`);
    if (resolved.unmatched) bits.push(`${resolved.unmatched} need a category`);
    setToast(bits.join(" · "));
    setTab("spend");
    return true;
  };

  const ctx = {
    state, d, recs, dismissedCount, roadmap, update, updateQuiet, setIn, setPlanOpen,
    setBucket, addBucket, removeBucket, moveBucket, setActual, moveMoney, undoMove,
    addPaycheck, undoEntry, exportData, importData, importStatements, setToast, setTab, setSetupOpen,
  };

  if (!state.setupComplete) {
    return <Wizard state={state} onDone={(next) => setState({ ...next, setupComplete: true })}
                   onSkip={(next) => setState({ ...next, setupComplete: true, setupProgress: { skipped: true, done: [] } })} />;
  }

  const greeting = (() => {
    const h = new Date().getHours();
    const who = state.profile.name ? `, ${state.profile.name}` : "";
    return h < 12 ? `Good morning${who}` : h < 18 ? `Good afternoon${who}` : `Good evening${who}`;
  })();

  return (
    <div className="min-h-screen" style={{ background: "var(--bg)" }}>
      <div className="max-w-2xl mx-auto px-4" style={{ paddingBottom: "calc(96px + env(safe-area-inset-bottom))" }}>

        {/* ---- header ---- */}
        <header className="flex items-end justify-between pt-6 pb-5">
          <div className="min-w-0">
            <div className="text-[13px]" style={{ color: "var(--muted)" }}>{greeting}</div>
            <h1 className="text-[26px] font-semibold tracking-tight mt-0.5">
              {TABS.find((t) => t.key === tab)?.label}
            </h1>
          </div>
          <button onClick={() => setSetupOpen(true)} aria-label="Settings"
                  className="p-2.5 rounded-full pressable shrink-0"
                  style={{ background: "var(--card)", border: "1px solid var(--border)", boxShadow: "var(--shadow-sm)" }}>
            <IconSettings className="w-4 h-4" />
          </button>
        </header>

        {needsNewYear && (
          <Card className="mb-4" style={{ borderColor: "var(--accent)" }}>
            <div className="text-[14px] font-semibold mb-1">It's {thisYear}</div>
            <div className="text-[12px] mb-4 leading-relaxed" style={{ color: "var(--muted)" }}>
              Contribution limits reset each calendar year. Zero the year-to-date counters?
              Balances aren't touched.
            </div>
            <div className="flex gap-2">
              <Button onClick={rollOverYear} className="flex-1" size="sm">Reset year-to-date</Button>
              <Button variant="ghost" size="sm" onClick={() => updateQuiet((s) => ({ ...s, newYearPrompted: thisYear }))}>
                Not now
              </Button>
            </div>
          </Card>
        )}

        {showBackupBanner && (
          <Card className="mb-4" style={{ borderColor: "var(--warn)", background: "var(--warn-soft)" }}>
            <div className="flex items-center gap-3">
              <IconWarning className="w-4 h-4 shrink-0" style={{ color: "var(--warn)" }} />
              <div className="text-[12px] flex-1 leading-relaxed" style={{ color: "var(--muted)" }}>
                This lives only in your browser's storage. Clearing site data wipes it.
              </div>
              <Button variant="ghost" size="sm" onClick={exportData}>Back up</Button>
            </div>
          </Card>
        )}

        <main className="animate-fade-in" key={tab}>
          {tab === "today" && <TodayTab {...ctx} />}
          {tab === "spend" && <SpendTab {...ctx} />}
          {tab === "bills" && <BillsTab {...ctx} />}
          {tab === "grow"  && <GrowTab {...ctx} />}
        </main>

        <footer className="text-center text-[11px] mt-10 leading-relaxed" style={{ color: "var(--faint)" }}>
          General guidance, not personalised financial advice.<br />
          Tax figures are {state.taxData.year} estimates — verify before filing.
        </footer>
      </div>

      {/* ---- bottom tab bar ---- */}
      <nav className="fixed bottom-0 inset-x-0 z-40 tabbar"
           style={{ background: "color-mix(in srgb, var(--bg-elev) 92%, transparent)",
                    backdropFilter: "blur(12px)", borderTop: "1px solid var(--border)" }}>
        <div className="max-w-2xl mx-auto flex px-2 pt-2">
          {TABS.map((t) => {
            const active = tab === t.key;
            return (
              <button key={t.key} onClick={() => setTab(t.key)}
                className="flex-1 flex flex-col items-center gap-1 py-1.5 rounded-xl pressable"
                aria-current={active ? "page" : undefined}
                style={{ color: active ? "var(--accent-text)" : "var(--faint)" }}>
                <t.icon className="w-5 h-5" />
                <span className="text-[10px] font-medium">{t.label}</span>
              </button>
            );
          })}
        </div>
      </nav>

      <Modal open={planOpen} onClose={() => setPlanOpen(false)} title="Paycheck & plan"
        subtitle="Income, contributions, and the order money fills up">
        <PlanTab {...ctx} />
      </Modal>

      <SetupSheet open={setupOpen} onClose={() => setSetupOpen(false)} openPlan={() => { setSetupOpen(false); setPlanOpen(true); }} {...ctx} />

      {toast && (
        <div className="fixed left-1/2 -translate-x-1/2 z-50 px-4 py-3 rounded-2xl text-[13px] font-medium animate-pop max-w-[90vw]"
             style={{ bottom: "calc(88px + env(safe-area-inset-bottom))", background: "var(--text)",
                      color: "var(--bg)", boxShadow: "var(--shadow-lg)" }}>
          {toast}
        </div>
      )}
    </div>
  );
}


// ===================== §9  TODAY =====================
function TodayTab({ state, d, recs, dismissedCount, roadmap, setTab, addPaycheck, undoEntry, update, setSetupOpen }) {
  const mk = d.thisMonth;
  const month = state.months[mk] || { actual: {} };
  const trackable = state.buckets.filter((b) => !b.archived && (b.kind === "expense" || b.kind === "discretionary"));
  const budgeted = trackable.reduce((s, b) => s + num(b.amountMonthly), 0);
  const monthActual = monthActuals(month);
  const actual = trackable.reduce((s, b) => s + num(monthActual[b.id]), 0);
  const logged = trackable.filter((b) => monthActual[b.id] !== undefined).length;
  const nextPay = state.profile.nextPayDate ? daysBetween(new Date(), state.profile.nextPayDate + "T12:00:00") : null;

  // Setup checklist, only while things are genuinely missing.
  const checklist = [
    { key: "rent",   label: "Add your rent",            done: state.buckets.some((b) => /rent/i.test(b.name) && num(b.amountMonthly) > 0), go: "spend" },
    { key: "pay",    label: "Set your gross pay",       done: num(state.income.w2.grossPerCheck) > 0, go: "plan" },
    { key: "payday", label: "Set your next payday",     done: !!state.profile.nextPayDate, go: null },
    { key: "card",   label: "Add your card balances",   done: !state.cardsEnabled || d.card.totalBalance > 0 || num(state.accounts.checking) > 0, go: "bills" },
    { key: "ef",     label: "Record emergency savings", done: d.emergencyBalance > 0, go: "grow" },
  ];
  const remaining = checklist.filter((c) => !c.done);

  return (
    <div>
      {/* ---- free to spend ---- */}
      <div className="grid grid-cols-2 gap-3 mb-4">
        <Card className="!p-4">
          <div className="text-[11px] mb-1 truncate" style={{ color: "var(--faint)" }}>Free to spend</div>
          {/* An em dash, not a number. Computing this from an unentered
              balance produced a confident deficit out of nothing. */}
          <div className="num-hero text-[20px] truncate"
               style={{ color: !d.cashKnown ? "var(--faint)"
                             : d.card.freeToSpend < 0 ? "var(--bad)" : "var(--text)" }}>
            {d.cashKnown ? fmt0(d.card.freeToSpend) : "—"}
          </div>
          <div className="text-[11px] mt-1 truncate" style={{ color: "var(--faint)" }}>
            {!d.cashKnown
              ? <button onClick={() => setSetupOpen(true)} className="pressable"
                        style={{ color: "var(--accent-text)" }}>add your balance</button>
              : d.card.enabled && d.card.totalBalance > 0
                ? `after ${fmtShort(d.card.totalBalance)} on ${d.card.list.length} card${d.card.list.length === 1 ? "" : "s"}`
                : "in checking"}
          </div>
          {/* Deliberately below the line and not added in: it's real money and
              it's coming, but until it lands it isn't yours to spend. */}
          {d.owed > 0 && (
            <div className="text-[11px] mt-1 truncate" style={{ color: "var(--accent-text)" }}>
              +{fmtShort(d.owed)} owed to you
            </div>
          )}
        </Card>
        <Card className="!p-4">
          <div className="text-[11px] mb-1 truncate" style={{ color: "var(--faint)" }}>Next paycheck</div>
          <div className="num-hero text-[20px] truncate">{fmt0(d.pay.netPay)}</div>
          <div className="text-[11px] mt-1 truncate" style={{ color: "var(--faint)" }}>
            {nextPay === null ? CADENCE_LABEL[d.cadence]
              : nextPay <= 0 ? "today" : `in ${nextPay} day${nextPay === 1 ? "" : "s"}`}
          </div>
        </Card>
      </div>

      <div className="mb-4">
        <Button onClick={() => addPaycheck("paycheck")} icon={IconPlus} className="w-full">
          Add paycheck — {fmt(d.pay.netPay)}
        </Button>
      </div>

      {/* ---- the next 60 days ----
          Ahead of net worth on purpose: "do I make rent" is a this-week
          question and net worth is a this-decade one. */}
      <Card className="mb-4">
        <div className="flex items-baseline justify-between gap-2 mb-1">
          <span className="text-[12px]" style={{ color: "var(--muted)" }}>Checking, projected</span>
          <span className="text-[11px]" style={{ color: "var(--faint)" }}>
            {d.forecast.spendOnCard ? `spending on ${d.forecast.spendOnCard.name}` : "spending from checking"}
          </span>
        </div>
        {d.cashKnown ? <ForecastChart forecast={d.forecast} /> : (
          <div className="text-[12px] py-8 text-center leading-relaxed" style={{ color: "var(--muted)" }}>
            This projects your balance day by day once it knows where you're starting from.<br />
            <button onClick={() => setSetupOpen(true)} className="pressable mt-1"
                    style={{ color: "var(--accent-text)" }}>Add your checking balance</button>
          </div>
        )}
        {d.cashKnown && <div className="text-[11px] mt-2 leading-relaxed pt-3"
             style={{ color: "var(--muted)", borderTop: "1px solid var(--border)" }}>
          {d.forecast.goesNegative ? (
            <>You run out on{" "}
              <span style={{ color: "var(--bad)" }}>
                {new Date(todayISO(d.forecast.firstNegative) + "T00:00:00")
                  .toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })}</span>
              {d.forecast.shortBy > 0 && <> — about {fmt0(d.forecast.shortBy)} short before the next paycheck</>}.
              Bills and card statements land on their days, so the shortfall is a date, not a vague crunch.</>
          ) : (
            <>You stay above water the whole stretch, dipping to{" "}
              <span className="font-mono-num" style={{ color: "var(--text)" }}>{fmt0(d.forecast.low.balance)}</span>{" "}
              at the low point.</>
          )}
        </div>}
      </Card>



      {remaining.length > 0 && state.setupProgress?.skipped && (
        <>
          <SectionLabel>Finish setting up</SectionLabel>
          <Card className="mb-1">
            {checklist.map((c, i) => (
              <button key={c.key} onClick={() => c.go && setTab(c.go)} disabled={c.done}
                className="w-full flex items-center gap-3 py-2.5 text-left"
                style={{ borderBottom: i < checklist.length - 1 ? "1px solid var(--border)" : "none" }}>
                <div className="w-5 h-5 rounded-full flex items-center justify-center shrink-0"
                     style={{ background: c.done ? "var(--good)" : "transparent",
                              border: `1.5px solid ${c.done ? "var(--good)" : "var(--border-hi)"}`,
                              color: "#fff" }}>
                  {c.done && <IconCheck className="w-3 h-3" />}
                </div>
                <span className="text-[13px] flex-1"
                      style={{ color: c.done ? "var(--faint)" : "var(--text)",
                               textDecoration: c.done ? "line-through" : "none" }}>{c.label}</span>
                {!c.done && c.go && <IconChevron className="w-3.5 h-3.5" style={{ color: "var(--faint)" }} />}
              </button>
            ))}
          </Card>
        </>
      )}

      {recs.length > 0 && (
        <>
          <SectionLabel right={dismissedCount > 0
            ? <LinkButton onClick={() => update((s) => ({ ...s, dismissed: {} }))}>
                Show {dismissedCount} dismissed
              </LinkButton>
            : null}>Needs attention</SectionLabel>
          <div className="space-y-2">
            {recs.slice(0, 4).map((r) => (
              <AlertCard key={r.id} {...r}
                onDismiss={() => update((s) => ({ ...s, dismissed: { ...s.dismissed, [r.id]: Date.now() } }))} />
            ))}
          </div>
        </>
      )}

      {/* Everything was waved away — say so rather than showing a blank gap,
          and leave a way back. */}
      {recs.length === 0 && dismissedCount > 0 && (
        <>
          <SectionLabel>Needs attention</SectionLabel>
          <Card>
            <div className="flex items-center gap-3">
              <IconCheck className="w-4 h-4 shrink-0" style={{ color: "var(--good)" }} />
              <div className="text-[12px] flex-1" style={{ color: "var(--muted)" }}>
                Nothing outstanding. {dismissedCount} dismissed — they'll come back if the
                situation changes.
              </div>
              <button onClick={() => update((s) => ({ ...s, dismissed: {} }))}
                className="text-[11px] shrink-0 pressable" style={{ color: "var(--accent-text)" }}>
                Show
              </button>
            </div>
          </Card>
        </>
      )}

      {/* ---- due soon ---- */}
      {d.billsDueSoon.length > 0 && (
        <>
          <SectionLabel right={<LinkButton onClick={() => setTab("bills")}>All bills</LinkButton>}>
            Due this week
          </SectionLabel>
          <Card>
            {d.billsDueSoon.map((b, i) => (
              <div key={b.bucket.id} className="flex items-center gap-3 py-2.5"
                   style={{ borderBottom: i < d.billsDueSoon.length - 1 ? "1px solid var(--border)" : "none" }}>
                <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: slotVar(b.bucket.slot) }} />
                <div className="flex-1 min-w-0">
                  <div className="text-[13px] truncate">{b.bucket.name}</div>
                  <div className="text-[11px]" style={{ color: "var(--faint)" }}>
                    {b.days === 0 ? "today" : b.days === 1 ? "tomorrow" : `in ${b.days} days`}
                    {" · "}{b.date.toLocaleDateString("en-US", { month: "short", day: "numeric" })}
                  </div>
                </div>
                <span className="font-mono-num text-[13px] shrink-0">{fmt(b.amount)}</span>
              </div>
            ))}
          </Card>
        </>
      )}

      {/* ---- this month ---- */}
      <SectionLabel right={<LinkButton onClick={() => setTab("spend")}>
        {logged ? "Update" : "Log spending"}
      </LinkButton>}>{monthLabel(mk)}</SectionLabel>
      <Card>
        {logged > 0 ? (
          <>
            <div className="flex gap-4 mb-4">
              <Stat label="Spent" value={fmt0(actual)}
                color={actual > budgeted ? "var(--bad)" : "var(--text)"} sub={`of ${fmt0(budgeted)}`} />
              <Stat label={actual > budgeted ? "Over" : "Left"} value={fmt0(Math.abs(budgeted - actual))}
                color={actual > budgeted ? "var(--bad)" : "var(--good)"}
                sub={`${logged}/${trackable.length} logged`} align="right" />
            </div>
            <ProgressBar value={budgeted > 0 ? actual / budgeted : 0}
              color={actual > budgeted ? "var(--st-crit)" : "var(--st-good)"} />
          </>
        ) : (
          <EmptyState icon={IconCard} title="Nothing logged this month"
            body="Import a statement or type what you spent per category, and this fills in. That's what turns a plan into a budget." />
        )}
      </Card>

      {d.extraPayMonths.length > 0 && (
        <Card className="mt-3" style={{ borderColor: "var(--accent)" }}>
          <div className="flex gap-3">
            <IconCalendar className="w-4 h-4 shrink-0 mt-0.5" style={{ color: "var(--accent-text)" }} />
            <div>
              <div className="text-[13px] font-semibold mb-1">
                {listJoin(d.extraPayMonths.map(monthNameLabel))} {d.extraPayMonths.length > 1 ? "have" : "has"} a third paycheck
              </div>
              <div className="text-[12px] leading-relaxed" style={{ color: "var(--muted)" }}>
                Getting paid every two weeks means 26 checks a year, not 24 — so twice a year a
                third one lands. That's {fmt(d.pay.netPay)} on top of a normal month. Worth
                deciding where it goes before it arrives.
              </div>
            </div>
          </div>
        </Card>
      )}

      {/* ---- where you are ---- */}
      {(() => {
        const doneCount = roadmap.filter((p) => p.done).length;
        const current = roadmap.find((p) => !p.done);
        return (
          <>
            <SectionLabel right={<LinkButton onClick={() => setTab("grow")}>Open</LinkButton>}>
              Where you are
            </SectionLabel>
            <Card>
              <div className="flex items-baseline justify-between mb-2 gap-3">
                <div className="text-[14px] font-semibold min-w-0 truncate">
                  {current ? current.title : "Every step complete"}
                </div>
                <div className="font-mono-num text-[12px] shrink-0" style={{ color: "var(--faint)" }}>
                  {doneCount}/{roadmap.length}
                </div>
              </div>
              <ProgressBar value={doneCount / roadmap.length} color="var(--accent)" />
              {current && (
                <div className="text-[12px] mt-3 leading-relaxed" style={{ color: "var(--muted)" }}>
                  {current.detail}
                </div>
              )}
            </Card>
          </>
        );
      })()}

      {state.history.length > 0 && (
        <>
          <SectionLabel>Recent</SectionLabel>
          <Card>
            {state.history.slice(0, 6).map((h, i) => (
              <div key={h.id} className="flex items-center gap-3 py-2.5"
                   style={{ borderBottom: i < Math.min(6, state.history.length) - 1 ? "1px solid var(--border)" : "none" }}>
                <div className="min-w-0 flex-1">
                  <div className="text-[13px]">{h.type === "bonus" ? "Bonus" : "Paycheck"}</div>
                  <div className="text-[11px]" style={{ color: "var(--faint)" }}>
                    {new Date(h.date).toLocaleDateString("en-US", { month: "short", day: "numeric" })}
                    {" · "}{fmt0(h.inputs.gross)} gross · {fmt0(h.summary.tax)} tax
                  </div>
                </div>
                <span className="font-mono-num text-[13px] shrink-0" style={{ color: "var(--good)" }}>
                  +{fmt(h.summary.netPay)}
                </span>
                <button onClick={() => undoEntry(h.id)} className="p-1.5 rounded-lg shrink-0 pressable"
                        title="Undo" style={{ color: "var(--faint)" }}>
                  <IconRotate className="w-3.5 h-3.5" />
                </button>
              </div>
            ))}
          </Card>
        </>
      )}
    </div>
  );
}


// ===================== §10  PLAN =====================
function PlanTab({ state, d, setIn, update, setBucket, addBucket, removeBucket, moveBucket, addPaycheck }) {
  const [editBucket, setEditBucket] = useState(null);
  const [addOpen, setAddOpen] = useState(false);
  const p = d.pay;

  const cmp = useMemo(
    () => tradVsRoth(state.income.w2.grossPerCheck, d.cadence, state.profile, state.preTax, state.postTax, state.taxData),
    [state.income.w2.grossPerCheck, d.cadence, state.profile, state.preTax, state.postTax, state.taxData]);

  const total401k = num(state.preTax.trad401kPct) + num(state.postTax.roth401kPct);
  const tradShare = total401k > 0 ? num(state.preTax.trad401kPct) / total401k * 100 : 100;

  const setTotal401k = (v) => update((s) => ({
    ...s,
    preTax:  { ...s.preTax,  trad401kPct: Math.round(v * tradShare / 100 * 100) / 100 },
    postTax: { ...s.postTax, roth401kPct: Math.round(v * (100 - tradShare) / 100 * 100) / 100 },
  }));
  const setSplit = (v) => update((s) => ({
    ...s,
    preTax:  { ...s.preTax,  trad401kPct: Math.round(total401k * v / 100 * 100) / 100 },
    postTax: { ...s.postTax, roth401kPct: Math.round(total401k * (100 - v) / 100 * 100) / 100 },
  }));

  const waterfallSteps = [
    { label: "Traditional 401(k)", amount: p.trad401k, color: "var(--s1)" },
    ...(p.hsa > 0 ? [{ label: "HSA", amount: p.hsa, color: "var(--s3)" }] : []),
    ...(p.otherPreTax > 0 ? [{ label: "Other pre-tax", amount: p.otherPreTax, color: "var(--s7)" }] : []),
    { label: "Federal income tax", amount: p.federal, color: "var(--st-crit)" },
    { label: "Social Security", amount: p.ss, color: "var(--st-serious)" },
    { label: "Medicare", amount: p.medicare + p.addlMedicare, color: "var(--st-serious)" },
    ...(p.stateTax > 0 ? [{ label: `${p.stateName} tax`, amount: p.stateTax, color: "var(--st-crit)" }] : []),
    ...(p.local > 0 ? [{ label: "Local tax", amount: p.local, color: "var(--st-crit)" }] : []),
    ...(p.roth401k > 0 ? [{ label: "Roth 401(k)", amount: p.roth401k, color: "var(--s4)" }] : []),
  ];

  return (
    <div>
      <SectionLabel>Income</SectionLabel>
      <Card className="mb-1">
        <div className="grid grid-cols-2 gap-3">
          <LabeledInput label="Gross per paycheck" prefix="$" value={state.income.w2.grossPerCheck}
            onChange={(v) => setIn("income.w2.grossPerCheck", v)} />
          <Field label="Paid">
            <Select value={d.cadence} onChange={(v) => setIn("profile.payCadence", v)} className="w-full"
              options={Object.keys(PER_YEAR).map((k) => ({ value: k, label: CADENCE_LABEL[k] }))} />
          </Field>
        </div>
        <div className="flex items-baseline justify-between mt-4 pt-3" style={{ borderTop: "1px solid var(--border)" }}>
          <span className="text-[12px]" style={{ color: "var(--muted)" }}>
            {toAnnual(1, d.cadence)} paychecks a year
          </span>
          <span className="font-mono-num text-[13px]">
            {fmt0(toAnnual(state.income.w2.grossPerCheck, d.cadence))}
            <span style={{ color: "var(--faint)" }}> gross/yr</span>
          </span>
        </div>
      </Card>

      {/* ---- side income ---- */}
      <SectionLabel right={<LinkButton onClick={() => update((s) => ({
        ...s, income: { ...s.income, side: [...s.income.side, { id: uid(), name: "Side gig", amountMonthly: 0, taxTreatment: "se" }] },
      }))}>+ Add</LinkButton>}>Side income</SectionLabel>
      <Card className="mb-1">
        {state.income.side.length === 0 ? (
          <EmptyState icon={IconTrending} title="No side income"
            body="1099 work owes self-employment tax on top of income tax. Betting profit doesn't — that's tracked separately under Grow." />
        ) : (
          <>
            {state.income.side.map((si, i) => {
              const item = d.side.items[i];
              const patch = (p2) => update((s) => ({ ...s, income: { ...s.income, side: s.income.side.map((x) => x.id === si.id ? { ...x, ...p2 } : x) } }));
              return (
                <div key={si.id} className="py-3" style={{ borderBottom: i < state.income.side.length - 1 ? "1px solid var(--border)" : "none" }}>
                  <div className="flex items-center gap-2 mb-2.5">
                    <input value={si.name} onChange={(e) => patch({ name: e.target.value })}
                      className="flex-1 bg-transparent outline-none text-[13px] font-medium" />
                    <button onClick={() => update((s) => ({ ...s, income: { ...s.income, side: s.income.side.filter((x) => x.id !== si.id) } }))}
                      className="p-1.5 rounded-lg pressable" style={{ color: "var(--faint)" }}>
                      <IconTrash className="w-3.5 h-3.5" />
                    </button>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <LabeledInput label="Per month" prefix="$" value={si.amountMonthly}
                      onChange={(v) => patch({ amountMonthly: v })} />
                    <Field label="Taxed as">
                      <Select value={si.taxTreatment} className="w-full" onChange={(v) => patch({ taxTreatment: v })}
                        options={[{ value: "se", label: "1099 / self-employed" },
                                  { value: "w2", label: "W-2 (withheld)" },
                                  { value: "none", label: "Untaxed" }]} />
                    </Field>
                  </div>
                  {item && item.seTax > 0 && (
                    <div className="text-[11px] mt-2.5 leading-relaxed" style={{ color: "var(--muted)" }}>
                      Self-employment tax {fmt(item.seTax)} + income tax {fmt(item.incomeTax)} →
                      <span className="font-mono-num" style={{ color: "var(--good)" }}> {fmt(item.net)} net</span>.
                      Nobody withholds this for you.
                    </div>
                  )}
                </div>
              );
            })}
            <div className="flex items-baseline justify-between pt-3 mt-1" style={{ borderTop: "1px solid var(--border)" }}>
              <span className="text-[13px] font-semibold">Net side income</span>
              <span className="font-mono-num text-[14px] font-semibold" style={{ color: "var(--good)" }}>
                {fmt(d.side.netMonthly)}/mo
              </span>
            </div>
          </>
        )}
      </Card>

      <SectionLabel>Yearly bonus</SectionLabel>
      <Card>
        <div className="grid grid-cols-2 gap-3">
          <LabeledInput label="Expected bonus" prefix="$" value={state.income.bonus.amount}
            onChange={(v) => setIn("income.bonus.amount", v)} />
          <div className="flex items-end">
            {num(state.income.bonus.amount) > 0 && (
              <Button variant="ghost" className="w-full"
                onClick={() => addPaycheck("bonus", num(state.income.bonus.amount))}>Deposit</Button>
            )}
          </div>
        </div>
        {num(state.income.bonus.amount) > 0 && (
          <div className="text-[11px] mt-3 leading-relaxed" style={{ color: "var(--faint)" }}>
            Employers usually withhold bonuses at a flat 22% supplemental rate, so your actual
            check may differ from this and settle up at filing time.
          </div>
        )}
      </Card>

      <SectionLabel>Where the paycheck goes</SectionLabel>
      <Card className="mb-1">
        <PaycheckWaterfall steps={waterfallSteps} gross={p.gross} />
        <div className="flex items-center justify-between mt-4 pt-3 text-[11px]"
             style={{ borderTop: "1px solid var(--border)", color: "var(--faint)" }}>
          <span>Effective tax rate · {(p.fedMarginal * 100).toFixed(0)}% federal bracket</span>
          <span className="font-mono-num">{pct(p.effectiveTaxRate * 100)}</span>
        </div>
      </Card>

      <SectionLabel>401(k)</SectionLabel>
      <Card className="mb-1">
        <DualSlider label="Total contribution" color="var(--s1)" percent={total401k}
          onChange={setTotal401k} base={p.gross} max={30}
          footnote={`${fmt(toAnnual(p.total401k, d.cadence))}/yr against the ${fmt0(state.limits.employee401k)} limit`} />

        {total401k > 0 && (
          <>
            <div className="mt-5 mb-2 text-[13px] font-medium">Traditional / Roth split</div>
            <div className="flex items-center gap-3 mb-2.5">
              {/* Swatch carries the colour; the label wears text ink. Series
                  hues are mark colours and fail AA as small text. */}
              <div className="flex-1 min-w-0">
                <div className="text-[11px] mb-0.5 flex items-center gap-1.5" style={{ color: "var(--muted)" }}>
                  <span className="w-2 h-2 rounded-full shrink-0" style={{ background: "var(--s1)" }} />
                  Traditional
                </div>
                <div className="font-mono-num text-[14px]">{fmt(p.trad401k)}</div>
              </div>
              <div className="font-mono-num text-[11px] px-2.5 py-1 rounded-full shrink-0"
                   style={{ background: "var(--card-2)", color: "var(--muted)" }}>
                {tradShare.toFixed(0)} / {(100 - tradShare).toFixed(0)}
              </div>
              <div className="flex-1 min-w-0 text-right">
                <div className="text-[11px] mb-0.5 flex items-center gap-1.5 justify-end" style={{ color: "var(--muted)" }}>
                  Roth
                  <span className="w-2 h-2 rounded-full shrink-0" style={{ background: "var(--s4)" }} />
                </div>
                <div className="font-mono-num text-[14px]">{fmt(p.roth401k)}</div>
              </div>
            </div>
            <input type="range" min="0" max="100" step="5" value={tradShare}
              onChange={(e) => setSplit(parseFloat(e.target.value))} className="slider"
              aria-label="Traditional versus Roth split"
              style={{ background: `linear-gradient(to right, var(--s1) 0%, var(--s1) ${tradShare}%, var(--s4) ${tradShare}%, var(--s4) 100%)` }} />

            {cmp && (
              <div className="mt-5 p-4 rounded-2xl" style={{ background: "var(--card-2)" }}>
                <div className="text-[12px] leading-relaxed mb-3" style={{ color: "var(--muted)" }}>
                  All-Traditional nets <span className="font-mono-num" style={{ color: "var(--text)" }}>{fmt(cmp.allTrad.netPay)}</span> a
                  check; all-Roth nets <span className="font-mono-num" style={{ color: "var(--text)" }}>{fmt(cmp.allRoth.netPay)}</span>.
                  Roth costs <span className="font-mono-num font-semibold" style={{ color: "var(--text)" }}>{fmt(cmp.rothCostPerCheck)}</span> per
                  check ({fmt(cmp.rothCostAnnual)}/yr) in exchange for never being taxed again.
                  The same {fmt(cmp.allTrad.total401k)} lands in the account either way.
                </div>
                <div className="flex items-start gap-2.5 pt-3" style={{ borderTop: "1px solid var(--border)" }}>
                  <IconSparkles className="w-4 h-4 shrink-0 mt-0.5" style={{ color: "var(--accent-text)" }} />
                  <div>
                    <div className="text-[12px] font-semibold mb-0.5">
                      {cmp.verdict === "roth" ? "Lean Roth" : cmp.verdict === "trad" ? "Lean Traditional" : "Close call — split it"}
                    </div>
                    <div className="text-[11px] leading-relaxed" style={{ color: "var(--muted)" }}>{cmp.why}</div>
                  </div>
                </div>
              </div>
            )}
          </>
        )}

        <div className="mt-4 p-4 rounded-2xl"
             style={{ background: d.match.fullyCaptured ? "var(--good-soft)" : "var(--bad-soft)",
                      border: `1px solid ${d.match.fullyCaptured ? "var(--good)" : "var(--bad)"}33` }}>
          <div className="flex items-center justify-between mb-1.5">
            <div className="flex items-center gap-2 text-[13px] font-semibold">
              <IconGift className="w-4 h-4" style={{ color: d.match.fullyCaptured ? "var(--good)" : "var(--bad)" }} />
              Employer match
            </div>
            {/* The gift icon carries good-vs-missing; the figure wears ink. */}
            <div className="font-mono-num text-[14px] font-semibold" style={{ color: "var(--text)" }}>
              +{fmt(d.match.match)}
            </div>
          </div>
          <div className="text-[11px] leading-relaxed" style={{ color: "var(--muted)" }}>
            {state.match.tiers.map((t) => `${t.matchPct}% of the first ${t.uptoPctOfPay}%`).join(", then ")}.
            {d.match.fullyCaptured
              ? ` You're capturing all of it — ${fmt(toAnnual(d.match.match, d.cadence))} a year of free money.`
              : ` Contribute ${d.match.needPct.toFixed(1)}% more for the full ${fmt(d.match.maxMatch)}; you're leaving ${fmt(toAnnual(d.match.missing, d.cadence))}/yr on the table.`}
            {" "}Match money always goes to Traditional, whatever your split.
          </div>
        </div>
      </Card>

      {/* ---- the waterfall ---- */}
      <SectionLabel right={<LinkButton onClick={() => setAddOpen(true)}>+ Add</LinkButton>}>
        Where each paycheck goes
      </SectionLabel>
      <Card className="mb-1">
        {/* "Priority order" meant nothing on its own — the name described the
            control, not what it does. This says what happens, with the real
            numbers from the next actual paycheck. */}
        <div className="text-[12px] leading-relaxed mb-4" style={{ color: "var(--muted)" }}>
          Your {fmt(p.netPay)} take-home pours down this list, top to bottom. Each one takes
          what it asks for and passes the rest along — so whatever sits at the top gets paid
          before anything below it, and a month that comes up short runs out at the bottom, not
          the middle.
          {d.flowPerCheck.allocations.length > 1 && (
            <> Right now {d.flowPerCheck.allocations[0].bucket.name} is funded first
            {d.flowPerCheck.leftover > 0
              ? <>, and {fmt(d.flowPerCheck.leftover)} is left over</>
              : d.flowPerCheck.unfunded.length > 0
                ? <>, and it runs out before {d.flowPerCheck.unfunded[0].bucket.name}</>
                : <> and everything below it gets funded</>}.</>
          )}
          {" "}Use the arrows to change the order.
        </div>
        {d.flowPerCheck.starvedByRemainder.length > 0 && (
          <div className="mb-4">
            <AlertCard level="warn" title="Some buckets can never be funded"
              body={`${d.flowPerCheck.starvedByRemainder.join(", ")} sit below a "whatever's left" bucket, which absorbs everything at its position. Move them above it.`} />
          </div>
        )}
        {d.flowPerCheck.allocations.map((a, i) => (
          <BucketRow key={a.bucket.id} alloc={a} index={i}
            last={i === d.flowPerCheck.allocations.length - 1}
            onEdit={() => setEditBucket(a.bucket)} onMove={(dir) => moveBucket(a.bucket.id, dir)} />
        ))}
        <div className="flex items-baseline justify-between pt-3 mt-1" style={{ borderTop: "1px solid var(--border)" }}>
          <span className="text-[13px] font-semibold">Left to checking</span>
          <span className="font-mono-num text-[14px] font-semibold"
                style={{ color: d.flowPerCheck.leftover > 0 ? "var(--good)" : "var(--muted)" }}>
            {fmt(d.flowPerCheck.leftover)}
          </span>
        </div>
      </Card>

      <div className="mt-4">
        <Button onClick={() => addPaycheck("paycheck")} icon={IconPlus} className="w-full">
          Add paycheck — {fmt(p.netPay)}
        </Button>
      </div>

      <BucketEditor bucket={editBucket} onClose={() => setEditBucket(null)} cadence={d.cadence} netPay={d.pay.netPay}
        onSave={(patch) => { setBucket(editBucket.id, patch); setEditBucket(null); }}
        onDelete={() => { removeBucket(editBucket.id); setEditBucket(null); }} />
      <BucketEditor bucket={addOpen ? mkBucket({ name: "", slot: state.buckets.length % SERIES_SLOTS }) : null}
        isNew cadence={d.cadence} netPay={d.pay.netPay} onClose={() => setAddOpen(false)}
        onSave={(patch) => { addBucket(patch); setAddOpen(false); }} />
    </div>
  );
}

function BucketRow({ alloc, index, last, onEdit, onMove }) {
  const b = alloc.bucket;
  const short = alloc.short > 0.005;
  return (
    <div className="flex items-center gap-2.5 py-2.5" style={{ borderBottom: "1px solid var(--border)" }}>
      <div className="flex flex-col shrink-0">
        <button onClick={() => onMove(-1)} disabled={index === 0} className="p-0.5 pressable" aria-label="Move up"
                style={{ color: index === 0 ? "var(--border)" : "var(--faint)" }}>
          <IconChevron className="w-3 h-3 -rotate-90" />
        </button>
        <button onClick={() => onMove(1)} disabled={last} className="p-0.5 pressable" aria-label="Move down"
                style={{ color: last ? "var(--border)" : "var(--faint)" }}>
          <IconChevron className="w-3 h-3 rotate-90" />
        </button>
      </div>
      <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: slotVar(b.slot) }} />
      <button onClick={onEdit} className="flex-1 min-w-0 text-left pressable">
        <div className="text-[13px] truncate flex items-center gap-1.5">
          {b.name}
          {b.essential && <IconLock className="w-2.5 h-2.5 shrink-0" style={{ color: "var(--faint)" }} />}
          {b.rollover && <IconRotate className="w-2.5 h-2.5 shrink-0" style={{ color: "var(--faint)" }} />}
        </div>
        <div className="text-[10px]" style={{ color: "var(--faint)" }}>
          {FILL_RULES[b.fill]?.label}
          {b.fill === "fillToTarget" && num(b.target) > 0 && ` · ${fmtShort(b.balance)} of ${fmtShort(b.target)}`}
          {num(b.capAnnual) > 0 && ` · ${fmtShort(b.ytd)} of ${fmtShort(b.capAnnual)} cap`}
        </div>
      </button>
      <div className="text-right shrink-0">
        <div className="font-mono-num text-[13px]" style={{ color: short ? "var(--bad)" : "var(--text)" }}>
          {fmt(alloc.amount)}
        </div>
        {short && <div className="text-[10px]" style={{ color: "var(--bad)" }}>−{fmt(alloc.short)} short</div>}
      </div>
    </div>
  );
}

function BucketEditor({ bucket, onClose, onSave, onDelete, isNew, cadence, netPay }) {
  const [draft, setDraft] = useState(bucket);
  useEffect(() => { setDraft(bucket); }, [bucket]);
  if (!bucket || !draft) return null;
  const set = (patch) => setDraft((x) => ({ ...x, ...patch }));

  return (
    <Modal open onClose={onClose} title={isNew ? "New category" : draft.name || "Category"}>
      <div className="space-y-5">
        <TextInput label="Name" value={draft.name} onChange={(v) => set({ name: v })}
          placeholder="Rent, Roth IRA, Car fund…" />

        <Field label="Kind">
          <div className="flex flex-wrap gap-2">
            {Object.entries(BUCKET_KINDS).map(([k, v]) => (
              <Pill key={k} active={draft.kind === k} onClick={() => set({ kind: k })}>{v.label}</Pill>
            ))}
          </div>
        </Field>

        <Field label="How much">
          <div className="flex flex-wrap gap-2 mb-3">
            {Object.entries(FILL_RULES).map(([k, v]) => (
              <Pill key={k} active={draft.fill === k} onClick={() => set({ fill: k })}>{v.label}</Pill>
            ))}
          </div>
          <div className="text-[11px] mb-3 leading-relaxed" style={{ color: "var(--muted)" }}>
            {FILL_RULES[draft.fill]?.hint}
            {FILL_RULES[draft.fill]?.good && (
              <span style={{ color: "var(--faint)" }}> Good for {FILL_RULES[draft.fill].good}.</span>
            )}
          </div>
          {/* The footgun. There's an alert for it after the fact, but the
              moment of choosing is when it's worth saying. */}
          {draft.fill === "remainder" && (
            <div className="text-[11px] mb-3 p-3 rounded-xl leading-relaxed"
                 style={{ background: "var(--warn-soft)", color: "var(--warn)" }}>
              Put this last in the priority order. It empties the paycheck at whatever position
              it sits, so any category below it receives nothing at all.
            </div>
          )}
          {draft.fill !== "remainder" && (
            <LabeledInput
              label={draft.fill === "pctOfNet" ? "Percent of take-home" : "Per month"}
              prefix={draft.fill === "pctOfNet" ? "" : "$"}
              suffix={draft.fill === "pctOfNet" ? "%" : ""}
              value={draft.amountMonthly} onChange={(v) => set({ amountMonthly: v })}
              hint={(() => {
                // A percentage is abstract until it's dollars off the next
                // cheque, and a monthly figure is abstract if you're paid
                // fortnightly. Both get shown as what actually leaves.
                if (draft.fill === "pctOfNet") {
                  return num(netPay) > 0
                    ? `${fmt(num(netPay) * num(draft.amountMonthly) / 100)} out of your ${fmt(netPay)} paycheck`
                    : null;
                }
                return `${fmt(fromMonthly(draft.amountMonthly, cadence))} per paycheck`;
              })()} />
          )}
        </Field>

        {(draft.kind === "expense" || draft.kind === "discretionary") && (
          <>
            <DayPicker label="Due date" value={draft.dueDay} onChange={(v) => set({ dueDay: v })} />
            <Field label="Card category"
              hint="Which rewards category this spending falls under, so the best-card picker can answer for it.">
              <Select value={draft.spendCategory || guessSpendCategory(draft.name)} className="w-full"
                onChange={(v) => set({ spendCategory: v })}
                options={SPEND_CATEGORIES.map((c) => ({ value: c.key, label: c.label }))} />
            </Field>
          </>
        )}

        {(draft.fill === "fillToTarget" || draft.kind === "goal" || draft.kind === "sinking") && (
          <div className="grid grid-cols-2 gap-3">
            <LabeledInput label="Target" prefix="$" value={draft.target} onChange={(v) => set({ target: v })} hint="0 = none" />
            <LabeledInput label="Balance" prefix="$" value={draft.balance} onChange={(v) => set({ balance: v })} />
          </div>
        )}

        {draft.kind === "invest" && (
          <div className="grid grid-cols-2 gap-3">
            <LabeledInput label="Annual limit" prefix="$" value={draft.capAnnual} onChange={(v) => set({ capAnnual: v })} hint="0 = none" />
            <LabeledInput label="Contributed this year" prefix="$" value={draft.ytd} onChange={(v) => set({ ytd: v })} />
          </div>
        )}

        <div className="flex items-center justify-between gap-4 py-1">
          <div>
            <div className="text-[13px]">Roll unspent over</div>
            <div className="text-[11px] leading-relaxed" style={{ color: "var(--faint)" }}>
              Beat this budget and the leftover is still yours next month. Best for things that
              vary — groceries, gas, fun money.
            </div>
          </div>
          <Toggle checked={draft.rollover} onChange={(v) => set({ rollover: v })} />
        </div>

        <div className="flex items-center justify-between gap-4 py-1">
          <div>
            <div className="text-[13px]">Essential</div>
            <div className="text-[11px] leading-relaxed" style={{ color: "var(--faint)" }}>
              Counts toward the emergency-fund target — things you couldn't stop paying.
            </div>
          </div>
          <Toggle checked={draft.essential} onChange={(v) => set({ essential: v })} />
        </div>

        <div>
          <div className="flex items-center justify-between gap-4 py-1">
            <div>
              <div className="text-[13px] flex items-center gap-1.5"><IconUsers className="w-3.5 h-3.5" /> Split with someone</div>
              <div className="text-[11px]" style={{ color: "var(--faint)" }}>Track the full bill and your share separately.</div>
            </div>
            <Toggle checked={!!draft.shared}
              onChange={(v) => set({ shared: v ? { totalAmount: num(draft.amountMonthly) * 2, yourSharePct: 50 } : null })} />
          </div>
          {draft.shared && (
            <div className="grid grid-cols-2 gap-3 mt-3">
              <LabeledInput label="Full bill" prefix="$" value={draft.shared.totalAmount}
                onChange={(v) => set({ shared: { ...draft.shared, totalAmount: v },
                                       amountMonthly: Math.round(v * num(draft.shared.yourSharePct) / 100 * 100) / 100 })} />
              <LabeledInput label="Your share" suffix="%" value={draft.shared.yourSharePct}
                onChange={(v) => set({ shared: { ...draft.shared, yourSharePct: v },
                                       amountMonthly: Math.round(num(draft.shared.totalAmount) * v / 100 * 100) / 100 })} />
              <div className="col-span-2 text-[11px]" style={{ color: "var(--muted)" }}>
                You pay <span className="font-mono-num" style={{ color: "var(--text)" }}>{fmt(draft.amountMonthly)}</span> of
                the {fmt(draft.shared.totalAmount)} bill.
              </div>
            </div>
          )}
        </div>

        <SlotPicker slot={draft.slot} onChange={(i) => set({ slot: i })} />

        <div className="flex gap-2 pt-1">
          <Button className="flex-1" onClick={() => onSave(draft)}>{isNew ? "Add" : "Save"}</Button>
          {!isNew && onDelete && <Button variant="danger" onClick={onDelete} icon={IconTrash}>Delete</Button>}
        </div>
      </div>
    </Modal>
  );
}


// ===================== §11  SPEND =====================
function SpendTab({ state, d, update, setBucket, addBucket, removeBucket, setActual, moveMoney, undoMove, setToast }) {
  const [mk, setMk] = useState(monthKey());
  const [view, setView] = useState("list");     // list | chart
  const [editBucket, setEditBucket] = useState(null);
  const [addOpen, setAddOpen] = useState(false);
  const [moveOpen, setMoveOpen] = useState(false);

  const month = state.months[mk] || { actual: {}, transactions: [] };
  const carry = useMemo(() => computeCarry(state, mk), [state, mk]);
  const trackable = state.buckets.filter((b) => !b.archived && (b.kind === "expense" || b.kind === "discretionary"));
  const actuals = useMemo(() => monthActuals(month), [month]);
  const unfiled = useMemo(() => needsReview(month), [month]);
  // Receivables are deliberately whole-file, not month-scoped: you front the
  // money in one month and get paid back in another.
  const owedSplit = useMemo(() => owedBreakdown(state), [state]);
  const owedOpen = owedSplit.open;
  const owedTotal = owedSplit.total;
  const [query, setQuery] = useState("");
  const found = useMemo(() => searchTxns(state, query), [state, query]);
  const hasTxns = (month.transactions || []).length > 0;
  const [splitting, setSplitting] = useState(null);
  const [settling, setSettling] = useState(null);

  const rows = trackable.map((b) => ({
    id: b.id, name: b.name, slot: b.slot, bucket: b,
    budget: availableFor(b, mk, state, carry),
    base: num(month.budget?.[b.id] ?? b.amountMonthly),
    carried: num(carry[b.id]),
    actual: actuals[b.id],
    fromTxns: actualSource(month, b.id) === "transactions",
    txns: liveTxns(month).filter((t) => String(t.bucketId) === String(b.id)),
  }));

  const budgeted = rows.reduce((s, r) => s + r.budget, 0);
  const actualTotal = rows.reduce((s, r) => s + num(r.actual), 0);
  const logged = rows.filter((r) => r.actual !== undefined && r.actual !== null).length;

  const rollingAvg = (bucketId, months = 3) => {
    const vals = [];
    for (let i = 1; i <= months; i++) {
      const v = monthActuals(state.months[addMonths(mk, -i)] || {})[bucketId];
      if (v !== undefined && v !== null) vals.push(num(v));
    }
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  };

  const setTxn = (txnId, patch) => update((s) => ({
    ...s,
    months: { ...s.months, [mk]: { ...s.months[mk],
      transactions: (s.months[mk].transactions || []).map((t) =>
        t.id === txnId ? { ...t, ...patch, edited: true } : t) } },
  }));
  const removeTxn = (txnId) => update((s) => ({
    ...s,
    months: { ...s.months, [mk]: { ...s.months[mk],
      transactions: (s.months[mk].transactions || []).filter((t) => t.id !== txnId) } },
  }));

  /** Replace one transaction with its split parts. */
  const applySplit = (txn, parts) => {
    const res = splitTransaction(txn, parts);
    if (!res.ok) { setToast(res.error); return false; }
    update((s) => ({
      ...s,
      months: { ...s.months, [mk]: { ...s.months[mk],
        transactions: [...(s.months[mk].transactions || []).filter((t) => t.id !== txn.id), ...res.parts] } },
    }));
    const yours = res.parts.filter((p) => !p.excluded).reduce((a, p) => a + num(p.amount), 0);
    setToast(`Split — ${fmt(yours)} counted as yours`);
    return true;
  };

  /**
   * Someone paid you back. The repayment lands in the month the money actually
   * arrived, which is usually not the month of the original charge — and it's
   * excluded, so it cancels the debt instead of showing up as income.
   */
  const recordRepayment = (r, amount, date) => {
    const line = mkSettlement(r, amount, date);
    const target = String(line.date).slice(0, 7);
    update((s) => {
      const m = s.months[target] || { actual: {}, transactions: [], imports: [] };
      return { ...s, months: { ...s.months, [target]:
        { ...m, transactions: [...(m.transactions || []), line] } } };
    });
    const left = Math.round((r.outstanding - num(amount)) * 100) / 100;
    setToast(left > 0.01 ? `${fmt(amount)} in — ${fmt(left)} still owed` : "Settled up");
  };

  /** They're never paying. It becomes your spending, back in the month it hit. */
  const writeOff = (r, bucketId) => {
    update((s) => ({ ...s, months: { ...s.months, [r.monthKey]:
      { ...s.months[r.monthKey], transactions: (s.months[r.monthKey].transactions || [])
        .map((t) => (t.id === r.id ? writeOffReceivable(t, bucketId, r.outstanding) : t)) } } }));
    setToast(`${fmt(r.outstanding)} counted as yours`);
  };

  const monthOptions = Array.from({ length: 12 }, (_, i) => addMonths(monthKey(), -i));
  const essentials = rows.filter((r) => r.bucket.essential);
  const rest = rows.filter((r) => !r.bucket.essential);
  const moves = month.moves || [];

  return (
    <div>
      <div className="flex items-center gap-2 mb-4">
        <Select value={mk} onChange={setMk} className="flex-1"
          options={monthOptions.map((k) => ({ value: k, label: monthLabel(k) }))} />
        <div className="flex rounded-2xl p-1" style={{ background: "var(--card-2)", border: "1px solid var(--border)" }}>
          {[["list", IconCard], ["chart", IconChart]].map(([k, I]) => (
            <button key={k} onClick={() => setView(k)} aria-label={k}
              className="px-3 py-2 rounded-xl pressable"
              style={{ background: view === k ? "var(--card)" : "transparent",
                       color: view === k ? "var(--accent-text)" : "var(--faint)" }}>
              <I className="w-4 h-4" />
            </button>
          ))}
        </div>
      </div>

      <Card className="mb-1">
        <div className="flex gap-4 mb-4">
          <Stat label="Spent" value={fmt0(actualTotal)}
            color={logged === 0 ? "var(--faint)" : actualTotal > budgeted ? "var(--bad)" : "var(--text)"}
            sub={`of ${fmt0(budgeted)} planned`} />
          <Stat label={actualTotal > budgeted ? "Over by" : "Left"}
            value={logged === 0 ? "—" : fmt0(Math.abs(budgeted - actualTotal))}
            color={actualTotal > budgeted ? "var(--bad)" : "var(--good)"}
            sub={`${logged}/${rows.length} logged`} align="right" />
        </div>
        <ProgressBar value={budgeted > 0 ? actualTotal / budgeted : 0}
          color={actualTotal > budgeted ? "var(--st-crit)" : "var(--st-good)"} />
        <div className="flex gap-2 mt-4">
          <Button size="sm" variant="ghost" className="flex-1" onClick={() => setMoveOpen(true)} icon={IconArrowUp}>
            Move money
          </Button>
          <Button size="sm" variant="ghost" className="flex-1" onClick={() => setAddOpen(true)} icon={IconPlus}>
            Category
          </Button>
        </div>
      </Card>

      {moves.length > 0 && (
        <Card className="mt-3">
          <div className="text-[11px] mb-2 font-medium" style={{ color: "var(--muted)" }}>
            Moved this month
          </div>
          {moves.map((mv) => {
            const from = state.buckets.find((b) => b.id === mv.from);
            const to = state.buckets.find((b) => b.id === mv.to);
            return (
              <div key={mv.id} className="flex items-center gap-2 py-1.5 text-[12px]">
                <span className="font-mono-num" style={{ color: "var(--accent-text)" }}>{fmt(mv.amount)}</span>
                <span style={{ color: "var(--faint)" }}>{from?.name} → {to?.name}</span>
                <button onClick={() => undoMove(mk, mv.id)} className="ml-auto p-1 pressable" style={{ color: "var(--faint)" }}>
                  <IconX className="w-3 h-3" />
                </button>
              </div>
            );
          })}
        </Card>
      )}

      {view === "chart" ? (
        <>
          <SectionLabel>Where it went</SectionLabel>
          <Card className="mb-1">
            <CategoryDonut rows={rows.filter((r) => num(r.actual) > 0)
              .map((r) => ({ name: r.name, value: num(r.actual), slot: r.slot }))} />
          </Card>
          <SectionLabel>Planned vs actual</SectionLabel>
          <Card>
            <BudgetBars rows={rows} showAll />
          </Card>
        </>
      ) : (
        <>
          {/* Search runs across every month, not the one on screen — the
              question is almost always "what do I spend here", not "what did I
              spend here in July". */}
          {hasTxns && (
            <div className="mb-4">
              <div className="flex items-center gap-2 rounded-2xl px-3"
                   style={{ background: "var(--card)", border: "1px solid var(--border)" }}>
                <IconSearch className="w-3.5 h-3.5 shrink-0" style={{ color: "var(--faint)" }} />
                <input value={query} onChange={(e) => setQuery(e.target.value)}
                  placeholder="Search every month — a merchant, a description"
                  className="w-full bg-transparent outline-none py-2.5 text-[13px]"
                  style={{ color: "var(--text)" }} />
                {query && (
                  <button onClick={() => setQuery("")} className="p-1 pressable shrink-0"
                          style={{ color: "var(--faint)" }} aria-label="Clear search">
                    <IconX className="w-3.5 h-3.5" />
                  </button>
                )}
              </div>
              {found.ok && (
                <Card className="mt-1">
                  {found.count === 0 ? (
                    <div className="text-[11px] py-2" style={{ color: "var(--muted)" }}>
                      Nothing matches “{query}”.
                    </div>
                  ) : (
                    <>
                      <div className="flex gap-4 mb-3 pb-3" style={{ borderBottom: "1px solid var(--border)" }}>
                        <Stat label={`${found.count} charge${found.count === 1 ? "" : "s"}`}
                              value={fmt(found.total)} />
                        <Stat label="Across" value={`${found.months} month${found.months === 1 ? "" : "s"}`} />
                        <Stat label="Average" value={fmt(found.total / Math.max(1, found.count))} align="right" />
                      </div>
                      <div className="rounded-2xl overflow-hidden" style={{ border: "1px solid var(--border)" }}>
                        {found.matches.slice(0, 40).map((t, i) => (
                          <div key={t.id} className="flex items-baseline gap-2 px-3 py-2"
                               style={{ borderBottom: i === Math.min(39, found.matches.length - 1)
                                 ? "none" : "1px solid var(--border)" }}>
                            <div className="min-w-0 flex-1">
                              <div className="text-[12px] truncate">{t.merchant || t.description}</div>
                              <div className="text-[10px]" style={{ color: "var(--faint)" }}>
                                {t.date}{t.source ? ` · ${t.source}` : ""}
                                {t.excluded ? ` · ${t.excludeReason || "not counted"}` : ""}
                              </div>
                            </div>
                            <span className="font-mono-num text-[12px] shrink-0"
                                  style={{ color: t.excluded ? "var(--faint)" : "var(--text)" }}>
                              {fmt(t.amount)}
                            </span>
                          </div>
                        ))}
                      </div>
                      {found.matches.length > 40 && (
                        <div className="text-[10px] mt-2 text-center" style={{ color: "var(--faint)" }}>
                          Showing the 40 most recent of {found.matches.length}.
                        </div>
                      )}
                    </>
                  )}
                </Card>
              )}
            </div>
          )}

          {/* Statement lines that couldn't be categorised — review these first,
              because until they're filed they aren't counted anywhere. */}
          {unfiled.length > 0 && (() => {
            const unfiledOnly = unfiled.filter((t) => t.bucketId === null || t.bucketId === undefined);
            const guesses = unfiled.filter((t) => t.bucketId !== null && t.bucketId !== undefined);
            return (
              <>
                <SectionLabel>Needs your call</SectionLabel>
                <Card className="mb-1" style={{ borderColor: "var(--warn)" }}>
                  <div className="text-[11px] leading-relaxed mb-3" style={{ color: "var(--muted)" }}>
                    {unfiledOnly.length > 0 && (
                      <>{unfiledOnly.length} transaction{unfiledOnly.length === 1 ? "" : "s"} totalling{" "}
                      {fmt(unfiledOnly.reduce((s, t) => s + num(t.amount), 0))}{" "}
                      {unfiledOnly.length === 1 ? "has" : "have"} no category. </>
                    )}
                    {guesses.length > 0 && (
                      <>{guesses.length} {unfiledOnly.length > 0 ? "more were" : guesses.length === 1 ? "was" : "were"} guessed
                      and {guesses.length === 1 ? "is" : "are"} worth checking — confirming one clears it.</>
                    )}
                  </div>
                  {unfiled.map((t, i) => (
                    <TxnRow key={t.id} txn={t} buckets={trackable} last={i === unfiled.length - 1}
                      review onChange={(patch) => setTxn(t.id, patch)} onDelete={() => removeTxn(t.id)}
                      onSplit={() => setSplitting(t)} />
                  ))}
                </Card>
              </>
            );
          })()}

          {owedOpen.length > 0 && (
            <>
              <SectionLabel right={<span className="font-mono-num text-[11px]"
                style={{ color: "var(--text)" }}>{fmt(owedTotal)}</span>}>Owed to you</SectionLabel>
              <Card className="mb-1">
                <div className="text-[11px] leading-relaxed mb-3" style={{ color: "var(--muted)" }}>
                  Money you fronted that's coming back. It isn't your spending, but it did leave your
                  account — so it stays here until the repayment lands or you decide it never will.
                </div>
                {owedSplit.workTotal > 0 && owedSplit.personTotal > 0 && (
                  <div className="flex gap-4 mb-3 pb-3" style={{ borderBottom: "1px solid var(--border)" }}>
                    <Stat label="Work owes you" value={fmt0(owedSplit.workTotal)} />
                    <Stat label="People owe you" value={fmt0(owedSplit.personTotal)} align="right" />
                  </div>
                )}
                <div className="rounded-2xl overflow-hidden" style={{ border: "1px solid var(--border)" }}>
                  {owedOpen.map((r, i) => (
                    <div key={r.id} className="px-3 py-2.5"
                      style={{ borderBottom: i === owedOpen.length - 1 ? "none" : "1px solid var(--border)" }}>
                      <div className="flex items-baseline gap-2">
                        <div className="min-w-0 flex-1">
                          <div className="text-[12px] truncate">{r.merchant || r.description}</div>
                          <div className="text-[10px]" style={{ color: "var(--faint)" }}>
                            {r.date}{r.excludeReason ? ` · ${r.excludeReason}` : ""}
                            {r.paidBack > 0 ? ` · ${fmt(r.paidBack)} back so far` : ""}
                          </div>
                        </div>
                        <span className="font-mono-num text-[13px] shrink-0">{fmt(r.outstanding)}</span>
                      </div>
                      <div className="flex gap-2 mt-2">
                        {/* "They" is wrong for an expense claim — an employer
                            reimburses, a friend pays you back. */}
                        <button onClick={() => setSettling(r)}
                          className="text-[10px] px-2.5 py-1.5 rounded-full pressable"
                          style={{ background: "var(--card-2)", color: "var(--accent-text)",
                                   border: "1px solid var(--border)" }}>
                          {r.owedType === "work" ? "Work reimbursed it" : "They paid me back"}
                        </button>
                        <button onClick={() => setSettling({ ...r, mode: "writeoff" })}
                          className="text-[10px] px-2.5 py-1.5 rounded-full pressable"
                          style={{ background: "transparent", color: "var(--muted)",
                                   border: "1px solid var(--border)" }}>
                          {r.owedType === "work" ? "Never reimbursed" : "They're not paying"}
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </Card>
            </>
          )}

          <SectionLabel right={hasTxns
            ? <span className="text-[11px]" style={{ color: "var(--faint)" }}>tap a row to expand</span>
            : null}>Essentials</SectionLabel>
          <Card className="mb-1">
            {essentials.length === 0
              ? <EmptyState title="No essential categories"
                  body="Mark rent, groceries and insurance as essential so the emergency-fund target knows what it's covering." />
              : essentials.map((r, i) => (
                  <SpendRow key={r.id} row={r} avg={rollingAvg(r.id)} last={i === essentials.length - 1}
                    month={month} buckets={trackable}
                    onActual={(v) => setActual(mk, r.id, v)} onEdit={() => setEditBucket(r.bucket)}
                    onTxnChange={setTxn} onTxnDelete={removeTxn} onTxnSplit={setSplitting}
                    isCurrentMonth={mk === monthKey()} trend={categoryTrend(state, r.id, 6, mk)}
                    onAdopt={(v) => { setBucket(r.id, { amountMonthly: Math.round(v) }); setToast(`${r.name} set to ${fmt(Math.round(v))}`); }} />
                ))}
          </Card>

          <SectionLabel>Everything else</SectionLabel>
          <Card>
            {rest.length === 0
              ? <EmptyState title="No discretionary categories" />
              : rest.map((r, i) => (
                  <SpendRow key={r.id} row={r} avg={rollingAvg(r.id)} last={i === rest.length - 1}
                    month={month} buckets={trackable}
                    onActual={(v) => setActual(mk, r.id, v)} onEdit={() => setEditBucket(r.bucket)}
                    onTxnChange={setTxn} onTxnDelete={removeTxn} onTxnSplit={setSplitting}
                    isCurrentMonth={mk === monthKey()} trend={categoryTrend(state, r.id, 6, mk)}
                    onAdopt={(v) => { setBucket(r.id, { amountMonthly: Math.round(v) }); setToast(`${r.name} set to ${fmt(Math.round(v))}`); }} />
                ))}
          </Card>
        </>
      )}

      <SplitSheet txn={splitting} buckets={trackable} onClose={() => setSplitting(null)}
        onSplit={(parts) => { if (applySplit(splitting, parts)) setSplitting(null); }} />

      <SettleSheet receivable={settling} buckets={trackable} onClose={() => setSettling(null)}
        onSettle={(amt, date) => { recordRepayment(settling, amt, date); setSettling(null); }}
        onWriteOff={(bucketId) => { writeOff(settling, bucketId); setSettling(null); }} />

      <MoveMoneySheet open={moveOpen} onClose={() => setMoveOpen(false)} rows={rows}
        onMove={(from, to, amt) => { moveMoney(mk, from, to, amt); setMoveOpen(false); }} />

      <BucketEditor bucket={editBucket} onClose={() => setEditBucket(null)} cadence={d.cadence} netPay={d.pay.netPay}
        onSave={(patch) => { setBucket(editBucket.id, patch); setEditBucket(null); }}
        onDelete={() => { removeBucket(editBucket.id); setEditBucket(null); }} />
      <BucketEditor bucket={addOpen ? mkBucket({ name: "", kind: "expense", slot: state.buckets.length % SERIES_SLOTS }) : null}
        isNew cadence={d.cadence} netPay={d.pay.netPay} onClose={() => setAddOpen(false)}
        onSave={(patch) => { addBucket(patch); setAddOpen(false); }} />
    </div>
  );
}

function SpendRow({ row: r, avg, onActual, onEdit, onAdopt, last, month, buckets,
                    onTxnChange, onTxnDelete, onTxnSplit, isCurrentMonth, trend }) {
  const [editing, setEditing] = useState(false);
  const [open, setOpen] = useState(false);
  const [draft, setDraft] = useState(num(r.actual));
  const has = r.actual !== undefined && r.actual !== null;
  const variance = has ? num(r.actual) - r.budget : 0;
  const over = variance > 0.5;
  // Pace only means anything mid-month. On a closed month the total is the
  // answer and a projection is noise.
  const pace = isCurrentMonth && has ? spendingPace(r.budget, r.actual) : null;
  const suggest = avg !== null && Math.abs(avg - r.base) > Math.max(15, r.base * 0.12);
  const commit = () => { onActual(draft); setEditing(false); };
  const txns = r.txns || [];
  const merchants = useMemo(() => (r.fromTxns ? merchantRollup(month, r.id) : []), [month, r.id, r.fromTxns]);

  return (
    <div style={{ borderBottom: last ? "none" : "1px solid var(--border)" }}>
      <div className="py-3">
        <div className="flex items-center gap-2.5">
          <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: slotVar(r.slot) }} />
          <button onClick={() => (r.fromTxns ? setOpen(!open) : onEdit())}
                  className="flex-1 min-w-0 text-left pressable">
            <div className="text-[13px] truncate flex items-center gap-1.5">
              {r.name}
              {r.bucket.rollover && <IconRotate className="w-2.5 h-2.5 shrink-0" style={{ color: "var(--faint)" }} />}
              {r.fromTxns && (
                <IconChevron className="w-3 h-3 shrink-0"
                  style={{ color: "var(--faint)", transform: open ? "rotate(90deg)" : "none",
                           transition: "transform .15s var(--ease)" }} />
              )}
            </div>
            <div className="text-[10px]" style={{ color: "var(--faint)" }}>
              {fmt0(r.budget)} available
              {Math.abs(r.carried) > 0.5 && (
                <span style={{ color: r.carried > 0 ? "var(--good)" : "var(--bad)" }}>
                  {" "}({r.carried > 0 ? "+" : "−"}{fmt0(Math.abs(r.carried))} carried)
                </span>
              )}
              {r.fromTxns && ` · ${txns.length} transaction${txns.length === 1 ? "" : "s"}`}
              {r.bucket.shared && ` · your ${num(r.bucket.shared.yourSharePct)}% of ${fmtShort(r.bucket.shared.totalAmount)}`}
            </div>
          </button>

          {/* When the number comes from statements, it isn't hand-editable —
              you change the underlying transactions instead. */}
          {r.fromTxns ? (
            <button onClick={() => setOpen(!open)} className="text-right shrink-0 pressable">
              <div className="font-mono-num text-[14px]" style={{ color: over ? "var(--bad)" : "var(--good)" }}>
                {fmt(r.actual)}
              </div>
              {Math.abs(variance) > 0.5 && (
                <div className="text-[10px] font-mono-num" style={{ color: over ? "var(--bad)" : "var(--good)" }}>
                  {over ? "over " : "under "}{fmt0(Math.abs(variance))}
                </div>
              )}
            </button>
          ) : editing ? (
            <div className="flex items-center rounded-xl px-2 shrink-0"
                 style={{ background: "var(--card-2)", border: "1px solid var(--accent)" }}>
              <span className="text-[12px]" style={{ color: "var(--faint)" }}>$</span>
              <NumInput value={draft} onChange={setDraft} autoFocus onBlur={commit}
                onKeyDown={(e) => { if (e.key === "Enter") commit(); }}
                className="w-20 bg-transparent outline-none py-1.5 font-mono-num text-[14px] text-right"
                style={{ color: "var(--text)" }} />
            </div>
          ) : (
            <button onClick={() => { setDraft(has ? num(r.actual) : Math.round(r.budget)); setEditing(true); }}
              className="text-right shrink-0 pressable">
              <div className="font-mono-num text-[14px]"
                   style={{ color: !has ? "var(--accent-text)" : over ? "var(--bad)" : "var(--good)" }}>
                {has ? fmt(r.actual) : "log"}
              </div>
              {has && Math.abs(variance) > 0.5 && (
                <div className="text-[10px] font-mono-num" style={{ color: over ? "var(--bad)" : "var(--good)" }}>
                  {over ? "over " : "under "}{fmt0(Math.abs(variance))}
                </div>
              )}
            </button>
          )}
        </div>
        {/* The overspend warning that arrives while it's still avoidable. */}
        {pace && pace.ok && pace.ahead && !over && (
