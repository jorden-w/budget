          <div className="text-[10px] mt-2 ml-5 flex items-center gap-1.5" style={{ color: "var(--warn)" }}>
            <IconAlert className="w-3 h-3 shrink-0" />
            <span>
              {(pace.spentPct * 100).toFixed(0)}% spent on day {pace.day} of {pace.daysInMonth} —
              on track for {fmt0(pace.projected)}, about {fmt0(pace.overBy)} over
            </span>
          </div>
        )}
        {suggest && (
          <button onClick={() => onAdopt(avg)} className="text-[10px] mt-2 ml-5 px-2.5 py-1.5 rounded-full pressable"
            style={{ background: "var(--card-2)", color: "var(--accent-text)", border: "1px solid var(--border)" }}>
            3-month average is {fmt0(avg)} — set the budget to match
          </button>
        )}
      </div>

      {open && r.fromTxns && (
        <div className="pb-3 animate-fade-in">
          {trend && trend.filter((p) => p.value !== null).length > 1 && (
            <div className="mb-3 p-3 rounded-2xl" style={{ background: "var(--card-2)" }}>
              <div className="text-[10px] mb-1 font-medium" style={{ color: "var(--muted)" }}>
                By month{num(r.base) > 0 && <span style={{ color: "var(--faint)" }}> · dashed line is the {fmt0(r.base)} budget</span>}
              </div>
              <TrendChart trend={trend} budget={r.base} slot={r.slot} />
            </div>
          )}
          {merchants.length > 1 && (
            <div className="mb-3 p-3 rounded-2xl" style={{ background: "var(--card-2)" }}>
              <div className="text-[10px] mb-2 font-medium" style={{ color: "var(--muted)" }}>Top merchants</div>
              {merchants.slice(0, 5).map((m) => (
                <div key={m.merchant} className="flex items-baseline justify-between gap-2 py-0.5">
                  <span className="text-[11px] truncate" style={{ color: "var(--muted)" }}>{m.merchant}</span>
                  <span className="font-mono-num text-[11px] shrink-0">
                    {fmt0(m.total)} <span style={{ color: "var(--faint)" }}>({m.count})</span>
                  </span>
                </div>
              ))}
            </div>
          )}
          <div className="rounded-2xl overflow-hidden" style={{ border: "1px solid var(--border)" }}>
            {/* Splitting used to be reachable only from the review list, so
                once a line was confirmed it could never be divided — and you
                usually only realise a charge was shared much later. */}
            {txns.sort((a, b) => (a.date < b.date ? -1 : 1)).map((t, i) => (
              <TxnRow key={t.id} txn={t} buckets={buckets} last={i === txns.length - 1}
                onChange={(patch) => onTxnChange(t.id, patch)} onDelete={() => onTxnDelete(t.id)}
                onSplit={() => onTxnSplit(t)} />
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/** One statement line: tap to edit its amount, category, or split it. */
function TxnRow({ txn: t, buckets, last, onChange, onDelete, onSplit, review }) {
  const [open, setOpen] = useState(false);
  const [amt, setAmt] = useState(num(t.amount));
  useEffect(() => { setAmt(num(t.amount)); }, [t.amount]);
  const unsure = t.confidence === "low" && !t.edited;
  const bucketName = (buckets.find((b) => String(b.id) === String(t.bucketId)) || {}).name;

  return (
    <div style={{ borderBottom: last ? "none" : "1px solid var(--border)" }}>
      <button onClick={() => setOpen(!open)} className="w-full flex items-center gap-2.5 px-3 py-2.5 text-left pressable">
        <div className="min-w-0 flex-1">
          <div className="text-[12px] truncate flex items-center gap-1.5">
            {t.merchant || t.description}
            {unsure && <span className="text-[9px] px-1.5 py-0.5 rounded-full shrink-0"
              style={{ background: "var(--warn-soft)", color: "var(--warn)" }}>not sure</span>}
            {t.splitGroup && <span className="text-[9px] px-1.5 py-0.5 rounded-full shrink-0"
              style={{ background: "var(--card-2)", color: "var(--muted)" }}>split</span>}
          </div>
          <div className="text-[10px]" style={{ color: "var(--faint)" }}>
            {t.date}{t.source ? ` · ${t.source}` : ""}
            {t.splitNote ? ` · ${t.splitNote}` : ""}
            {review && bucketName ? ` · guessed ${bucketName}` : ""}
            {t.edited ? " · edited" : ""}
          </div>
        </div>
        <span className="font-mono-num text-[13px] shrink-0">{fmt(t.amount)}</span>
        <IconChevron className="w-3 h-3 shrink-0" style={{ color: "var(--faint)",
          transform: open ? "rotate(90deg)" : "none", transition: "transform .15s var(--ease)" }} />
      </button>

      {open && (
        <div className="px-3 pb-3 animate-fade-in" style={{ background: "var(--card-2)" }}>
          <div className="text-[10px] pt-2 pb-2 leading-relaxed" style={{ color: "var(--faint)" }}>
            {t.description}
          </div>
          <div className="grid grid-cols-2 gap-2">
            <Field label={t.splitGroup ? "Your share" : "Amount"}>
              <div className="flex items-center rounded-xl px-2.5"
                   style={{ background: "var(--card)", border: "1px solid var(--border)" }}>
                <span className="text-[12px]" style={{ color: "var(--faint)" }}>$</span>
                <NumInput value={amt} onChange={setAmt} onBlur={() => onChange({ amount: amt })}
                  onKeyDown={(e) => { if (e.key === "Enter") { onChange({ amount: amt }); e.target.blur(); } }}
                  className="w-full bg-transparent outline-none py-2 font-mono-num text-[13px] text-right"
                  style={{ color: "var(--text)" }} />
              </div>
            </Field>
            <Field label="Category">
              <Select value={t.bucketId === null || t.bucketId === undefined ? "" : String(t.bucketId)}
                className="w-full !py-2 !text-[12px]"
                onChange={(v) => onChange({ bucketId: v === "" ? null : (isNaN(Number(v)) ? v : Number(v)),
                                            confidence: "high" })}
                options={[{ value: "", label: "Uncategorised" },
                          ...buckets.map((b) => ({ value: String(b.id), label: b.name }))]} />
            </Field>
          </div>

          {unsure && (
            <button onClick={() => onChange({ confidence: "high", edited: true })}
              className="w-full mt-3 text-[11px] py-2 rounded-xl pressable font-medium"
              style={{ background: "var(--good-soft)", color: "var(--good)", border: "1px solid var(--good)33" }}>
              {bucketName ? `${bucketName} is right — confirm` : "Confirm"}
            </button>
          )}

          <div className="flex items-center gap-2 mt-3">
            {onSplit && !t.splitGroup && (
              <button onClick={onSplit} className="text-[11px] px-2.5 py-1.5 rounded-full pressable flex items-center gap-1.5"
                style={{ background: "var(--card)", border: "1px solid var(--border)", color: "var(--muted)" }}>
                <IconUsers className="w-3 h-3" /> Split
              </button>
            )}
            <button onClick={() => onChange({ excluded: !t.excluded, excludeReason: t.excluded ? "" : "excluded by hand" })}
              className="text-[11px] px-2.5 py-1.5 rounded-full pressable"
              style={{ background: "var(--card)", border: "1px solid var(--border)",
                       color: t.excluded ? "var(--warn)" : "var(--muted)" }}>
              {t.excluded ? "Excluded — count it" : "Don't count this"}
            </button>
            <button onClick={onDelete} className="p-2 pressable ml-auto" style={{ color: "var(--faint)" }}
                    aria-label="Delete transaction">
              <IconTrash className="w-3.5 h-3.5" />
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/**
 * Divide one charge. Two modes, because two different things happen:
 *   • You paid for a group — keep your share, drop the rest.
 *   • One charge spans categories — split it across them.
 */
function SplitSheet({ txn, buckets, onClose, onSplit }) {
  const [mode, setMode] = useState("people");
  const [ways, setWays] = useState(2);
  const [parts, setParts] = useState([]);
  const [mine, setMine] = useState(0);

  // Every hook stays above the early return — `mine` was declared after it,
  // which changes the hook count between renders and takes the app down.
  const total = num(txn?.amount);
  const each = Math.round(total / ways * 100) / 100;
  const othersShare = Math.round((total - each) * 100) / 100;

  useEffect(() => {
    if (!txn) return;
    setMode("people"); setWays(2);
    setParts([{ amount: Math.round(num(txn.amount) / 2 * 100) / 100, bucketId: txn.bucketId },
              { amount: num(txn.amount) - Math.round(num(txn.amount) / 2 * 100) / 100, bucketId: txn.bucketId }]);
  }, [txn]);
  // An even split is the starting guess; the field below can override it.
  useEffect(() => { setMine(each); }, [each]);

  if (!txn) return null;
  const partsTotal = parts.reduce((s, p) => s + num(p.amount), 0);
  const off = Math.round((partsTotal - total) * 100) / 100;

  const setPart = (i, patch) => setParts((ps) => ps.map((p, j) => (j === i ? { ...p, ...patch } : p)));

  return (
    <Modal open onClose={onClose} title="Split this charge"
      subtitle={`${txn.merchant || txn.description} · ${fmt(total)}`}>
      <div className="space-y-5">
        <div className="flex gap-2">
          <Pill active={mode === "people"} onClick={() => setMode("people")}>Between people</Pill>
          <Pill active={mode === "category"} onClick={() => setMode("category")}>Across categories</Pill>
        </div>

        {mode === "people" ? (
          <>
            <Field label="How many people, including you?"
              hint="Your share is what counts as spending. The rest becomes money owed to you, so it's still tracked until the Venmo lands.">
              <div className="flex gap-2 flex-wrap">
                {[2, 3, 4, 5, 6, 7, 8].map((n) => (
                  <Pill key={n} active={ways === n} onClick={() => setWays(n)}>{n}</Pill>
                ))}
              </div>
            </Field>
            <div className="p-4 rounded-2xl" style={{ background: "var(--card-2)" }}>
              <Row label="Full charge" value={fmt(total)} />
              <Row indent label={`Owed back by ${ways - 1} other${ways - 1 === 1 ? "" : "s"}`}
                value={`−${fmt(Math.round((total - mine) * 100) / 100)}`} color="var(--muted)" />
              <Divider my={1} />
              <div className="flex items-center justify-between gap-3 pt-1">
                <span className="text-[13px] font-semibold">Your share</span>
                {/* Editable, because an even split is a starting guess rather
                    than the truth — you cover someone's ticket but not their
                    drinks far more often than everyone pays exactly 1/n. */}
                <div className="flex items-center rounded-xl px-2.5 shrink-0"
                     style={{ background: "var(--card)", border: "1px solid var(--border)" }}>
                  <span className="text-[12px]" style={{ color: "var(--faint)" }}>$</span>
                  <NumInput value={mine} onChange={setMine}
                    className="w-20 bg-transparent outline-none py-2 font-mono-num text-[14px] text-right"
                    style={{ color: "var(--text)" }} />
                </div>
              </div>
              {mine > total + 0.01 && (
                <div className="text-[11px] mt-2" style={{ color: "var(--bad)" }}>
                  More than the {fmt(total)} charge.
                </div>
              )}
            </div>
            <Field label="Your share goes to">
              <Select value={String(txn.bucketId ?? "")} className="w-full"
                onChange={(v) => setParts((ps) => ps.map((p) => ({ ...p, bucketId: v === "" ? null : Number(v) })))}
                options={[{ value: "", label: "Uncategorised" },
                          ...buckets.map((b) => ({ value: String(b.id), label: b.name }))]} />
            </Field>
            <Button className="w-full" onClick={() => {
              const target = parts[0]?.bucketId ?? txn.bucketId;
              const yours = Math.round(num(mine) * 100) / 100;
              onSplit([
                { amount: yours, bucketId: target, note: `your share, 1 of ${ways}` },
                { amount: Math.round((total - yours) * 100) / 100, excluded: true, owed: true,
                  excludeReason: `covering ${ways - 1} other${ways - 1 === 1 ? "" : "s"}`,
                  note: `${ways - 1} of ${ways}` },
              ]);
            }} disabled={num(mine) <= 0 || num(mine) > total + 0.01}>
              Keep {fmt(mine)} as mine
            </Button>
          </>
        ) : (
          <>
            <Field label="Parts" hint="They have to add up to the original charge.">
              <div className="space-y-2">
                {parts.map((p, i) => (
                  <div key={i} className="flex items-center gap-2">
                    <div className="flex items-center rounded-xl px-2.5 w-24 shrink-0"
                         style={{ background: "var(--card-2)", border: "1px solid var(--border)" }}>
                      <span className="text-[12px]" style={{ color: "var(--faint)" }}>$</span>
                      <NumInput value={p.amount} onChange={(v) => setPart(i, { amount: v })}
                        className="w-full bg-transparent outline-none py-2 font-mono-num text-[13px] text-right"
                        style={{ color: "var(--text)" }} />
                    </div>
                    <Select value={String(p.bucketId ?? "")} className="flex-1 !py-2 !text-[12px]"
                      onChange={(v) => setPart(i, { bucketId: v === "" ? null : Number(v) })}
                      options={[{ value: "", label: "Uncategorised" },
                                ...buckets.map((b) => ({ value: String(b.id), label: b.name }))]} />
                    {parts.length > 2 && (
                      <button onClick={() => setParts((ps) => ps.filter((_, j) => j !== i))}
                        className="p-1.5 pressable shrink-0" style={{ color: "var(--faint)" }}>
                        <IconTrash className="w-3.5 h-3.5" />
                      </button>
                    )}
                  </div>
                ))}
              </div>
            </Field>
            <div className="flex items-center justify-between gap-2">
              <Button variant="ghost" size="sm"
                onClick={() => setParts((ps) => [...ps, { amount: 0, bucketId: txn.bucketId }])}>
                Add a part
              </Button>
              <span className="font-mono-num text-[12px]"
                    style={{ color: Math.abs(off) < 0.02 ? "var(--good)" : "var(--bad)" }}>
                {fmt(partsTotal)} of {fmt(total)}
                {Math.abs(off) >= 0.02 && (off > 0 ? ` · ${fmt(off)} over` : ` · ${fmt(-off)} left`)}
              </span>
            </div>
            <Button className="w-full" disabled={Math.abs(off) >= 0.02}
              onClick={() => onSplit(parts)}>Split into {parts.length} parts</Button>
          </>
        )}
      </div>
    </Modal>
  );
}

/**
 * Close out money you fronted — either they paid you back, or they didn't.
 *
 * The two outcomes are genuinely different and the app can't guess which
 * happened. A repayment cancels the debt and touches no category. A write-off
 * moves the money into your spending, in the month you were originally
 * charged, because that's when it actually left.
 */
function SettleSheet({ receivable: r, buckets, onClose, onSettle, onWriteOff }) {
  const writeoff = r?.mode === "writeoff";
  const isWork = r?.owedType === "work";
  const [amount, setAmount] = useState(0);
  const [date, setDate] = useState(todayISO());
  const [bucketId, setBucketId] = useState(null);
  useEffect(() => {
    if (!r) return;
    setAmount(r.outstanding);
    setDate(todayISO());
    // Default to whatever category your own share of the same charge landed
    // in — if you write off concert tickets, they're still fun money.
    setBucketId(r.siblingBucketId ?? r.bucketId ?? null);
  }, [r?.id, r?.mode]);
  if (!r) return null;

  const partial = num(amount) > 0 && num(amount) < r.outstanding - 0.01;
  const tooMuch = num(amount) > r.outstanding + 0.01;

  return (
    <Modal open onClose={onClose}
      title={writeoff ? "Count it as yours" : isWork ? "Mark it reimbursed" : "Mark it paid back"}
      subtitle={`${r.merchant || r.description} · ${fmt(r.outstanding)} outstanding`}>
      {writeoff ? (
        <div className="space-y-5">
          <div className="text-[11px] leading-relaxed" style={{ color: "var(--muted)" }}>
            {isWork
              ? "If the claim never comes through, you paid for it. It moves into your spending for "
              : "If they're never paying, the money was yours after all. It moves into your spending for "}
            {monthLabel(r.monthKey)} — the month it was charged, not this one — so that month's
            total tells the truth.
          </div>
          <Field label="Which category">
            <Select value={String(bucketId ?? "")} className="w-full"
              onChange={(v) => setBucketId(v === "" ? null : Number(v))}
              options={[{ value: "", label: "Uncategorised" },
                        ...buckets.map((b) => ({ value: String(b.id), label: b.name }))]} />
          </Field>
          <Button className="w-full" onClick={() => onWriteOff(bucketId)}>
            Add {fmt(r.outstanding)} to my spending
          </Button>
        </div>
      ) : (
        <div className="space-y-5">
          <div className="text-[11px] leading-relaxed" style={{ color: "var(--muted)" }}>
            {isWork
              ? "A reimbursement isn't income — it's your own money returning, so it cancels the claim rather than counting as earnings."
              : "This cancels the debt rather than counting as income — it was always your money coming back."}
          </div>
          <Field label="How much came back">
            <div className="flex items-center rounded-xl px-3"
                 style={{ background: "var(--card-2)", border: "1px solid var(--border)" }}>
              <span className="text-[14px]" style={{ color: "var(--faint)" }}>$</span>
              <NumInput value={amount} onChange={setAmount}
                className="w-full bg-transparent outline-none py-2.5 font-mono-num text-[15px]"
                style={{ color: "var(--text)" }} />
            </div>
          </Field>
          <Field label="When it landed" hint="It files into that month, not the month of the charge.">
            <input type="date" value={date} onChange={(e) => setDate(e.target.value)}
              className="w-full rounded-xl px-3 py-2.5 text-[13px] outline-none"
              style={{ background: "var(--card-2)", border: "1px solid var(--border)", color: "var(--text)" }} />
          </Field>
          {partial && (
            <div className="text-[11px]" style={{ color: "var(--muted)" }}>
              {fmt(r.outstanding - num(amount))} stays outstanding.
            </div>
          )}
          {tooMuch && (
            <div className="text-[11px]" style={{ color: "var(--bad)" }}>
              That's more than the {fmt(r.outstanding)} outstanding. Recording it would log money
              that was never owed — if they overpaid, the extra is a separate thing.
            </div>
          )}
          <Button className="w-full" disabled={num(amount) <= 0 || tooMuch}
            onClick={() => onSettle(num(amount), date)}>
            {partial ? `Record ${fmt(amount)}` : isWork ? "Mark it reimbursed" : "Settle it up"}
          </Button>
        </div>
      )}
    </Modal>
  );
}

/** Move budget from one category to another mid-month. */
function MoveMoneySheet({ open, onClose, rows, onMove }) {
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");
  const [amt, setAmt] = useState(0);
  useEffect(() => { if (open) { setFrom(""); setTo(""); setAmt(0); } }, [open]);
  if (!open) return null;

  const fromRow = rows.find((r) => String(r.id) === String(from));
  const spare = fromRow ? fromRow.budget - num(fromRow.actual) : 0;

  return (
    <Modal open onClose={onClose} title="Move money"
      subtitle="Overspent somewhere? Cover it from another category instead of leaving the budget wrong.">
      <div className="space-y-4">
        <Field label="Take from">
          <Select value={from} onChange={setFrom} className="w-full"
            options={[{ value: "", label: "Choose a category" },
                      ...rows.map((r) => ({ value: String(r.id), label: `${r.name} — ${fmt0(r.budget - num(r.actual))} spare` }))]} />
        </Field>
        <Field label="Give to">
          <Select value={to} onChange={setTo} className="w-full"
            options={[{ value: "", label: "Choose a category" },
                      ...rows.filter((r) => String(r.id) !== String(from))
                             .map((r) => ({ value: String(r.id), label: r.name }))]} />
        </Field>
        <LabeledInput label="Amount" prefix="$" value={amt} onChange={setAmt}
          hint={fromRow ? `${fmt0(spare)} unspent in ${fromRow.name}` : null} />
        {fromRow && amt > spare && (
          <AlertCard level="warn" title="That's more than is spare"
            body={`${fromRow.name} only has ${fmt0(Math.max(0, spare))} left. Moving more just pushes the overspend somewhere else.`} />
        )}
        <Button className="w-full" disabled={!from || !to || amt <= 0}
          onClick={() => onMove(from, to, amt)}>Move {amt > 0 ? fmt(amt) : "money"}</Button>
      </div>
    </Modal>
  );
}


// ===================== §12  BILLS =====================
function BillsTab({ state, d, setIn, setBucket, update, setToast }) {
  const [monthOffset, setMonthOffset] = useState(0);
  const [editBucket, setEditBucket] = useState(null);
  const [editCard, setEditCard] = useState(null);
  const [pickerOpen, setPickerOpen] = useState(true);
  const recurring = useMemo(() => recurringCharges(state), [state]);

  const setCard = (id, patch) => update((s) => ({
    ...s, cards: s.cards.map((c) => (c.id === id ? { ...c, ...patch } : c)),
  }));
  const addCard = () => update((s) => ({
    ...s, cards: [...s.cards, mkCard({ name: `Card ${s.cards.length + 1}`, slot: s.cards.length % SERIES_SLOTS })],
  }));
  const removeCard = (id) => update((s) => ({ ...s, cards: s.cards.filter((c) => c.id !== id) }));
  const toggleActivate = (card) => setCard(card.id, {
    rewards: { ...card.rewards,
      rotating: { ...card.rewards.rotating,
        activated: { ...card.rewards.rotating.activated, [d.qk]: !card.rewards.rotating.activated?.[d.qk] } } },
  });

  const today = new Date();
  const viewDate = new Date(today.getFullYear(), today.getMonth() + monthOffset, 1);
  const viewMk = monthKey(viewDate);
  const dim = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();
  const firstDow = viewDate.getDay();

  const dated = state.buckets.filter((b) => !b.archived && b.dueDay);
  // Fixed commitments only. This used to include every discretionary
  // category, so the Bills tab listed groceries and dining as "bills without
  // a date" and invited you to give them a due day — which means nothing for
  // money you spend a bit at a time.
  // Fixed commitments only. Rollover is this app's fixed-vs-variable tell:
  // groceries and gas carry unspent budget forward because they're spent a
  // bit at a time, and a "due date" means nothing for those. Rent, insurance
  // and phone don't roll over — those are the ones worth putting on a date.
  const undated = state.buckets.filter((b) => !b.archived && !b.dueDay &&
    b.kind === "expense" && !b.rollover);

  // What lands on each day: bills, the card statement, and paydays.
  const byDay = {};
  const put = (day, item) => { (byDay[day] = byDay[day] || []).push(item); };
  for (const b of dated) put(Math.min(num(b.dueDay), dim), { type: "bill", bucket: b, amount: num(b.amountMonthly) });
  if (state.cardsEnabled) {
    for (const c of d.card.list) {
      if (c.balance > 0) put(Math.min(c.dueDay, dim), { type: "card", amount: c.balance, name: c.name });
    }
  }
  const pays = paydaysBetween(state.profile.nextPayDate, d.cadence,
    new Date(viewDate.getFullYear(), viewDate.getMonth(), 1),
    new Date(viewDate.getFullYear(), viewDate.getMonth(), dim));
  for (const p of pays) put(p.getDate(), { type: "pay", amount: d.pay.netPay });

  const monthTotal = dated.reduce((s, b) => s + num(b.amountMonthly), 0)
    + (state.cardsEnabled ? d.card.totalBalance : 0);

  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let day = 1; day <= dim; day++) cells.push(day);

  const isToday = (day) => monthOffset === 0 && day === today.getDate();

  return (
    <div>
      {/* ---- cards ---- */}
      <SectionLabel right={
        <div className="flex items-center gap-1">
          <button onClick={() => setMonthOffset(monthOffset - 1)} className="p-1.5 rounded-lg pressable"
                  aria-label="Previous month" style={{ color: "var(--faint)" }}>
            <IconChevron className="w-3.5 h-3.5 rotate-180" />
          </button>
          <button onClick={() => setMonthOffset(monthOffset + 1)} className="p-1.5 rounded-lg pressable"
                  aria-label="Next month" style={{ color: "var(--faint)" }}>
            <IconChevron className="w-3.5 h-3.5" />
          </button>
        </div>
      }>{monthLabel(viewMk)}</SectionLabel>

      <Card className="mb-1">
        <div className="grid grid-cols-7 gap-1 mb-2">
          {["S", "M", "T", "W", "T", "F", "S"].map((dw, i) => (
            <div key={i} className="text-center text-[10px] font-medium py-1" style={{ color: "var(--faint)" }}>{dw}</div>
          ))}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {cells.map((day, i) => {
            if (day === null) return <div key={i} />;
            const items = byDay[day] || [];
            const hasBill = items.some((x) => x.type === "bill" || x.type === "card");
            const hasPay = items.some((x) => x.type === "pay");
            const total = items.filter((x) => x.type !== "pay").reduce((s, x) => s + x.amount, 0);
            return (
              <div key={i} className="rounded-xl p-1 min-h-[46px] flex flex-col items-center justify-start"
                   style={{ background: isToday(day) ? "var(--accent-soft)" : hasBill || hasPay ? "var(--card-2)" : "transparent",
                            border: isToday(day) ? "1px solid var(--accent)" : "1px solid transparent" }}>
                <div className="text-[11px] font-mono-num"
                     style={{ color: isToday(day) ? "var(--accent-text)" : "var(--muted)",
                              fontWeight: isToday(day) ? 600 : 400 }}>{day}</div>
                <div className="flex gap-0.5 mt-0.5 flex-wrap justify-center">
                  {hasPay && <span className="w-1.5 h-1.5 rounded-full" style={{ background: "var(--good)" }} />}
                  {items.filter((x) => x.type === "bill").slice(0, 3).map((x, j) => (
                    <span key={j} className="w-1.5 h-1.5 rounded-full" style={{ background: slotVar(x.bucket.slot) }} />
                  ))}
                  {items.some((x) => x.type === "card") &&
                    <span className="w-1.5 h-1.5 rounded-full" style={{ background: "var(--bad)" }} />}
                </div>
                {/* 9px on --muted, not 8px on --faint: the smaller pairing
                    missed AA in both themes, and this is the number the
                    calendar exists to show. */}
                {total > 0 && (
                  <div className="text-[9px] font-mono-num mt-0.5" style={{ color: "var(--muted)" }}>
                    {total >= 1000 ? `${Math.round(total / 100) / 10}k` : Math.round(total)}
                  </div>
                )}
              </div>
            );
          })}
        </div>
        <div className="flex items-center gap-4 mt-4 pt-3 flex-wrap" style={{ borderTop: "1px solid var(--border)" }}>
          <div className="flex items-center gap-1.5">
            <span className="w-2 h-2 rounded-full" style={{ background: "var(--good)" }} />
            <span className="text-[11px]" style={{ color: "var(--muted)" }}>Payday</span>
          </div>
          <div className="flex items-center gap-1.5">
            <span className="w-2 h-2 rounded-full" style={{ background: "var(--s1)" }} />
            <span className="text-[11px]" style={{ color: "var(--muted)" }}>Bill due</span>
          </div>
          {state.cardsEnabled && (
            <div className="flex items-center gap-1.5">
              <span className="w-2 h-2 rounded-full" style={{ background: "var(--bad)" }} />
              <span className="text-[11px]" style={{ color: "var(--muted)" }}>Card due</span>
            </div>
          )}
        </div>
      </Card>

      {/* ---- bill list ---- */}
      <SectionLabel right={<span className="font-mono-num text-[12px]" style={{ color: "var(--muted)" }}>
        {fmt0(monthTotal)}/mo
      </span>}>Scheduled</SectionLabel>
      <Card className="mb-1">
        {d.bills.length === 0 ? (
          <EmptyState icon={IconCalendar} title="No bills have due dates yet"
            body="Give a category a due date and it shows up on the calendar, with the payday that covers it." />
        ) : d.bills.map((b, i) => {
          const covering = pays.filter((p) => p <= b.date).pop();
          return (
            <button key={b.bucket.id} onClick={() => setEditBucket(b.bucket)}
              className="w-full flex items-center gap-3 py-3 text-left pressable"
              style={{ borderBottom: i < d.bills.length - 1 ? "1px solid var(--border)" : "none" }}>
              <div className="w-10 shrink-0 text-center rounded-xl py-1.5" style={{ background: "var(--card-2)" }}>
                <div className="text-[9px] uppercase" style={{ color: "var(--faint)" }}>
                  {b.date.toLocaleDateString("en-US", { month: "short" })}
                </div>
                <div className="font-mono-num text-[14px] font-semibold">{b.date.getDate()}</div>
              </div>
              <div className="flex-1 min-w-0">
                <div className="text-[13px] truncate flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full shrink-0" style={{ background: slotVar(b.bucket.slot) }} />
                  {b.bucket.name}
                </div>
                <div className="text-[11px]" style={{ color: b.days <= 3 ? "var(--warn)" : "var(--faint)" }}>
                  {b.days === 0 ? "due today" : b.days === 1 ? "due tomorrow" : `in ${b.days} days`}
                  {/* A bill with no amount can't be "covered" by anything, and
                      saying so was the tell that it hadn't been filled in. */}
                  {b.amount > 0 && covering &&
                    ` · covered by the ${covering.toLocaleDateString("en-US", { month: "short", day: "numeric" })} paycheck`}
                  {b.amount <= 0 && " · no amount set"}
                </div>
              </div>
              {b.amount > 0
                ? <span className="font-mono-num text-[14px] shrink-0">{fmt(b.amount)}</span>
                : <span className="text-[11px] shrink-0 px-2 py-1 rounded-full"
                        style={{ background: "var(--card-2)", color: "var(--accent-text)" }}>Set</span>}
            </button>
          );
        })}
      </Card>

      {/* Found by pattern, not declared by you — these are the charges that
          renew whether or not you remember them. */}
      {recurring.length > 0 && (
        <>
          <SectionLabel right={<span className="font-mono-num text-[11px]" style={{ color: "var(--text)" }}>
            {fmt0(recurring.reduce((s, r) => s + r.typical * r.perYear, 0))}/yr
          </span>}>Recurring charges</SectionLabel>
          <Card className="mb-1">
            <div className="text-[11px] mb-3 leading-relaxed" style={{ color: "var(--muted)" }}>
              Spotted in your statements — same merchant, same rhythm, similar amount.
              Nobody sends a reminder when one of these goes up.
            </div>
            {recurring.map((r, i) => (
              <div key={r.key} className="flex items-center gap-2.5 py-2.5"
                   style={{ borderBottom: i < recurring.length - 1 ? "1px solid var(--border)" : "none" }}>
                <IconRepeat className="w-3.5 h-3.5 shrink-0" style={{ color: "var(--faint)" }} />
                <div className="min-w-0 flex-1">
                  <div className="text-[13px] truncate flex items-center gap-1.5">
                    {r.merchant}
                    {r.priceChanged && (
                      <span className="text-[9px] px-1.5 py-0.5 rounded-full shrink-0"
                        style={{ background: r.delta > 0 ? "var(--warn-soft)" : "var(--good-soft)",
                                 color: r.delta > 0 ? "var(--warn)" : "var(--good)" }}>
                        {r.delta > 0 ? "went up" : "went down"}
                      </span>
                    )}
                  </div>
                  <div className="text-[10px]" style={{ color: "var(--faint)" }}>
                    {r.cadence} · {r.count} charges · last {r.lastSeen}
                    {r.priceChanged && ` · was ${fmt(r.was)}`}
                  </div>
                </div>
                <div className="text-right shrink-0">
                  <div className="font-mono-num text-[13px]">{fmt(r.amount)}</div>
                  <div className="text-[10px] font-mono-num" style={{ color: "var(--faint)" }}>
                    {fmt0(r.annual)}/yr
                  </div>
                </div>
              </div>
            ))}
          </Card>
        </>
      )}

      {undated.length > 0 && (
        <>
          <SectionLabel>Missing a due date</SectionLabel>
          <Card>
            <div className="text-[11px] mb-3 leading-relaxed" style={{ color: "var(--faint)" }}>
              Fixed costs with no due date set. Adding one puts them on the calendar and into
              the projection.
            </div>
            {undated.map((b, i) => (
              <button key={b.id} onClick={() => setEditBucket(b)}
                className="w-full flex items-center gap-3 py-2.5 text-left pressable"
                style={{ borderBottom: i < undated.length - 1 ? "1px solid var(--border)" : "none" }}>
                <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: slotVar(b.slot) }} />
                <span className="text-[13px] flex-1 truncate">{b.name}</span>
                <span className="font-mono-num text-[13px]" style={{ color: "var(--muted)" }}>{fmt0(b.amountMonthly)}</span>
                <IconChevron className="w-3.5 h-3.5 shrink-0" style={{ color: "var(--faint)" }} />
              </button>
            ))}
          </Card>
        </>
      )}

      {state.cardsEnabled && (
        <>
          <SectionLabel right={<LinkButton onClick={addCard}>+ Card</LinkButton>}>
            Cards
          </SectionLabel>

          {/* The whole point of the card model: what's actually free. */}
          <Card className="mb-3">
            <Row label="Checking" value={fmt(state.accounts.checking)} />
            {d.card.list.filter((c) => c.balance > 0).map((c) => (
              <Row key={c.id} indent icon={IconCard}
                label={`${c.name} · due ${c.dueDay}${ordinal(c.dueDay)}`}
                value={`−${fmt(c.balance)}`} color="var(--bad)" />
            ))}
            <Divider my={1} />
            <Row label="Actually free to spend" bold value={fmt(d.card.freeToSpend)}
              color={d.card.freeToSpend < 0 ? "var(--bad)" : "var(--good)"} />
            <div className="text-[11px] mt-3 leading-relaxed" style={{ color: "var(--faint)" }}>
              Balances aren't separate expenses — the groceries and gas on them are already
              budgeted categories, so counting them again would inflate your spending. They're
              cash leaving the account, so they come off what you can spend.
            </div>
          </Card>

          <div className="space-y-3 mb-1">
            {d.card.list.map((c) => (
              <CardRow key={c.id} status={c} qk={d.qk}
                onEdit={() => setEditCard(c.card)}
                onBalance={(v) => setCard(c.id, { statementBalance: v })}
                onActivate={() => toggleActivate(c.card)} />
            ))}
          </div>
        </>
      )}

      {/* ---- which card for what ---- */}
      {state.cardsEnabled && d.cardPicks.length > 0 && (
        <>
          <SectionLabel right={<LinkButton onClick={() => setPickerOpen(!pickerOpen)}>
            {pickerOpen ? "Hide" : "Show"}
          </LinkButton>}>Which card to use</SectionLabel>
          {pickerOpen && (
            <Card className="mb-1">
              <div className="text-[11px] leading-relaxed mb-4" style={{ color: "var(--faint)" }}>
                Best card per category for {quarterLabel(d.qk)}, based on what each one pays.
                Rotating categories only count once they're activated.
              </div>
              {d.cardPicks.map(({ bucket, pick }, i) => (
                <div key={bucket.id} className="flex items-center gap-3 py-2.5"
                     style={{ borderBottom: i < d.cardPicks.length - 1 ? "1px solid var(--border)" : "none" }}>
                  <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: slotVar(bucket.slot) }} />
                  <div className="min-w-0 flex-1">
                    <div className="text-[13px] truncate">{bucket.name}</div>
                    <div className="text-[10px]" style={{ color: "var(--faint)" }}>
                      {spendLabel(bucket.spendCategory || guessSpendCategory(bucket.name))}
                      {" · "}{fmt0(bucket.amountMonthly)}/mo
                    </div>
                  </div>
                  <div className="text-right shrink-0">
                    <div className="text-[13px] font-medium flex items-center gap-1.5 justify-end">
                      <span className="w-2 h-2 rounded-full" style={{ background: slotVar(pick.winner.card.slot) }} />
                      <span className="truncate max-w-[110px]">{pick.winner.card.name}</span>
                    </div>
                    <div className="text-[10px] font-mono-num" style={{ color: "var(--good)" }}>
                      {pick.winner.rate}% back
                    </div>
                  </div>
                </div>
              ))}
              {/* Money being left on the table, stated in dollars. */}
              {(() => {
                const missed = d.cardPicks.filter((p) => p.pick.missed);
                if (!missed.length) return null;
                const lost = missed.reduce((s, p) =>
                  s + num(p.bucket.amountMonthly) * 3 * (p.pick.missed.potential - p.pick.winner.rate) / 100, 0);
                return (
                  <div className="mt-4">
                    <AlertCard level="warn" title="Activation would pay for itself"
                      body={`${missed.map((m) => m.bucket.name).join(", ")} would earn more on ${missed[0].pick.missed.card.name} once its rotating categories are activated — roughly ${fmt(lost)} this quarter at your current spending.`} />
                  </div>
                );
              })()}
            </Card>
          )}
        </>
      )}

      {/* ---- calendar ---- */}

      <BucketEditor bucket={editBucket} onClose={() => setEditBucket(null)} cadence={d.cadence} netPay={d.pay.netPay}
        onSave={(patch) => { setBucket(editBucket.id, patch); setEditBucket(null); }} />
      <CardEditor card={editCard} qk={d.qk} onClose={() => setEditCard(null)}
        onSave={(patch) => { setCard(editCard.id, patch); setEditCard(null); }}
        onDelete={() => { removeCard(editCard.id); setEditCard(null); }} />
    </div>
  );
}

/** One card: balance, due date, utilisation, and its rewards at a glance. */
function CardRow({ status: c, qk, onEdit, onBalance, onActivate }) {
  const card = c.card;
  const rot = card.rewards?.rotating || {};
  const rotCats = rot.quarters?.[qk] || [];
  const activated = !!rot.activated?.[qk];
  const fixed = card.rewards?.categories || [];

  return (
    <Card>
      <div className="flex items-start justify-between gap-3 mb-3">
        <div className="min-w-0 flex-1">
          <button onClick={onEdit} className="flex items-center gap-2 text-left pressable mb-1">
            <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: slotVar(card.slot) }} />
            <span className="text-[14px] font-semibold truncate">{card.name}</span>
            <IconChevron className="w-3 h-3 shrink-0" style={{ color: "var(--faint)" }} />
          </button>
          <EditableAmount value={card.statementBalance} onChange={onBalance} size="text-[22px]" />
        </div>
        <div className="text-right shrink-0">
          <div className="text-[11px] mb-1" style={{ color: "var(--faint)" }}>Due</div>
          <div className="font-mono-num text-[14px]">{c.dueDay}{ordinal(c.dueDay)}</div>
          <div className="text-[11px]" style={{ color: c.daysUntil <= 3 ? "var(--warn)" : "var(--faint)" }}>
            in {c.daysUntil}d
          </div>
        </div>
      </div>

      {c.utilization !== null && (
        <div className="mb-3">
          <div className="flex items-baseline justify-between mb-1.5">
            <span className="text-[11px]" style={{ color: "var(--muted)" }}>Utilisation</span>
            <span className="font-mono-num text-[11px]"
                  style={{ color: c.utilizationWarn ? "var(--warn)" : "var(--muted)" }}>
              {pct(c.utilization * 100, 0)} of {fmt0(card.creditLimit)}
            </span>
          </div>
          <ProgressBar value={c.utilization} height={5}
            color={c.utilizationWarn ? "var(--st-warn)" : "var(--st-good)"} />
        </div>
      )}

      {/* rewards */}
      <div className="pt-3" style={{ borderTop: "1px solid var(--border)" }}>
        <div className="flex flex-wrap gap-1.5 mb-2">
          <span className="text-[11px] px-2 py-1 rounded-full font-mono-num"
                style={{ background: "var(--card-2)", color: "var(--muted)" }}>
            {num(card.rewards?.base)}% base
          </span>
          {fixed.map((f, i) => (
            <span key={i} className="text-[11px] px-2 py-1 rounded-full"
                  style={{ background: "var(--card-2)", color: "var(--muted)" }}>
              <span className="font-mono-num">{num(f.rate)}%</span> {spendLabel(f.category)}
            </span>
          ))}
        </div>

        {rot.enabled && (
          <div className="mt-2 p-3 rounded-2xl"
               style={{ background: activated ? "var(--good-soft)" : "var(--warn-soft)",
                        border: `1px solid ${activated ? "var(--good)" : "var(--warn)"}33` }}>
            <div className="flex items-center justify-between gap-2 mb-1.5">
              <span className="text-[12px] font-semibold">
                {num(rot.rate)}% rotating · {quarterLabel(qk).split(" · ")[0]}
              </span>
              {/* Activated wears text ink with a green border rather than green
                  text — the green step is a mark colour and lands at 4.39:1 on
                  this tinted panel in light mode. The border carries the state. */}
              <button onClick={onActivate}
                className="text-[11px] font-semibold px-2.5 py-1 rounded-full pressable shrink-0 flex items-center gap-1"
                style={{ background: activated ? "transparent" : "var(--accent)",
                         color: activated ? "var(--text)" : "var(--on-accent)",
                         border: `1px solid ${activated ? "var(--good)" : "var(--accent)"}` }}>
                {activated && <IconCheck className="w-3 h-3" style={{ color: "var(--good)" }} />}
                {activated ? "Activated" : "Activate"}
              </button>
            </div>
            <div className="text-[11px] leading-relaxed" style={{ color: "var(--muted)" }}>
              {rotCats.length
                ? <>{rotCats.map(spendLabel).join(", ")}
                    {num(rot.capQuarterly) > 0 && ` · up to ${fmt0(rot.capQuarterly)} of spend`}
                    {!activated && ` · earning ${num(card.rewards.base)}% until you activate`}</>
                : <>No categories set for this quarter yet — add them so the card picker can use it.</>}
            </div>
            {activated && num(rot.capQuarterly) > 0 && (
              <div className="mt-2">
                <ProgressBar value={num(rot.spentThisQuarter) / num(rot.capQuarterly)} height={4} color="var(--st-good)" />
                {/* --muted, not --faint: this sits on a tinted panel that's
                    lighter than a plain card, so --faint drops under 4.5:1. */}
                <div className="text-[10px] mt-1" style={{ color: "var(--muted)" }}>
                  {fmt0(rot.spentThisQuarter)} of {fmt0(rot.capQuarterly)} cap used · {daysLeftInQuarter()} days left
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </Card>
  );
}

function CardEditor({ card, qk, onClose, onSave, onDelete }) {
  const [draft, setDraft] = useState(card);
  useEffect(() => { setDraft(card); }, [card]);
  if (!card || !draft) return null;

  const set = (patch) => setDraft((x) => ({ ...x, ...patch }));
  const setRewards = (patch) => set({ rewards: { ...draft.rewards, ...patch } });
  const setRot = (patch) => setRewards({ rotating: { ...draft.rewards.rotating, ...patch } });
  const rotCats = draft.rewards.rotating.quarters?.[qk] || [];
  const toggleRotCat = (key) => setRot({
    quarters: { ...draft.rewards.rotating.quarters,
      [qk]: rotCats.includes(key) ? rotCats.filter((k) => k !== key) : [...rotCats, key] },
  });

  return (
    <Modal open onClose={onClose} title={draft.name || "Card"} subtitle="Balance, due date and what it pays">
      <div className="space-y-5">
        <TextInput label="Name" value={draft.name} onChange={(v) => set({ name: v })}
          placeholder="Freedom Flex, Discover it…" />

        <div className="grid grid-cols-2 gap-3">
          <LabeledInput label="Statement balance" prefix="$" value={draft.statementBalance}
            onChange={(v) => set({ statementBalance: v })} />
          <DayPicker label="Due day" value={draft.dueDay} onChange={(v) => set({ dueDay: v || 1 })} />
          <LabeledInput label="Credit limit" prefix="$" value={draft.creditLimit}
            onChange={(v) => set({ creditLimit: v })} hint="0 hides utilisation" wide />
        </div>

        <div className="pt-4" style={{ borderTop: "1px solid var(--border)" }}>
          <div className="text-[13px] font-semibold mb-3">Rewards</div>
          <LabeledInput label="Base rate on everything" suffix="%" value={draft.rewards.base}
            onChange={(v) => setRewards({ base: v })} wide />
        </div>

        {/* always-on bonus categories */}
        <Field label="Always-on bonus categories"
          hint="Categories this card pays extra on year-round, separate from any rotating ones.">
          <div className="space-y-2">
            {(draft.rewards.categories || []).map((c, i) => (
              <div key={i} className="flex items-center gap-2">
                <Select value={c.category} className="flex-1"
                  onChange={(v) => setRewards({ categories: draft.rewards.categories.map((x, j) => j === i ? { ...x, category: v } : x) })}
                  options={SPEND_CATEGORIES.map((s) => ({ value: s.key, label: s.label }))} />
                <div className="flex items-center rounded-2xl px-3 w-20 shrink-0"
                     style={{ background: "var(--card-2)", border: "1px solid var(--border)" }}>
                  <NumInput value={c.rate}
                    onChange={(v) => setRewards({ categories: draft.rewards.categories.map((x, j) => j === i ? { ...x, rate: v } : x) })}
                    className="w-full bg-transparent outline-none py-2.5 font-mono-num text-[14px] text-right"
                    style={{ color: "var(--text)" }} />
                  <span className="text-[13px]" style={{ color: "var(--faint)" }}>%</span>
                </div>
                <button onClick={() => setRewards({ categories: draft.rewards.categories.filter((_, j) => j !== i) })}
                  className="p-2 pressable shrink-0" style={{ color: "var(--faint)" }}>
                  <IconTrash className="w-3.5 h-3.5" />
                </button>
              </div>
            ))}
            <Button variant="ghost" size="sm" className="w-full"
              onClick={() => setRewards({ categories: [...(draft.rewards.categories || []), { category: "dining", rate: 3 }] })}>
              Add a category
            </Button>
          </div>
        </Field>

        {/* rotating */}
        <div className="pt-4" style={{ borderTop: "1px solid var(--border)" }}>
          <div className="flex items-center justify-between gap-4 py-1">
            <div>
              <div className="text-[13px]">Rotating quarterly categories</div>
              <div className="text-[11px] leading-relaxed" style={{ color: "var(--faint)" }}>
                The kind that changes every quarter and has to be activated.
              </div>
            </div>
            <Toggle checked={draft.rewards.rotating.enabled} onChange={(v) => setRot({ enabled: v })} />
          </div>

          {draft.rewards.rotating.enabled && (
            <div className="mt-4 space-y-4">
              <div className="grid grid-cols-2 gap-3">
                <LabeledInput label="Bonus rate" suffix="%" value={draft.rewards.rotating.rate}
                  onChange={(v) => setRot({ rate: v })} />
                <LabeledInput label="Quarterly spend cap" prefix="$" value={draft.rewards.rotating.capQuarterly}
                  onChange={(v) => setRot({ capQuarterly: v })} hint="0 = uncapped" />
                <LabeledInput label="Bonus spend used this quarter" prefix="$"
                  value={draft.rewards.rotating.spentThisQuarter}
                  onChange={(v) => setRot({ spentThisQuarter: v })} wide />
              </div>

              <Field label={`Categories for ${quarterLabel(qk)}`}
                hint="Tap the ones this quarter pays the bonus rate on.">
                <div className="flex flex-wrap gap-2">
                  {SPEND_CATEGORIES.filter((c) => c.key !== "other").map((c) => (
                    <Pill key={c.key} active={rotCats.includes(c.key)} onClick={() => toggleRotCat(c.key)}>
                      {c.label}
                    </Pill>
                  ))}
                </div>
              </Field>

              <div className="flex items-center justify-between gap-4 py-1">
                <div>
                  <div className="text-[13px]">Activated for this quarter</div>
                  <div className="text-[11px]" style={{ color: "var(--faint)" }}>
                    Until this is on, the card earns its base rate.
                  </div>
                </div>
                <Toggle checked={!!draft.rewards.rotating.activated?.[qk]}
                  onChange={(v) => setRot({ activated: { ...draft.rewards.rotating.activated, [qk]: v } })} />
              </div>
            </div>
          )}
        </div>

        <SlotPicker slot={draft.slot} onChange={(i) => set({ slot: i })} />

        <div className="flex gap-2 pt-1">
          <Button className="flex-1" onClick={() => onSave(draft)}>Save</Button>
          {onDelete && <Button variant="danger" onClick={onDelete} icon={IconTrash}>Delete</Button>}
        </div>
      </div>
    </Modal>
  );
}


// ===================== §13  GROW =====================
function GrowTab({ state, d, roadmap, update, setIn, setBucket, addBucket, removeBucket, setToast }) {
  // Opens on the ordered picture rather than on a subject. Four subject pills
  // with no overview meant you had to already know which one held the thing
  // you wanted; this answers "where am I" before "what about the car".
  const [section, setSection] = useState("progress");
  const [carOpen, setCarOpen] = useState(false);
  const [bankOpen, setBankOpen] = useState(false);
  const [rentOpen, setRentOpen] = useState(false);

  const SECTIONS = [["progress", "Progress"], ["goals", "Goals"], ["car", "Car"],
                    ["invest", "Investing"], ["worth", "Net worth"]];

  return (
    <div>
      <div className="flex gap-1.5 mb-5 overflow-x-auto no-scrollbar">
        {SECTIONS.map(([k, l]) => (
          <Pill key={k} active={section === k} onClick={() => setSection(k)}>{l}</Pill>
        ))}
      </div>

      {section === "progress" && <ProgressSection {...{ state, d, roadmap, setSection }} />}
      {section === "goals" && <GoalsSection {...{ state, d, update, setIn, setBucket, addBucket, removeBucket, rentOpen, setRentOpen }} />}
      {section === "car"    && <CarSection {...{ state, d, update, setIn, setToast, carOpen, setCarOpen }} />}
      {section === "invest" && <InvestSection {...{ state, d, update, setIn, setBucket, addBucket, removeBucket, setToast, bankOpen, setBankOpen }} />}
      {section === "worth"  && <NetWorthSection {...{ state, d, setIn }} />}
    </div>
  );
}

/**
 * Where you are, in order.
 *
 * The roadmap already encodes the right sequence — each step is worth more
 * than the one after it — so it makes a better spine for this tab than four
 * subject pills did. Each step says where it lives, so it doubles as
 * navigation.
 */
function ProgressSection({ state, d, roadmap, setSection }) {
  const done = roadmap.filter((p) => p.done).length;
  const current = roadmap.find((p) => !p.done);
  // Which pill each step belongs to, so a step can hand you off to its detail.
  const goesTo = { car_buyout: "car", starter_ef: "goals", full_ef: "goals",
                   match: null, high_interest: null, max_roth_ira: "invest",
                   max_401k: "invest", taxable: "invest" };

  return (
    <div>
      <Card className="mb-4">
        <div className="text-[12px] mb-1" style={{ color: "var(--muted)" }}>Net worth</div>
        <NetWorthChart series={d.nwSeries} />
      </Card>

      <SectionLabel right={<span className="font-mono-num text-[11px]" style={{ color: "var(--faint)" }}>
        {done} of {roadmap.length}
      </span>}>Your order of operations</SectionLabel>
      <Card className="mb-1">
        <div className="text-[12px] leading-relaxed mb-4" style={{ color: "var(--muted)" }}>
          Each step is worth more than the one below it, so work down. You're on{" "}
          <span style={{ color: "var(--text)" }}>{current ? current.title : "the last of them"}</span>.
        </div>
        <div className="space-y-1">
          {roadmap.map((p, i) => {
            const isCurrent = current && p.key === current.key;
            const target = goesTo[p.key];
            return (
              <div key={p.key} className="flex gap-3">
                <div className="flex flex-col items-center shrink-0">
                  <div className="w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-mono-num"
                       style={{ background: p.done ? "var(--good)" : isCurrent ? "var(--accent)" : "var(--card-2)",
                                color: p.done || isCurrent ? "var(--on-accent)" : "var(--faint)",
                                border: `1px solid ${p.done ? "var(--good)" : isCurrent ? "var(--accent)" : "var(--border)"}` }}>
                    {p.done ? <IconCheck className="w-3.5 h-3.5" /> : i + 1}
                  </div>
                  {i < roadmap.length - 1 && <div className="w-px flex-1 my-1" style={{ background: "var(--border)" }} />}
                </div>
                <div className="pb-5 min-w-0 flex-1">
                  <div className="text-[13px] font-medium flex items-center gap-2">
                    <span className="min-w-0 truncate">{p.title}</span>
                    {isCurrent && <span className="text-[9px] px-1.5 py-0.5 rounded-full shrink-0"
                      style={{ background: "var(--accent-soft)", color: "var(--accent-text)" }}>now</span>}
                  </div>
                  <div className="text-[12px] mt-0.5" style={{ color: "var(--muted)" }}>{p.detail}</div>
                  {!p.done && (
                    <div className="text-[11px] mt-1 leading-relaxed" style={{ color: "var(--faint)" }}>{p.why}</div>
                  )}
                  {!p.done && p.progress > 0 && p.progress < 1 && (
                    <div className="mt-2"><ProgressBar value={p.progress} color="var(--accent)" height={4} /></div>
                  )}
                  {p.warn && (
                    <div className="text-[11px] mt-2 p-2.5 rounded-xl leading-relaxed"
                         style={{ background: "var(--warn-soft)", color: "var(--warn)" }}>{p.warn}</div>
                  )}
                  {target && !p.done && (
                    <button onClick={() => setSection(target)}
                      className="text-[11px] mt-2 pressable" style={{ color: "var(--accent-text)" }}>
                      Open {SECTION_LABEL[target]} →
                    </button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </Card>
    </div>
  );
}

const SECTION_LABEL = { goals: "Goals", car: "Car", invest: "Investing", worth: "Net worth" };

function GoalsSection({ state, d, update, setIn, setBucket, addBucket, removeBucket, rentOpen, setRentOpen }) {
  const emergencyB = d.emergencyBucket;
  const monthsCovered = d.essentialMonthly > 0 ? d.emergencyBalance / d.essentialMonthly : 0;
  const efMonthly = emergencyB ? num(emergencyB.amountMonthly) : 0;
  const efGap = Math.max(0, d.emergencyTarget - d.emergencyBalance);
  const efMonths = efMonthly > 0 ? Math.ceil(efGap / efMonthly) : null;
  // The bankroll reserve is a goal-kind bucket, but it belongs to the bankroll
  // and is already shown under Investing. Listing it here too made it look
  // like a second, nameless savings goal.
  const goalsList = state.buckets.filter((b) => !b.archived && b.kind === "goal"
    && !/emergency/i.test(b.name)
    && String(b.id) !== String(state.bankroll?.reserveBucketId));

  return (
    <div>
      <SectionLabel>Emergency fund</SectionLabel>
      <Card className="mb-1">
        <div className="flex items-baseline justify-between mb-1 gap-3">
          <div className="num-hero text-[28px]">{fmt0(d.emergencyBalance)}</div>
          <div className="font-mono-num text-[13px] shrink-0" style={{ color: "var(--faint)" }}>
            of {fmt0(d.emergencyTarget)}
          </div>
        </div>
        <div className="text-[12px] mb-3" style={{ color: "var(--muted)" }}>
          Covers <span className="font-mono-num" style={{ color: "var(--text)" }}>{monthsCovered.toFixed(1)} months</span> of
          essentials at {fmt0(d.essentialMonthly)}/mo.
        </div>
        <ProgressBar value={d.emergencyTarget > 0 ? d.emergencyBalance / d.emergencyTarget : 0}
          color="var(--s3)" height={10} />

        <div className="flex items-center gap-2 mt-5 flex-wrap">
          <span className="text-[12px]" style={{ color: "var(--muted)" }}>Target</span>
          {[3, 6, 9, 12].map((m) => (
            <Pill key={m} active={num(state.emergency.months) === m} onClick={() => setIn("emergency.months", m)}>
              {m} mo
            </Pill>
          ))}
        </div>

        {emergencyB && (
          <div className="grid grid-cols-2 gap-3 mt-4">
            <LabeledInput label="Per month" prefix="$" value={emergencyB.amountMonthly}
              onChange={(v) => setBucket(emergencyB.id, { amountMonthly: v })} />
            <LabeledInput label="Saved so far" prefix="$" value={emergencyB.balance}
              onChange={(v) => setBucket(emergencyB.id, { balance: v })} />
          </div>
        )}

        <div className="text-[11px] mt-3 leading-relaxed" style={{ color: "var(--faint)" }}>
          {efGap <= 0
            ? "Fully funded. Money can move down the list to investing now."
            : efMonths
              ? `${fmt0(efGap)} to go — about ${efMonths} month${efMonths === 1 ? "" : "s"} at ${fmt0(efMonthly)}/mo.`
              : `${fmt0(efGap)} to go. Set a monthly amount to get a timeline.`}
          {" "}Six months rather than three is the right call here: betting and side income
          swing, and rent doesn't.
        </div>
      </Card>

      <SectionLabel right={<LinkButton onClick={() => addBucket({
        name: "New goal", kind: "goal", fill: "fillToTarget", amountMonthly: 100, target: 1000,
      })}>+ Add</LinkButton>}>Other goals</SectionLabel>
      <Card>
        {goalsList.length === 0 ? (
          <EmptyState icon={IconTarget} title="No other goals yet"
            body="A trip, a deposit, a laptop — anything with a number and a deadline." />
        ) : goalsList.map((b, i) => {
          const p = num(b.target) > 0 ? num(b.balance) / num(b.target) : 0;
          const gap = Math.max(0, num(b.target) - num(b.balance));
          const months = num(b.amountMonthly) > 0 ? Math.ceil(gap / num(b.amountMonthly)) : null;
          return (
            <div key={b.id} className="py-3" style={{ borderBottom: i < goalsList.length - 1 ? "1px solid var(--border)" : "none" }}>
              <div className="flex items-center gap-2.5 mb-2">
                <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: slotVar(b.slot) }} />
                <input value={b.name} onChange={(e) => setBucket(b.id, { name: e.target.value })}
                  className="flex-1 bg-transparent outline-none text-[13px] font-medium min-w-0" />
                <span className="font-mono-num text-[13px] shrink-0">{fmt0(b.balance)}</span>
                <button onClick={() => removeBucket(b.id)} className="p-1 pressable shrink-0" style={{ color: "var(--faint)" }}>
                  <IconTrash className="w-3.5 h-3.5" />
                </button>
              </div>
              <ProgressBar value={p} color={slotVar(b.slot)} height={6} />
              <div className="grid grid-cols-3 gap-2 mt-3">
                <LabeledInput label="Target" prefix="$" value={b.target} onChange={(v) => setBucket(b.id, { target: v })} />
                <LabeledInput label="Saved" prefix="$" value={b.balance} onChange={(v) => setBucket(b.id, { balance: v })} />
                <LabeledInput label="Monthly" prefix="$" value={b.amountMonthly} onChange={(v) => setBucket(b.id, { amountMonthly: v })} />
              </div>
              {months !== null && gap > 0 && (
                <div className="text-[10px] mt-2" style={{ color: "var(--faint)" }}>
                  About {months} month{months === 1 ? "" : "s"} to go.
                </div>
              )}
            </div>
          );
        })}
      </Card>

      <SectionLabel right={<LinkButton onClick={() => setRentOpen(!rentOpen)}>
        {rentOpen ? "Hide" : "Open"}</LinkButton>}>Can I afford this apartment?</SectionLabel>
      {rentOpen && <RentCalculator state={state} d={d} setIn={setIn} />}
    </div>
  );
}

function CarSection({ state, d, update, setIn, setToast, carOpen, setCarOpen }) {
  const car = d.car;
  const carBuckets = state.buckets.filter((b) => !b.archived && b.kind === "sinking" && /car/i.test(b.name));
  const carBudgeted = carBuckets.reduce((s, b) => s + num(b.amountMonthly), 0);

  const adoptCarAmounts = () => update((s) => {
    const upkeep = Math.round(car.upkeepOnlyMonthly);
    const replace = Math.round(car.replacementMonthly);
    let sawUpkeep = false, sawReplace = false;
    const buckets = s.buckets.map((b) => {
      if (b.kind !== "sinking") return b;
      if (/maintenance|upkeep|repair/i.test(b.name)) { sawUpkeep = true; return { ...b, amountMonthly: upkeep }; }
      if (/replacement|depreciation|next car/i.test(b.name)) { sawReplace = true; return { ...b, amountMonthly: replace }; }
      return b;
    });
    if (!sawUpkeep) buckets.push(mkBucket({ name: "Car maintenance", kind: "sinking", essential: true, amountMonthly: upkeep, slot: 7 }));
    if (!sawReplace) buckets.push(mkBucket({ name: "Car replacement", kind: "sinking", amountMonthly: replace, slot: 1 }));
    return { ...s, buckets };
  });

  const buyCar = () => update((s) => ({
    ...s,
    car: { ...s.car, owned: true, saved: 0, resaleValue: num(s.car.buyoutPrice) },
    accounts: { ...s.accounts, checking: num(s.accounts.checking) + Math.max(0, num(s.car.saved) - num(s.car.buyoutPrice)) },
  }));

  return (
    <div>
      {!state.car.owned ? (
        <>
          <SectionLabel>Buying it from your mother</SectionLabel>
          <Card className="mb-1">
            <div className="flex items-baseline justify-between mb-1 gap-3">
              <div className="num-hero text-[28px]">{fmt0(state.car.saved)}</div>
              <div className="font-mono-num text-[13px] shrink-0" style={{ color: "var(--faint)" }}>
                of {fmt0(state.car.buyoutPrice)}
              </div>
            </div>
            <ProgressBar value={num(state.car.buyoutPrice) > 0 ? num(state.car.saved) / num(state.car.buyoutPrice) : 1}
              color="var(--s2)" height={10} />
            <div className="grid grid-cols-2 gap-3 mt-4">
              <LabeledInput label="Buyout price" prefix="$" value={state.car.buyoutPrice}
                onChange={(v) => setIn("car.buyoutPrice", v)} />
              <LabeledInput label="Saved" prefix="$" value={state.car.saved}
                onChange={(v) => setIn("car.saved", v)} />
            </div>
            <div className="text-[11px] mt-3 mb-4 leading-relaxed" style={{ color: "var(--muted)" }}>
              {num(state.car.saved) >= num(state.car.buyoutPrice)
                ? "Fully funded — buy it whenever you're ready. The moment you do, this becomes the maintenance and replacement fund below."
                : `${fmt0(num(state.car.buyoutPrice) - num(state.car.saved))} to go.`}
            </div>
            <Button className="w-full" onClick={buyCar} icon={IconCheck}>I bought it</Button>
          </Card>
        </>
      ) : (
        <Card className="mb-1">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2.5">
              <IconCar className="w-5 h-5" style={{ color: "var(--s6)" }} />
              <div>
                <div className="text-[14px] font-semibold">{state.car.year} · owned outright</div>
                <div className="text-[11px]" style={{ color: "var(--faint)" }}>
                  {num(state.car.annualMiles).toLocaleString()} mi/yr · no payment
                </div>
              </div>
            </div>
            <LinkButton onClick={() => setCarOpen(true)}>Edit</LinkButton>
          </div>
        </Card>
      )}

      <SectionLabel right={<LinkButton onClick={() => setCarOpen(true)}>Edit details</LinkButton>}>
        What the car actually costs
      </SectionLabel>
      <Card className="mb-1">
        <div className="text-[11px] leading-relaxed mb-3" style={{ color: "var(--faint)" }}>
          A {car.age}-year-old car at {num(state.car.annualMiles).toLocaleString()} mi/yr.
          Maintenance scales with age (×{car.ageMult} here) and mileage.
        </div>
        <Row label="Maintenance & repairs" sub={`${fmt(state.car.maintPerMile)}/mi × ${car.ageMult}`}
          value={fmt(car.maintenanceMonthly)} />
        <Row label="Tires" sub={`${fmt0(state.car.tireSetCost)} every ${num(state.car.tireLifeMiles).toLocaleString()} mi`}
          value={fmt(car.tiresMonthly)} />
        <Row label="Registration & inspection" sub={`${fmt0(state.car.registrationAnnual)}/yr`}
          value={fmt(car.registrationMonthly)} />
        <Divider />
        <Row label="Replacement reserve"
          sub={`${fmt0(state.car.nextCarBudget)} next car − ${fmt0(state.car.resaleValue)} resale, over ${num(state.car.replaceInMonths)} mo`}
          value={fmt(car.replacementMonthly)} />
        <Divider />
        <Row label="Set aside monthly" value={fmt(car.sinkingTotalMonthly)} bold color="var(--s6)" />

        <div className="mt-5 pt-4" style={{ borderTop: "1px solid var(--border)" }}>
          <div className="text-[11px] mb-2" style={{ color: "var(--faint)" }}>
            Bills rather than sinking funds — but still what the car costs:
          </div>
          <Row label="Insurance" value={fmt(car.insuranceMonthly)} />
          <Row label="Fuel" sub={`${num(state.car.mpg)} mpg at ${fmt(state.car.gasPrice)}/gal`} value={fmt(car.fuelMonthly)} />
          <Divider />
          <Row label="True cost of ownership" value={`${fmt(car.trueMonthlyTotal)}/mo`} bold />
          <div className="flex items-baseline justify-between mt-2">
            <span className="text-[11px]" style={{ color: "var(--faint)" }}>Per mile driven</span>
            <span className="font-mono-num text-[14px]" style={{ color: "var(--accent-text)" }}>
              ${car.costPerMile.toFixed(2)}
            </span>
          </div>
        </div>

        <div className="mt-5 p-4 rounded-2xl" style={{ background: "var(--card-2)" }}>
          <div className="flex items-baseline justify-between mb-3">
            <span className="text-[12px]" style={{ color: "var(--muted)" }}>You're budgeting</span>
            <span className="font-mono-num text-[13px]"
                  style={{ color: carBudgeted >= car.sinkingTotalMonthly * 0.9 ? "var(--good)" : "var(--warn)" }}>
              {fmt0(carBudgeted)} / {fmt0(car.sinkingTotalMonthly)}
            </span>
          </div>
          <Button variant="ghost" size="sm" className="w-full" onClick={adoptCarAmounts}>
            Use the recommended amounts
          </Button>
        </div>
      </Card>

      <CarEditor open={carOpen} onClose={() => setCarOpen(false)} state={state} setIn={setIn} car={car} />
    </div>
  );
}

function InvestSection({ state, d, update, setIn, setBucket, addBucket, removeBucket, setToast, bankOpen, setBankOpen }) {
  const b = d.bank;
  const total401kYtd = num(state.ytd.trad401k) + num(state.ytd.roth401k);
  const rothIraB = d.rothIraBucket;
  const investBuckets = state.buckets.filter((x) => !x.archived && x.kind === "invest");

  const [moveOpen, setMoveOpen] = useState(false);
  const [ytdOpen, setYtdOpen] = useState(false);

  const markBankroll = (v) => update((s) => ({
    ...s, bankroll: { ...s.bankroll, balance: v,
      marks: [{ date: new Date().toISOString(), balance: v }, ...(s.bankroll.marks || [])].slice(0, 60) },
  }));

  /**
   * Record a movement and move the real balances to match.
   *
   * A deposit takes cash out of your bank and puts it in a book. A withdrawal
   * does the reverse. A transfer touches neither — the money never left the
   * bankroll, which is the entire distinction this feature exists to draw.
   */
  const logMovement = ({ type, amount, fromBook, toBook, date }) => {
    const amt = num(amount);
    update((s) => {
      const rb = reserveBucket(s);
      // Cover it from the reserve if the reserve can. Anything it can't cover
      // stays flagged so the alert can tell you what's still outstanding.
      const fundable = type === "deposit" && rb ? Math.min(amt, num(rb.balance)) : 0;
      const move = mkMovement({ type, amount: amt, fromBook, toBook, date,
                                funded: type === "deposit" && fundable >= amt - 0.01 });
      const bankroll = { ...s.bankroll, movements: [...(s.bankroll.movements || []), move],
        balance: type === "deposit" ? num(s.bankroll.balance) + amt
               : type === "withdraw" ? num(s.bankroll.balance) - amt
               : num(s.bankroll.balance) };
      if (type === "transfer") return { ...s, bankroll };
      const sign = type === "deposit" ? -1 : 1;
      return { ...s, bankroll,
        accounts: { ...s.accounts, checking: num(s.accounts.checking) + sign * amt },
        // A funded deposit draws the reserve bucket down; a withdrawal doesn't
        // refill it, because taking profit out isn't the same as re-earmarking.
        buckets: rb && fundable > 0
          ? s.buckets.map((x) => x.id === rb.id ? { ...x, balance: num(x.balance) - fundable } : x)
          : s.buckets };
    });
    setToast(type === "deposit"
      ? (amt > b.reserve ? `Logged — ${fmt(amt - b.reserve)} is beyond the reserve` : "Logged — covered from the reserve")
      : type === "withdraw" ? "Logged — bankroll down, cash up" : "Moved between books — bankroll unchanged");
  };

  return (
    <div>
      <SectionLabel>{state.ytd.year} contribution limits</SectionLabel>
      <Card className="mb-1">
        <ContributionTracker label="401(k) — Traditional + Roth" ytd={total401kYtd} cap={state.limits.employee401k}
          color="var(--s1)"
          pace={(() => {
            // Was "on pace for X/yr" from the monthly rate alone, which ignored
            // everything already contributed — the same mistake the alerts had.
            const p = contributionPace(total401kYtd, toMonthly(d.pay.total401k, d.cadence), state.limits.employee401k);
            if (p.maxed) return "Maxed for the year. Traditional and Roth share this one limit.";
            return p.onTrack
              ? `On track to max it by December. Traditional and Roth share this one limit.`
              : `Lands around ${fmt0(p.projected)} at this rate; ${fmt0(p.needMonthly)}/mo would max it.`;
          })()} />
        <ContributionTracker label="Roth IRA" ytd={d.rothIraYtd} cap={state.limits.rothIra} color="var(--s7)"
          pace={(() => {
            if (!rothIraB) return null;
            const p = contributionPace(d.rothIraYtd, rothIraB.amountMonthly, state.limits.rothIra);
            if (p.maxed) return "Maxed for the year — the room is used.";
            if (num(rothIraB.amountMonthly) <= 0) return `${fmt0(p.needMonthly)}/mo from here would max it.`;
            return p.onTrack
              ? `${fmt0(rothIraB.amountMonthly)}/mo gets you to the cap by December.`
              : `${fmt0(rothIraB.amountMonthly)}/mo lands at ${fmt0(p.projected)}; ${fmt0(p.needMonthly)}/mo would max it.`;
          })()} />
        {state.modules.hsa && (
          <ContributionTracker label="HSA" ytd={state.ytd.hsa} cap={state.limits.hsaSelf} color="var(--s3)" />
        )}
        <div className="flex items-baseline justify-between pt-3 mt-2" style={{ borderTop: "1px solid var(--border)" }}>
          <span className="text-[12px]" style={{ color: "var(--muted)" }}>Employer match this year</span>
          <span className="font-mono-num text-[13px]" style={{ color: "var(--good)" }}>{fmt0(state.ytd.match)}</span>
        </div>
        <div className="text-[11px] mt-3 leading-relaxed" style={{ color: "var(--faint)" }}>
          IRA room doesn't roll over — an unused year is gone for good. The employer match sits
          outside your {fmt0(state.limits.employee401k)} limit, so it never crowds out your own.
        </div>

        {/* These otherwise only move when you log a paycheck, so a mid-year
            setup — or a year where some of it went in elsewhere — reads as
            zero and the caps look wide open when they aren't. */}
        <button onClick={() => setYtdOpen(!ytdOpen)}
          className="text-[11px] mt-3 pressable" style={{ color: "var(--accent-text)" }}>
          {ytdOpen ? "Hide" : "These numbers look wrong?"}
        </button>
        {ytdOpen && (
          <div className="mt-3 pt-3 animate-fade-in" style={{ borderTop: "1px solid var(--border)" }}>
            <div className="text-[11px] mb-3 leading-relaxed" style={{ color: "var(--muted)" }}>
              Set what's actually gone in this year. Logged paychecks add to these from here on.
            </div>
            <div className="grid grid-cols-2 gap-3">
              <LabeledInput label="401(k) this year" prefix="$" value={Math.round(total401kYtd * 100) / 100}
                onChange={(v) => update((s) => {
                  const trad = num(s.preTax.trad401kPct), roth = num(s.postTax.roth401kPct);
                  const tot = trad + roth;
                  const share = tot > 0 ? trad / tot : 1;
                  return { ...s, ytd: { ...s.ytd,
                    trad401k: Math.round(num(v) * share * 100) / 100,
                    roth401k: Math.round(num(v) * (1 - share) * 100) / 100 } };
                })} />
              <LabeledInput label="Roth IRA this year" prefix="$" value={d.rothIraYtd}
                onChange={(v) => (rothIraB ? setBucket(rothIraB.id, { ytd: v }) : setIn("ytd.rothIra", v))} />
            </div>
            <div className="grid grid-cols-2 gap-3 mt-3">
              <LabeledInput label="Employer match" prefix="$" value={state.ytd.match}
                onChange={(v) => setIn("ytd.match", v)} />
              <LabeledInput label="Wages this year" prefix="$" value={state.ytd.wagesYtd}
                onChange={(v) => setIn("ytd.wagesYtd", v)} />
            </div>
            <div className="text-[10px] mt-2 leading-relaxed" style={{ color: "var(--faint)" }}>
              Wages only change the maths above the {fmt0(state.taxData.fica.ssWageBase)} Social
              Security base and the {fmt0(200000)} additional-Medicare threshold.
            </div>
          </div>
        )}
      </Card>

      {state.bankroll.enabled && (
        <>
          <SectionLabel right={<LinkButton onClick={() => setBankOpen(true)}>Manage</LinkButton>}>
            {state.bankroll.name}
          </SectionLabel>
          <Card className="mb-1">
            <div className="flex items-center gap-2 mb-1">
              {/* --muted, not a series hue: the light magenta step is a mark
                  colour and sits under 3:1 as an icon on white. */}
              <IconDice className="w-4 h-4" style={{ color: "var(--muted)" }} />
              <span className="text-[11px]" style={{ color: "var(--faint)" }}>Marked to market — tap to update</span>
            </div>
            <EditableAmount value={state.bankroll.balance} onChange={markBankroll} size="text-[28px]" />

            {b.tracking ? (
              <>
                <div className="flex gap-4 mt-4 pt-4" style={{ borderTop: "1px solid var(--border)" }}>
                  <Stat label="Put in" value={fmtShort(b.deposited)} />
                  <Stat label="Taken out" value={fmtShort(b.withdrawn)} />
                  <Stat label="Profit" value={fmtShort(b.profit)}
                    color={b.profit >= 0 ? "var(--good)" : "var(--bad)"}
                    sub={b.twrOk ? `${(b.twr * 100).toFixed(1)}% return` : "return needs 2 marks"}
                    align="right" />
                </div>
                <div className="text-[11px] mt-3 leading-relaxed" style={{ color: "var(--faint)" }}>
                  Since {new Date(b.trackingSince + "T00:00:00").toLocaleDateString("en-US",
                    { month: "long", day: "numeric", year: "numeric" })}, starting from{" "}
                  {fmt0(b.startBalance)}.{" "}
                  {b.twrOk
                    ? `Return is measured on the money actually at risk across ${b.twrPeriods + 1} marks, not on what you deposited.`
                    : "Update the balance above every so often and a real return figure appears — it needs at least two marks to measure anything."}
                </div>
              </>
            ) : (
