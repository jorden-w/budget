              <div className="mt-4 pt-4" style={{ borderTop: "1px solid var(--border)" }}>
                <div className="text-[11px] leading-relaxed mb-3" style={{ color: "var(--muted)" }}>
                  No performance history yet. A bankroll that's been cycling for years has no
                  recoverable record of what went in, and a return computed against a guessed
                  number would just be a guess wearing a percent sign. Start from today instead.
                </div>
                <Button variant="ghost" size="sm" className="w-full"
                  onClick={() => update((s) => ({ ...s, bankroll: { ...s.bankroll,
                    trackingSince: todayISO(), startBalance: num(s.bankroll.balance),
                    deposited: 0, withdrawn: 0, movements: [],
                    marks: [{ date: new Date().toISOString(), balance: num(s.bankroll.balance) }] } }))}>
                  Start tracking from today at {fmt0(state.bankroll.balance)}
                </Button>
              </div>
            )}

            {/* ---- reserve + movements ---- */}
            <div className="mt-4 p-4 rounded-2xl"
                 style={{ background: b.unfunded > 0 ? "var(--warn-soft)" : "var(--card-2)",
                          border: b.unfunded > 0 ? "1px solid var(--warn)33" : "1px solid var(--border)" }}>
              <div className="flex items-baseline justify-between mb-1.5">
                <span className="text-[12px] font-semibold">Bankroll reserve</span>
                <span className="font-mono-num text-[13px]">{fmt(b.reserve)}</span>
              </div>
              {b.unfunded > 0 ? (
                <>
                  <div className="text-[11px] leading-relaxed" style={{ color: "var(--muted)" }}>
                    <span className="font-mono-num" style={{ color: "var(--text)" }}>{fmt(b.unfunded)}</span>{" "}
                    went into a book without coming out of another one — that's new money, so move it
                    across from the reserve sitting in savings.
                    {b.reserveAfterBackfill < 0 && (
                      <> The reserve is {fmt(-b.reserveAfterBackfill)} short, so the rest is coming out of
                      ordinary savings.</>
                    )}
                  </div>
                  <Button variant="ghost" size="sm" className="mt-3"
                    onClick={() => update((s) => {
                      const rb = reserveBucket(s);
                      const cover = rb ? Math.min(b.unfunded, num(rb.balance)) : 0;
                      return { ...s,
                        bankroll: { ...s.bankroll, movements: (s.bankroll.movements || []).map((m) =>
                          m.type === "deposit" && !m.funded ? { ...m, funded: true } : m) },
                        buckets: rb ? s.buckets.map((x) => x.id === rb.id
                          ? { ...x, balance: num(x.balance) - cover } : x) : s.buckets };
                    })}>
                    {b.reserve >= b.unfunded
                      ? `Done — I moved ${fmt(b.unfunded)}`
                      : b.reserve > 0
                        ? `Done — I moved ${fmt(b.reserve)} and covered the rest`
                        : "Done — I covered it from savings"}
                  </Button>
                </>
              ) : (
                <div className="text-[11px] leading-relaxed" style={{ color: "var(--muted)" }}>
                  {state.bankroll.reserveBucketId
                    ? <>Earmarked in savings so a deposit never has to come out of rent money.
                        {d.pay.netPay > 0 && num(state.bankroll.contribPct) > 0 && (
                          <> You're adding {fmt(d.pay.netPay * num(state.bankroll.contribPct) / 100)} a
                          check ({state.bankroll.contribPct}%).</>
                        )}</>
                    : <>No reserve bucket yet. Add one on Plan with a percentage-of-pay fill, then
                        pick it in Manage — deposits will draw from it instead of your spending money.</>}
                </div>
              )}
              <Button variant="ghost" size="sm" className="mt-3 w-full" icon={IconArrowDown}
                onClick={() => setMoveOpen(true)}>Log a movement</Button>
            </div>

            {b.taxable > 0 && (
              <div className="mt-4 p-4 rounded-2xl"
                   style={{ background: b.reserveShortfall > 0 ? "var(--warn-soft)" : "var(--good-soft)",
                            border: `1px solid ${b.reserveShortfall > 0 ? "var(--warn)" : "var(--good)"}33` }}>
                <div className="flex items-baseline justify-between mb-1.5">
                  <span className="text-[12px] font-semibold">Tax set-aside</span>
                  <span className="font-mono-num text-[13px]">{fmt0(state.bankroll.taxReserve)} / {fmt0(b.taxOwedEstimate)}</span>
                </div>
                <div className="text-[11px] leading-relaxed" style={{ color: "var(--muted)" }}>
                  Winnings are ordinary income — taxed at your normal rate, but with no Social
                  Security or Medicare on top, and nothing withheld automatically. At your{" "}
                  {(d.marginalCombined * 100).toFixed(0)}% marginal rate that's about{" "}
                  <span className="font-mono-num" style={{ color: "var(--text)" }}>{fmt0(b.taxOwedAtSuggested)}</span> on{" "}
                  {fmt0(b.taxable)} of taxable winnings.
                </div>
                {b.taxFromGross ? (
                  b.phantomIncome > 0 && (
                    <div className="text-[11px] mt-2 leading-relaxed" style={{ color: "var(--muted)" }}>
                      That's {fmt0(b.phantomIncome)} more than the {fmt0(b.ytdStatedProfit)} you're
                      actually up. From 2026 only {(GAMBLING_LOSS_DEDUCTIBLE * 100).toFixed(0)}% of losses
                      are deductible, so the rest is taxed as income you never kept — and losses only
                      count at all if you itemise.
                    </div>
                  )
                ) : (
                  <div className="text-[11px] mt-2 leading-relaxed" style={{ color: "var(--muted)" }}>
                    Based on net profit, which is the optimistic answer. Add your gross won and lost in
                    Manage — the taxable figure is usually well above net once the 90% loss cap bites.
                  </div>
                )}
                <div className="grid grid-cols-2 gap-3 mt-3">
                  <LabeledInput label="Set aside %" suffix="%" value={state.bankroll.taxSetAsidePct}
                    onChange={(v) => setIn("bankroll.taxSetAsidePct", v)} />
                  <LabeledInput label="Reserved" prefix="$" value={state.bankroll.taxReserve}
                    onChange={(v) => setIn("bankroll.taxReserve", v)} />
                </div>
              </div>
            )}

            <div className="mt-3 p-3.5 rounded-2xl" style={{ background: "var(--card-2)" }}>
              <div className="text-[11px] leading-relaxed" style={{ color: "var(--muted)" }}>
                This pool is excluded from the essentials test on purpose. Rent gets covered by
                your paycheck; betting profit funds goals and investments, never the lease.
              </div>
            </div>
          </Card>
        </>
      )}

      <SectionLabel right={<LinkButton onClick={() => addBucket({
        name: "New account", kind: "invest", fill: "fixed", amountMonthly: 100,
      })}>+ Add</LinkButton>}>Monthly investing</SectionLabel>
      <Card className="mb-1">
        {investBuckets.length === 0 ? (
          <EmptyState icon={IconChart} title="No investment accounts" />
        ) : investBuckets.map((x, i) => (
          <div key={x.id} className="py-3" style={{ borderBottom: i < investBuckets.length - 1 ? "1px solid var(--border)" : "none" }}>
            <div className="flex items-center gap-2.5 mb-2">
              <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: slotVar(x.slot) }} />
              <input value={x.name} onChange={(e) => setBucket(x.id, { name: e.target.value })}
                className="flex-1 bg-transparent outline-none text-[13px] font-medium min-w-0" />
              <span className="font-mono-num text-[13px] shrink-0">{fmt0(x.balance)}</span>
              <button onClick={() => removeBucket(x.id)} className="p-1 pressable shrink-0" style={{ color: "var(--faint)" }}>
                <IconTrash className="w-3.5 h-3.5" />
              </button>
            </div>
            <div className="grid grid-cols-3 gap-2">
              <LabeledInput label="Monthly" prefix="$" value={x.amountMonthly} onChange={(v) => setBucket(x.id, { amountMonthly: v })} />
              <LabeledInput label="Limit" prefix="$" value={x.capAnnual} onChange={(v) => setBucket(x.id, { capAnnual: v })} />
              <LabeledInput label="Balance" prefix="$" value={x.balance} onChange={(v) => setBucket(x.id, { balance: v })} />
            </div>
            {num(x.capAnnual) > 0 && (
              <div className="mt-2.5">
                <ProgressBar value={num(x.ytd) / num(x.capAnnual)} color={slotVar(x.slot)} height={4} />
                <div className="text-[10px] mt-1" style={{ color: "var(--faint)" }}>
                  {fmt0(x.ytd)} of {fmt0(x.capAnnual)} this year
                </div>
              </div>
            )}
          </div>
        ))}
        <div className="flex items-baseline justify-between pt-3 mt-1" style={{ borderTop: "1px solid var(--border)" }}>
          <span className="text-[13px] font-semibold">Total invested monthly</span>
          <span className="font-mono-num text-[14px] font-semibold" style={{ color: "var(--s7)" }}>
            {fmt0(investBuckets.reduce((s, x) => s + num(x.amountMonthly), 0) + toMonthly(d.pay.total401k + d.match.match, d.cadence))}
          </span>
        </div>
        <div className="text-[10px] mt-1" style={{ color: "var(--faint)" }}>
          Including {fmt0(toMonthly(d.pay.total401k, d.cadence))} of 401(k) and {fmt0(toMonthly(d.match.match, d.cadence))} of match.
        </div>
      </Card>

      {state.modules.debt && <DebtSection state={state} update={update} />}

      <BankrollSheet open={bankOpen} onClose={() => setBankOpen(false)} state={state}
        setIn={setIn} update={update} b={b} />

      <MovementSheet open={moveOpen} onClose={() => setMoveOpen(false)}
        books={state.bankroll.books || []} reserve={b.reserve} onLog={logMovement} />
    </div>
  );
}

/**
 * Log one movement of money.
 *
 * The three types exist because they mean completely different things to your
 * finances. Shuffling funds from one book to another costs nothing. Putting
 * new money in is capital leaving your bank — which is the case that needs the
 * reserve behind it.
 */
function MovementSheet({ open, onClose, books, reserve, onLog }) {
  const [type, setType] = useState("deposit");
  const [amt, setAmt] = useState(0);
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");
  const [date, setDate] = useState(todayISO());
  useEffect(() => { if (open) { setType("deposit"); setAmt(0); setFrom(""); setTo(""); setDate(todayISO()); } }, [open]);

  const bookOptions = [{ value: "", label: "Not tracked" },
                       ...books.map((b) => ({ value: b.name, label: b.name }))];
  const covered = type !== "deposit" || amt <= reserve;

  return (
    <Modal open={open} onClose={onClose} title="Log a movement"
      subtitle="Money in, money out, or money shuffled between books">
      <div className="space-y-5">
        <div className="flex gap-2">
          <Pill active={type === "deposit"} onClick={() => setType("deposit")}>Money in</Pill>
          <Pill active={type === "withdraw"} onClick={() => setType("withdraw")}>Money out</Pill>
          <Pill active={type === "transfer"} onClick={() => setType("transfer")}>Between books</Pill>
        </div>

        <div className="text-[11px] leading-relaxed" style={{ color: "var(--muted)" }}>
          {type === "deposit"
            ? "New money from your bank into a book. This is the one that draws on your reserve."
            : type === "withdraw"
              ? "Money coming out of a book back to your bank. Your bankroll shrinks; your cash grows."
              : "Moving funds from one book to another. Your bankroll total doesn't change and nothing needs backfilling."}
        </div>

        <Field label="Amount">
          <div className="flex items-center rounded-2xl px-3.5"
               style={{ background: "var(--card-2)", border: "1px solid var(--border)" }}>
            <span className="text-[13px] mr-1" style={{ color: "var(--faint)" }}>$</span>
            <NumInput value={amt} onChange={setAmt}
              className="w-full bg-transparent outline-none py-3 font-mono-num text-[14px]" style={{ color: "var(--text)" }} />
          </div>
        </Field>

        {books.length > 0 && (
          <div className="grid grid-cols-2 gap-3">
            {type !== "deposit" && (
              <Field label="Out of"><Select value={from} onChange={setFrom} className="w-full" options={bookOptions} /></Field>
            )}
            {type !== "withdraw" && (
              <Field label="Into"><Select value={to} onChange={setTo} className="w-full" options={bookOptions} /></Field>
            )}
          </div>
        )}

        <Field label="When">
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)}
            className="w-full rounded-xl px-3 py-2.5 text-[13px] outline-none"
            style={{ background: "var(--card-2)", border: "1px solid var(--border)", color: "var(--text)" }} />
        </Field>

        {type === "deposit" && amt > 0 && (
          <div className="p-4 rounded-2xl"
               style={{ background: covered ? "var(--card-2)" : "var(--warn-soft)",
                        border: covered ? "1px solid var(--border)" : "1px solid var(--warn)33" }}>
            <Row label="Bankroll reserve" value={fmt(reserve)} />
            <Row indent label="This deposit" value={`−${fmt(amt)}`} color="var(--muted)" />
            <Divider my={1} />
            <Row label="Left in the reserve" bold value={fmt(reserve - amt)}
              color={covered ? "var(--good)" : "var(--bad)"} />
            {!covered && (
              <div className="text-[11px] mt-2 leading-relaxed" style={{ color: "var(--muted)" }}>
                The reserve doesn't cover this, so {fmt(amt - reserve)} comes out of ordinary savings.
                You can still log it — you'll just be told it's outstanding.
              </div>
            )}
          </div>
        )}

        <Button className="w-full" disabled={amt <= 0}
          onClick={() => { onLog({ type, amount: amt, fromBook: from, toBook: to, date }); onClose(); }}>
          {type === "deposit" ? `Log ${fmt(amt)} in` : type === "withdraw" ? `Log ${fmt(amt)} out` : `Move ${fmt(amt)}`}
        </Button>
      </div>
    </Modal>
  );
}

function DebtSection({ state, update }) {
  const debts = [...(state.debts || [])].sort((a, b) => num(b.apr) - num(a.apr));
  const setDebt = (id, patch) => update((s) => ({ ...s, debts: s.debts.map((x) => x.id === id ? { ...x, ...patch } : x) }));

  const payoff = (dbt) => {
    let bal = num(dbt.balance);
    const pay = num(dbt.minPayment) + num(dbt.extraPayment);
    const r = num(dbt.apr) / 100 / 12;
    if (bal <= 0) return 0;
    if (pay <= bal * r) return null;
    let m = 0;
    while (bal > 0 && m < 600) { bal = bal * (1 + r) - pay; m++; }
    return m;
  };

  return (
    <>
      <SectionLabel right={<LinkButton onClick={() => update((s) => ({
        ...s, debts: [...s.debts, { id: uid(), name: "New debt", balance: 0, apr: 0, minPayment: 0, extraPayment: 0 }],
      }))}>+ Add</LinkButton>}>Debt</SectionLabel>
      <Card className="mb-1">
        {debts.length === 0 ? (
          <EmptyState icon={IconCard} title="No debt" body="Highest interest rate first — that's the cheapest order." />
        ) : debts.map((x, i) => {
          const mo = payoff(x);
          return (
            <div key={x.id} className="py-3" style={{ borderBottom: i < debts.length - 1 ? "1px solid var(--border)" : "none" }}>
              <div className="flex items-center gap-2 mb-2.5">
                <input value={x.name} onChange={(e) => setDebt(x.id, { name: e.target.value })}
                  className="flex-1 bg-transparent outline-none text-[13px] font-medium min-w-0" />
                {num(x.apr) > 7 && <Pill tone="bad">high rate</Pill>}
                <button onClick={() => update((s) => ({ ...s, debts: s.debts.filter((y) => y.id !== x.id) }))}
                  className="p-1 pressable shrink-0" style={{ color: "var(--faint)" }}>
                  <IconTrash className="w-3.5 h-3.5" />
                </button>
              </div>
              <div className="grid grid-cols-4 gap-2">
                <LabeledInput label="Balance" prefix="$" value={x.balance} onChange={(v) => setDebt(x.id, { balance: v })} />
                <LabeledInput label="APR" suffix="%" value={x.apr} onChange={(v) => setDebt(x.id, { apr: v })} />
                <LabeledInput label="Min" prefix="$" value={x.minPayment} onChange={(v) => setDebt(x.id, { minPayment: v })} />
                <LabeledInput label="Extra" prefix="$" value={x.extraPayment} onChange={(v) => setDebt(x.id, { extraPayment: v })} />
              </div>
              <div className="text-[10px] mt-2" style={{ color: mo === null ? "var(--bad)" : "var(--faint)" }}>
                {mo === null ? "This payment doesn't cover the interest — the balance grows."
                  : mo === 0 ? "Paid off."
                  : `${mo} months to payoff at ${fmt0(num(x.minPayment) + num(x.extraPayment))}/mo, interest included.`}
              </div>
            </div>
          );
        })}
      </Card>
    </>
  );
}

      {tab === "data" && (
        <div>
          <div className="p-4 rounded-2xl mb-5" style={{ background: "var(--warn-soft)", border: "1px solid var(--warn)33" }}>
            <div className="text-[12px] leading-relaxed" style={{ color: "var(--muted)" }}>
              Everything lives in this browser's local storage. There's no account and no server —
              clearing site data, or a lost phone, loses it. Export regularly.
            </div>
          </div>
          {/* Statement import is deliberately separate from Restore: Restore
              REPLACES everything, which would be the wrong tool for adding one
              month of transactions. */}
          <div className="p-4 rounded-2xl mb-5" style={{ background: "var(--card-2)" }}>
            <div className="text-[13px] font-semibold mb-1">Import statements</div>
            <div className="text-[11px] leading-relaxed mb-3" style={{ color: "var(--muted)" }}>
              Load the file the statements skill produces. It merges transactions into that
              month — nothing else in your data is touched, and re-importing the same file
              is ignored.
            </div>
            <Button variant="ghost" size="sm" className="w-full" icon={IconUpload}
              onClick={() => stmtRef.current?.click()}>Choose import file</Button>
            <input ref={stmtRef} type="file" accept="application/json" className="hidden"
              onChange={(e) => {
                const f = e.target.files?.[0];
                if (!f) return;
                const reader = new FileReader();
                reader.onload = () => { importStatements(reader.result); };
                reader.readAsText(f);
                e.target.value = "";
              }} />
          </div>

          <Button className="w-full mb-2" icon={IconDownload} onClick={exportData}>Download backup</Button>
          <Button variant="ghost" className="w-full mb-2" icon={IconUpload} onClick={() => fileRef.current?.click()}>
            Restore from file
          </Button>
          <input ref={fileRef} type="file" accept="application/json" className="hidden"
            onChange={(e) => {
              const f = e.target.files?.[0];
              if (!f) return;
              const reader = new FileReader();
              reader.onload = () => { if (importData(reader.result)) onClose(); };
              reader.readAsText(f);
              e.target.value = "";
            }} />
          <Button variant="ghost" className="w-full mb-5" icon={IconCopy}
            onClick={() => { navigator.clipboard?.writeText(JSON.stringify(state)); setToast("Copied to clipboard"); }}>
            Copy JSON to clipboard
          </Button>

          <Field label="Or paste a backup">
            <textarea value={importText} onChange={(e) => setImportText(e.target.value)}
              placeholder='{"schemaVersion":4,...}' rows={4}
              className="w-full rounded-2xl px-3.5 py-3 text-[12px] outline-none font-mono-num"
              style={{ background: "var(--card-2)", border: "1px solid var(--border)", color: "var(--text)" }} />
          </Field>
          <Button variant="ghost" className="w-full mt-2" disabled={!importText.trim()}
            onClick={() => { if (importData(importText)) { setImportText(""); onClose(); } }}>

          </Button>

          <div className="text-[11px] mt-4 leading-relaxed" style={{ color: "var(--faint)" }}>
            {state.lastExportAt
              ? `Last backup ${Math.round((Date.now() - state.lastExportAt) / 86400000)} days ago.`
              : "Never backed up."}
            {" "}Backups from older versions are accepted here too — they convert automatically.
          </div>

          <div className="mt-6 pt-5" style={{ borderTop: "1px solid var(--border)" }}>
            <Button variant="danger" className="w-full"
              onClick={() => {
                if (confirm("Erase everything and start over? This can't be undone — export a backup first if you're not sure.")) {
                  localStorage.removeItem(STORAGE_KEY);
                  location.reload();
                }
              }}>Erase all data</Button>
          </div>
          <div className="text-center text-[10px] mt-6" style={{ color: "var(--faint)" }}>
            Schema v{SCHEMA_VERSION} · {TAX_YEAR} tax data ·{" "}
            <a href="index.html?test=1" style={{ color: "var(--accent-text)" }}>run test suite</a>
          </div>
        </div>
      )}
    </Modal>
  );
}


// ===================== §15  WIZARD =====================
//
// Ten screens. Long by design — the point is that when you finish, the app is
// genuinely set up rather than full of placeholders you have to hunt down.
// Skippable from screen one, which leaves a checklist on Today instead.

const PRIORITY_OPTIONS = [
  { key: "card",      label: "Pay off my credit card",   hint: "Clear the balance and stop carrying it" },
  { key: "emergency", label: "Build an emergency fund",  hint: "A buffer so a bad month isn't a crisis" },
  { key: "car",       label: "Buy the car outright",     hint: "Finish the buyout, then keep it running" },
  { key: "match",     label: "Get the full 401(k) match", hint: "Free money you're entitled to" },
  { key: "roth",      label: "Max my Roth IRA",          hint: "Use the year's room before it expires" },
  { key: "invest",    label: "Invest more generally",    hint: "Beyond retirement accounts" },
  { key: "save",      label: "Save for something specific", hint: "A trip, a deposit, a purchase" },
  { key: "spend",     label: "Just stop overspending",   hint: "Know where the money actually goes" },
];

function Wizard({ state, onDone, onSkip }) {
  const [step, setStep] = useState(0);
  const [s, setS] = useState(state);

  const setIn = (path, value) => setS((prev) => {
    const keys = path.split(".");
    const next = { ...prev };
    let cur = next;
    for (let i = 0; i < keys.length - 1; i++) {
      cur[keys[i]] = Array.isArray(cur[keys[i]]) ? [...cur[keys[i]]] : { ...cur[keys[i]] };
      cur = cur[keys[i]];
    }
    cur[keys[keys.length - 1]] = value;
    return next;
  });
  const setBucketByName = (name, patch) => setS((prev) => ({
    ...prev, buckets: prev.buckets.map((b) => (b.name === name ? { ...b, ...patch } : b)),
  }));
  const bucketByName = (name) => s.buckets.find((b) => b.name === name) || {};
  const preview = useMemo(() => { try { return derive(s); } catch { return null; } }, [s]);

  const togglePriority = (key) => setS((prev) => {
    const cur = prev.priorities || [];
    return { ...prev, priorities: cur.includes(key) ? cur.filter((k) => k !== key) : [...cur, key] };
  });

  /** Reorder the waterfall to match what the user said matters. */
  const applyPriorities = (st) => {
    const pri = st.priorities || [];
    if (!pri.length) return st;
    const rank = (b) => {
      // Essentials always come first regardless — you can't skip rent.
      if (b.essential && b.kind === "expense") return 0;
      const idx = (key) => { const i = pri.indexOf(key); return i < 0 ? 99 : i; };
      if (/emergency/i.test(b.name)) return 1 + idx("emergency");
      if (/car (maintenance|replacement)/i.test(b.name)) return 1 + idx("car");
      if (/roth ira/i.test(b.name)) return 1 + idx("roth");
      if (b.kind === "invest") return 1 + idx("invest");
      if (b.kind === "goal") return 1 + idx("save");
      if (b.kind === "discretionary") return 50;
      return 20;
    };
    return { ...st, buckets: [...st.buckets].sort((a, b) => rank(a) - rank(b)) };
  };

  const steps = [
    {
      title: "Let's set this up",
      body: "A handful of short screens. When you're done the app is actually configured — no placeholders left to hunt down.",
      content: (
        <div className="space-y-3">
          <div className="p-5 rounded-2xl" style={{ background: "var(--card-2)" }}>
            <div className="text-[13px] font-semibold mb-3">What this does</div>
            <ul className="text-[12px] space-y-2.5 leading-relaxed" style={{ color: "var(--muted)" }}>
              <li>• Works out your real take-home — actual federal brackets, Social Security, Medicare and state tax.</li>
              <li>• Flows that money down a priority list you control, stopping at caps and targets automatically.</li>
              <li>• Sizes your emergency fund and car fund from what things actually cost.</li>
              <li>• Tracks bills by due date, and compares what you planned against what you really spent.</li>
            </ul>
          </div>
          <TextInput label="What should I call you?" value={s.profile.name}
            onChange={(v) => setIn("profile.name", v)} placeholder="Optional" />
        </div>
      ),
    },
    {
      title: "Where you live",
      body: "This drives every tax number in the app.",
      content: (
        <div className="grid grid-cols-2 gap-3">
          <Field label="State" wide hint={(() => {
            const i = stateInfo(s.profile.stateCode);
            return i.kind === "none" ? "No state income tax."
              : i.kind === "flat" ? `Flat ${(i.rate * 100).toFixed(2)}% — exact.`
              : `Progressive brackets; ${(i.rate * 100).toFixed(2)}% effective estimate, adjustable later.`;
          })()}>
            <Select value={s.profile.stateCode} onChange={(v) => setIn("profile.stateCode", v)} className="w-full"
              options={STATE_TAX.map((x) => ({ value: x.code, label: x.name }))} />
          </Field>
          <Field label="Filing status">
            <Select value={s.profile.filingStatus} onChange={(v) => setIn("profile.filingStatus", v)} className="w-full"
              options={[{ value: "single", label: "Single" }, { value: "married", label: "Married" }, { value: "hoh", label: "Head of household" }]} />
          </Field>
          <LabeledInput label="Your age" value={s.profile.age} onChange={(v) => setIn("profile.age", v)} />
        </div>
      ),
    },
    {
      title: "Your paycheck",
      body: "Gross, before anything comes out.",
      content: (
        <div className="grid grid-cols-2 gap-3">
          <Field label="Paid">
            <Select value={s.profile.payCadence} onChange={(v) => setIn("profile.payCadence", v)} className="w-full"
              options={Object.keys(PER_YEAR).map((k) => ({ value: k, label: CADENCE_LABEL[k] }))} />
          </Field>
          <LabeledInput label="Gross per paycheck" prefix="$" value={s.income.w2.grossPerCheck}
            onChange={(v) => setIn("income.w2.grossPerCheck", v)}
            hint={`${fmt0(toAnnual(s.income.w2.grossPerCheck, s.profile.payCadence))}/yr`} />
          <DateInput label="Next payday" value={s.profile.nextPayDate} onChange={(v) => setIn("profile.nextPayDate", v)} wide
            hint="Powers the bill calendar and tells you which months have a third paycheck." />
          {preview && (
            <div className="col-span-2 p-4 rounded-2xl" style={{ background: "var(--card-2)" }}>
              <div className="flex items-baseline justify-between">
                <span className="text-[12px]" style={{ color: "var(--muted)" }}>Estimated take-home</span>
                <span className="num-hero text-[20px]" style={{ color: "var(--good)" }}>{fmt(preview.pay.netPay)}</span>
              </div>
              <div className="text-[11px] mt-1" style={{ color: "var(--faint)" }}>
                {fmt0(preview.w2NetMonthly)}/mo · {pct(preview.pay.effectiveTaxRate * 100)} effective tax rate
              </div>
            </div>
          )}
        </div>
      ),
    },
    {
      title: "Retirement",
      body: "Employer match first — it's the only guaranteed return you'll be offered. Contribute at least enough to collect all of it.",
      content: (
        <div>
          <div className="p-4 rounded-2xl mb-5" style={{ background: "var(--card-2)" }}>
            <div className="text-[12px] font-medium mb-1">What your employer matches</div>
            <div className="text-[11px] mb-3 leading-relaxed" style={{ color: "var(--muted)" }}>
              The default is the most common arrangement. Your plan documents will say — it's
              worth checking, because every match figure in the app comes from these two numbers.
            </div>
            <div className="grid grid-cols-2 gap-3">
              <LabeledInput label="They match" suffix="%" value={s.match.tiers[0]?.matchPct ?? 100}
                onChange={(v) => setS((prev) => ({ ...prev, match: { ...prev.match,
                  tiers: [{ ...(prev.match.tiers[0] || {}), matchPct: num(v),
                            uptoPctOfPay: prev.match.tiers[0]?.uptoPctOfPay ?? 4 }] } }))} />
              <LabeledInput label="Of your first" suffix="%" value={s.match.tiers[0]?.uptoPctOfPay ?? 4}
                onChange={(v) => setS((prev) => ({ ...prev, match: { ...prev.match,
                  tiers: [{ ...(prev.match.tiers[0] || {}), uptoPctOfPay: num(v),
                            matchPct: prev.match.tiers[0]?.matchPct ?? 100 }] } }))} />
            </div>
            <div className="text-[11px] mt-2" style={{ color: "var(--faint)" }}>
              {s.match.tiers[0]?.matchPct ?? 100}% of the first {s.match.tiers[0]?.uptoPctOfPay ?? 4}% you
              contribute — so contributing {s.match.tiers[0]?.uptoPctOfPay ?? 4}% collects all of it.
            </div>
          </div>

          <DualSlider label="Total 401(k)" color="var(--s1)" base={s.income.w2.grossPerCheck} max={25}
            percent={num(s.preTax.trad401kPct) + num(s.postTax.roth401kPct)}
            onChange={(v) => {
              const cur = num(s.preTax.trad401kPct) + num(s.postTax.roth401kPct);
              const share = cur > 0 ? num(s.preTax.trad401kPct) / cur : 1;
              setS((prev) => ({ ...prev,
                preTax: { ...prev.preTax, trad401kPct: Math.round(v * share * 100) / 100 },
                postTax: { ...prev.postTax, roth401kPct: Math.round(v * (1 - share) * 100) / 100 } }));
            }} />
          {(() => {
            const total = num(s.preTax.trad401kPct) + num(s.postTax.roth401kPct);
            const share = total > 0 ? num(s.preTax.trad401kPct) / total * 100 : 100;
            return total > 0 ? (
              <div className="mt-5">
                <div className="flex items-center justify-between text-[11px] mb-2" style={{ color: "var(--muted)" }}>
                  <span className="flex items-center gap-1.5">
                    <span className="w-2 h-2 rounded-full" style={{ background: "var(--s1)" }} />
                    Traditional {share.toFixed(0)}%
                  </span>
                  <span className="flex items-center gap-1.5">
                    {(100 - share).toFixed(0)}% Roth
                    <span className="w-2 h-2 rounded-full" style={{ background: "var(--s4)" }} />
                  </span>
                </div>
                <input type="range" min="0" max="100" step="5" value={share} className="slider"
                  aria-label="Traditional versus Roth"
                  onChange={(e) => { const v = parseFloat(e.target.value);
                    setS((prev) => ({ ...prev,
                      preTax: { ...prev.preTax, trad401kPct: Math.round(total * v / 100 * 100) / 100 },
                      postTax: { ...prev.postTax, roth401kPct: Math.round(total * (100 - v) / 100 * 100) / 100 } })); }}
                  style={{ background: `linear-gradient(to right, var(--s1) 0%, var(--s1) ${share}%, var(--s4) ${share}%, var(--s4) 100%)` }} />
              </div>
            ) : null;
          })()}
          {preview && (

                  style={{ color: "var(--faint)" }}>
            Skip — I'll fill it in as I go
          </button>
        )}
      </div>
    </div>
  );
}


// ===================== §16  RENDER =====================
try {
  const isTest = /[?&]test=1\b/.test(location.search);
  const el = document.getElementById("root");
  el.innerHTML = "";
  ReactDOM.createRoot(el).render(isTest ? <TestRunner /> : <App />);
} catch (e) {
  document.getElementById("root").innerHTML =
    '<div style="padding:24px;font-family:ui-monospace,monospace;color:#be123c;font-size:12px;white-space:pre-wrap;">' +
    'App crashed while rendering:\n\n' + (e && e.message) + '\n\n' + (e && e.stack) + '</div>';
}

</script>
</body>
</html>
