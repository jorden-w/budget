 * Returns the amount carried INTO `mk` for each rollover-enabled bucket, by
 * walking forward from the earliest logged month so carries compound properly.
 */
const computeCarry = (state, mk) => {
  const months = Object.keys(state.months || {}).filter((k) => k < mk).sort();
  const carry = {};
  for (const b of state.buckets || []) {
    if (!b.rollover || b.archived) continue;
    let running = 0;
    for (const k of months) {
      const m = state.months[k] || {};
      const spent = monthActuals(m)[b.id];
      // A month with nothing logged is skipped — we don't know what happened,
      // and inventing a full carry would be a lie.
      if (spent === undefined || spent === null) continue;
      const budget = num(m.budget?.[b.id] ?? b.amountMonthly);
      running = Math.max(-budget * 3, running + budget - num(spent));
    }
    if (Math.abs(running) > 0.005) carry[b.id] = running;
  }
  return carry;
};

/** Budget available for a bucket in a month = its plan + anything carried in. */
const availableFor = (bucket, mk, state, carryMap) => {
  const m = state.months?.[mk] || {};
  const base = num(m.budget?.[bucket.id] ?? bucket.amountMonthly);
  const moved = (m.moves || []).reduce((sum, mv) =>
    sum + (mv.to === bucket.id ? num(mv.amount) : 0) - (mv.from === bucket.id ? num(mv.amount) : 0), 0);
  return base + num(carryMap?.[bucket.id]) + moved;
};

/** One card's balance/due-date/utilisation status. */
const cardStatus = (card, today = new Date()) => {
  const balance = num(card.statementBalance);
  const day = today.getDate();
  const dueDay = clamp(num(card.dueDay) || 1, 1, 28);
  let daysUntil = dueDay - day;
  if (daysUntil < 0) {
    const dim = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
    daysUntil += dim;
  }
  const util = num(card.creditLimit) > 0 ? balance / num(card.creditLimit) : null;
  return {
    card, id: card.id, name: card.name, slot: card.slot,
    balance, dueDay, daysUntil,
    utilization: util,
    // Above ~30% utilisation starts costing credit-score points even when you
    // pay in full, because the statement balance is what gets reported.
    utilizationWarn: util !== null && util > 0.30,
  };
};

/**
 * All cards as a single claim on cash.
 *
 * `freeToSpend` is what's actually yours once every statement clears. This is
 * the number that stops you feeling rich on the 20th and broke on the 23rd.
 */
const cardsStatus = (cards, cardsEnabled, checking, today = new Date()) => {
  const live = (cards || []).filter((c) => !c.archived);
  if (!cardsEnabled || !live.length) {
    return { enabled: false, list: [], totalBalance: 0, freeToSpend: num(checking), covered: true, nextDue: null };
  }
  const list = live.map((c) => cardStatus(c, today)).sort((a, b) => a.daysUntil - b.daysUntil);
  const totalBalance = list.reduce((s, c) => s + c.balance, 0);
  const totalLimit = live.reduce((s, c) => s + num(c.creditLimit), 0);
  return {
    enabled: true, list, totalBalance,
    freeToSpend: num(checking) - totalBalance,
    covered: num(checking) >= totalBalance,
    nextDue: list.find((c) => c.balance > 0) || list[0],
    overallUtilization: totalLimit > 0 ? totalBalance / totalLimit : null,
    anyUtilizationWarn: list.some((c) => c.utilizationWarn),
  };
};

// ---------- cash-flow forecast ----------

const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() &&
  a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

/**
 * Every payday between two dates.
 *
 * Walks forward from the known next pay date rather than dividing a year into
 * equal slices, which is what makes the two extra biweekly paycheques fall
 * where they actually fall instead of being smeared across twelve months.
 */
const payDatesBetween = (from, to, nextPayDate, cadence) => {
  if (!nextPayDate) return [];
  const out = [];
  let d = new Date(nextPayDate + "T00:00:00");
  if (isNaN(d)) return [];
  // Rewind in case the stored next-pay-date has drifted into the past.
  let guard = 0;
  while (d > from && guard++ < 400) {
    const back = new Date(d);
    if (cadence === "weekly") back.setDate(back.getDate() - 7);
    else if (cadence === "biweekly") back.setDate(back.getDate() - 14);
    else if (cadence === "semimonthly") back.setDate(back.getDate() - 15);
    else back.setMonth(back.getMonth() - 1);
    if (back < from) break;
    d = back;
  }
  guard = 0;
  while (d <= to && guard++ < 400) {
    if (d >= from) out.push(new Date(d));
    if (cadence === "weekly") d.setDate(d.getDate() + 7);
    else if (cadence === "biweekly") d.setDate(d.getDate() + 14);
    else if (cadence === "semimonthly") d.setDate(d.getDate() + 15);
    else d.setMonth(d.getMonth() + 1);
  }
  return out;
};

/**
 * Day-by-day projected checking balance.
 *
 * The question this answers is "do I make it to the next paycheque", and the
 * reason it needs to be day-by-day is that the answer isn't a smooth drain.
 * Rent on the 1st and an $782 card statement on the 7th are cliffs; the
 * month-end total can look fine while the 8th is underwater.
 *
 * Card spending is deliberately NOT taken out of checking as it happens — it
 * accrues on the card and leaves checking on the statement due date. Charging
 * both would double-count every purchase, which is the single easiest way to
 * build a forecast that's confidently wrong.
 */
const cashFlowForecast = (state, d, days = 60, today = new Date()) => {
  const start = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const end = addDays(start, days);
  const live = (state.buckets || []).filter((b) => !b.archived);

  // Bills leave checking on a known day. Everything else variable is a daily
  // drip. Savings and investing leave checking on payday.
  const bills = live.filter((b) => b.dueDay && (b.kind === "expense" || b.kind === "discretionary"));
  const variable = live.filter((b) => !b.dueDay && (b.kind === "expense" || b.kind === "discretionary"));
  const transfers = live.filter((b) => b.kind === "goal" || b.kind === "invest" || b.kind === "sinking");

  const variableMonthly = variable.reduce((s, b) => s + num(b.amountMonthly), 0);
  const perCheck = (monthly) => monthly * 12 / (PER_YEAR[d.cadence] || 12);
  const transferPerCheck = transfers.reduce((s, b) => s + perCheck(num(b.amountMonthly)), 0);

  const paydays = payDatesBetween(start, end, state.profile?.nextPayDate, d.cadence);
  const netPay = num(d.pay?.netPay);

  const cards = (state.cards || []).filter((c) => !c.archived);
  const cardBal = {};
  for (const c of cards) cardBal[c.id] = num(c.statementBalance);
  const spendOnCard = state.forecast?.spendOn === "checking" ? null
    : (cards.find((c) => String(c.id) === String(state.forecast?.cardId)) || cards[0] || null);

  let checking = num(state.accounts?.checking);
  const series = [];
  let low = { date: start, balance: checking };
  let firstNegative = null;

  for (let i = 0; i <= days; i++) {
    const day = addDays(start, i);
    const dayOfMonth = day.getDate();
    const daysInMonth = new Date(day.getFullYear(), day.getMonth() + 1, 0).getDate();
    const events = [];

    if (i > 0) {
      if (paydays.some((p) => sameDay(p, day))) {
        checking += netPay;
        events.push({ label: "Paycheck", amount: netPay });
        if (transferPerCheck > 0) {
          checking -= transferPerCheck;
          events.push({ label: "To savings & investing", amount: -transferPerCheck });
        }
      }
      for (const b of bills) {
        if (num(b.dueDay) === dayOfMonth) {
          checking -= num(b.amountMonthly);
          events.push({ label: b.name, amount: -num(b.amountMonthly) });
        }
      }
      for (const c of cards) {
        if (num(c.dueDay) === dayOfMonth && cardBal[c.id] > 0) {
          checking -= cardBal[c.id];
          events.push({ label: `${c.name} statement`, amount: -cardBal[c.id] });
          cardBal[c.id] = 0;
        }
      }
      // The daily drip, onto the card if that's where spending goes.
      const burn = variableMonthly / daysInMonth;
      if (spendOnCard) cardBal[spendOnCard.id] += burn;
      else checking -= burn;
    }

    const cardTotal = Object.values(cardBal).reduce((s, v) => s + v, 0);
    if (checking < low.balance) low = { date: day, balance: checking };
    if (checking < 0 && !firstNegative) firstNegative = day;
    series.push({ date: todayISO(day), checking, cardTotal, free: checking - cardTotal, events });
  }

  const nextPay = paydays.find((p) => p > start) || null;
  const untilNextPay = nextPay
    ? series.slice(0, Math.round((nextPay - start) / 86400000) + 1)
    : series;
  const lowBeforePay = untilNextPay.reduce((m, p) => (p.checking < m.checking ? p : m), untilNextPay[0]);

  return {
    series, low, firstNegative,
    goesNegative: !!firstNegative,
    nextPay,
    makesItToPayday: !nextPay || lowBeforePay.checking >= 0,
    lowBeforePay,
    shortBy: lowBeforePay && lowBeforePay.checking < 0 ? -lowBeforePay.checking : 0,
    spendOnCard,
    dailyBurn: variableMonthly / 30.44,
    days,
  };
};

/**
 * What a card actually pays on a given category right now.
 *
 * Rotating bonus only counts when it's ACTIVATED for this quarter and the
 * category is in this quarter's list — an unactivated rotating card earns its
 * base rate, which is exactly the trap worth surfacing.
 */
const effectiveRate = (card, categoryKey, qk = quarterKey()) => {
  const r = card.rewards || {};
  const base = num(r.base);
  let best = base, reason = "base rate";

  for (const c of (r.categories || [])) {
    if (c.category === categoryKey && num(c.rate) > best) {
      best = num(c.rate); reason = "bonus category";
    }
  }

  const rot = r.rotating || {};
  if (rot.enabled) {
    const cats = rot.quarters?.[qk] || [];
    if (cats.includes(categoryKey)) {
      const activated = !!rot.activated?.[qk];
      const capLeft = num(rot.capQuarterly) > 0
        ? Math.max(0, num(rot.capQuarterly) - num(rot.spentThisQuarter))
        : Infinity;
      if (activated && capLeft > 0 && num(rot.rate) > best) {
        best = num(rot.rate);
        reason = "rotating category";
      } else if (!activated) {
        // Surface the miss rather than silently scoring it at base.
        return { rate: best, reason, blocked: "not activated", potential: num(rot.rate), capLeft };
      } else if (capLeft <= 0) {
        return { rate: best, reason, blocked: "quarterly cap reached", potential: num(rot.rate), capLeft: 0 };
      }
    }
  }
  return { rate: best, reason, blocked: null, potential: null };
};

/** Which card to pull out for a given category, and what the runner-up costs. */
const bestCardFor = (cards, categoryKey, qk = quarterKey()) => {
  const live = (cards || []).filter((c) => !c.archived);
  if (!live.length) return null;
  const scored = live
    .map((c) => ({ card: c, ...effectiveRate(c, categoryKey, qk) }))
    .sort((a, b) => b.rate - a.rate || num(a.card.statementBalance) - num(b.card.statementBalance));
  const winner = scored[0];
  const runnerUp = scored[1] || null;
  return {
    category: categoryKey, winner, runnerUp, all: scored,
    edge: runnerUp ? winner.rate - runnerUp.rate : winner.rate,
    // A blocked card that WOULD have won is the actionable case.
    missed: scored.find((s) => s.blocked && s.potential > winner.rate) || null,
  };
};

/** Rotating cards needing attention this quarter. */
const rotatingAttention = (cards, qk = quarterKey()) => {
  const out = [];
  for (const c of (cards || []).filter((x) => !x.archived)) {
    const rot = c.rewards?.rotating;
    if (!rot?.enabled) continue;
    const cats = rot.quarters?.[qk] || [];
    if (!cats.length) { out.push({ card: c, issue: "unset", qk }); continue; }
    if (!rot.activated?.[qk]) out.push({ card: c, issue: "inactive", qk, cats, rate: num(rot.rate) });
  }
  return out;
};

/** Bills with due dates, sorted by what's next. */
const upcomingBills = (buckets, today = new Date(), withinDays = 45) => {
  const out = [];
  const y = today.getFullYear(), mo = today.getMonth(), d = today.getDate();
  for (const b of buckets) {
    if (b.archived || !b.dueDay) continue;
    const dueDay = clamp(num(b.dueDay), 1, 31);
    for (let ahead = 0; ahead <= 2; ahead++) {
      const dim = new Date(y, mo + ahead + 1, 0).getDate();
      const date = new Date(y, mo + ahead, Math.min(dueDay, dim));
      const days = Math.round((date - new Date(y, mo, d)) / 86400000);
      if (days >= 0 && days <= withinDays) {
        out.push({ bucket: b, date, days, amount: num(b.amountMonthly) });
        break;
      }
    }
  }
  return out.sort((a, b) => a.days - b.days);
};

/** Which payday covers a given bill — the last one landing before it's due. */
const paydaysBetween = (nextPayDate, cadence, from, to) => {
  if (!nextPayDate) return [];
  const step = { weekly: 7, biweekly: 14, semimonthly: 15, monthly: 30, quarterly: 91, annual: 365 }[cadence] || 14;
  const out = [];
  const cursor = new Date(nextPayDate + "T12:00:00");
  if (isNaN(cursor)) return [];
  while (cursor < from) cursor.setDate(cursor.getDate() + step);
  while (cursor <= to && out.length < 30) {
    out.push(new Date(cursor));
    cursor.setDate(cursor.getDate() + step);
  }
  return out;
};

/** Net worth history as a chartable series, with this month's live value appended. */
const netWorthSeries = (history, liveTotal, liveMonth) => {
  const rows = [...(history || [])].sort((a, b) => (a.month < b.month ? -1 : 1));
  const filtered = rows.filter((r) => r.month !== liveMonth);
  return [...filtered, { month: liveMonth, total: liveTotal, live: true }];
};

/** Everything downstream of the raw state. One place, memoized in App(). */
const derive = (s) => {
  const cadence = s.profile.payCadence;
  const pay = computePayroll(
    s.income.w2.grossPerCheck, cadence, s.profile, s.preTax, s.postTax, s.taxData,
    num(s.ytd.wagesYtd)
  );
  const deferralPct = num(s.preTax.trad401kPct) + num(s.postTax.roth401kPct);
  const match = computeMatch(s.income.w2.grossPerCheck, deferralPct, s.match.tiers);

  const marginalCombined = pay.fedMarginal + pay.stateRate;
  const side = computeSideIncome(s.income.side, marginalCombined);
  const bank = bankrollStats(s.bankroll, marginalCombined, s);

  const w2NetMonthly = toMonthly(pay.netPay, cadence);
  const totalNetMonthly = w2NetMonthly + side.netMonthly;
  const grossMonthly = toMonthly(pay.gross, cadence) + side.grossMonthly;

  const car = carOwnershipCost(s.car);

  const live = s.buckets.filter((b) => !b.archived);
  const essentialMonthly = live
    .filter((b) => b.essential)
    .reduce((sum, b) => sum + num(b.amountMonthly), 0);
  const expenseMonthly = live
    .filter((b) => b.kind === "expense")
    .reduce((sum, b) => sum + num(b.amountMonthly), 0);

  // Emergency fund target keys off ESSENTIAL spending, not total spending —
  // in a real emergency you cut the rest.
  const emergencyTarget = num(s.emergency.months) * essentialMonthly;
  const emergencyBucket = live.find((b) => b.kind === "goal" && /emergency/i.test(b.name));
  const emergencyBalance = emergencyBucket ? num(emergencyBucket.balance) : num(s.accounts.savings);

  const bucketsForWaterfall = live.map((b) =>
    (b.kind === "goal" && /emergency/i.test(b.name) && num(b.target) === 0)
      ? { ...b, target: emergencyTarget }
      : b
  );
  const flow = runWaterfall(totalNetMonthly, bucketsForWaterfall);

  // Same waterfall sized to a single paycheck. Monthly budget amounts scale
  // down; targets and annual caps are absolute, so they stay as they are.
  const flowPerCheck = runWaterfall(
    pay.netPay,
    bucketsForWaterfall.map((b) =>
      b.fill === "pctOfNet" || b.fill === "remainder"
        ? b
        : { ...b, amountMonthly: fromMonthly(b.amountMonthly, cadence) }
    )
  );

  const debtTotal = (s.debts || []).reduce((sum, d) => sum + num(d.balance), 0);
  const debtMinMonthly = (s.debts || []).reduce((sum, d) => sum + num(d.minPayment) + num(d.extraPayment), 0);

  // Roth IRA and brokerage are bucket-tracked, so read their year-to-date and
  // balance off the bucket rather than a parallel counter that never updates.
  const rothIraBucket = live.find((b) => /roth ira/i.test(b.name));
  const brokerageBucket = live.find((b) => /brokerage/i.test(b.name));
  const rothIraYtd = rothIraBucket ? num(rothIraBucket.ytd) : num(s.ytd.rothIra);
  const rothIraBalance = rothIraBucket ? num(rothIraBucket.balance) : 0;
  const brokerageBalance = brokerageBucket ? num(brokerageBucket.balance) : 0;

  // ---- v4: rollover, bills, card ----
  const thisMonth = monthKey();
  const carry = computeCarry(s, thisMonth);
  const qk = quarterKey();
  const card = cardsStatus(s.cards, s.cardsEnabled, s.accounts.checking);
  const rotatingTodo = rotatingAttention(s.cards, qk);
  // Best card per budget category you actually spend on — the practical
  // "which one do I pull out" answer, not an abstract rewards table.
  const cardPicks = live
    .filter((b) => (b.kind === "expense" || b.kind === "discretionary") && num(b.amountMonthly) > 0)
    .map((b) => ({ bucket: b, pick: bestCardFor(s.cards, b.spendCategory || guessSpendCategory(b.name), qk) }))
    .filter((x) => x.pick);
  const bills = upcomingBills(live);
  const billsDueSoon = bills.filter((b) => b.days <= 7);
  const billsThisMonth = bills.filter((b) => b.date.getMonth() === new Date().getMonth());

  const netWorth =
    num(s.accounts.checking) + num(s.accounts.savings) +
    num(s.accounts.trad401k) + num(s.accounts.roth401k) + num(s.accounts.hsa) +
    live.reduce((sum, b) => sum + num(b.balance), 0) +
    (s.bankroll.enabled ? bank.balance : 0) +
    (s.car.owned ? num(s.car.resaleValue) : num(s.car.saved)) -
    debtTotal -
    // Card statements are money owed. Leaving them out overstated net worth
    // by the whole balance — the purchases had already happened, the cash to
    // cover them was still counted in checking, and nothing subtracted them.
    (s.cardsEnabled ? card.totalBalance : 0);

  // W-2 take-home alone must cover essentials. Betting and side income are
  // too variable to underwrite rent.
  const essentialsCoverage = essentialMonthly > 0 ? w2NetMonthly / essentialMonthly : Infinity;

  const out = {
    cadence, pay, match, deferralPct, side, bank, car,
    w2NetMonthly, totalNetMonthly, grossMonthly, marginalCombined,
    essentialMonthly, expenseMonthly, emergencyTarget, emergencyBalance, emergencyBucket,
    flow, flowPerCheck, netWorth, debtTotal, debtMinMonthly, essentialsCoverage,
    rothIraBucket, brokerageBucket, rothIraYtd, rothIraBalance, brokerageBalance,
    thisMonth, carry, card, bills, billsDueSoon, billsThisMonth,
    qk, rotatingTodo, cardPicks,
    // Money other people owe you. Kept out of every total on purpose — it's
    // an asset, not cash, and not everyone pays.
    owed: owedToYou(s),
    owedSplit: owedBreakdown(s),
    // Has a checking balance actually been entered? Everything cash-flow
    // shaped is meaningless until it has.
    cashKnown: isSet(s.accounts?.checking),
    hikes: priceHikes(s),
    nwSeries: netWorthSeries(s.netWorthHistory, netWorth, thisMonth),
    trad401kAnnual: toAnnual(pay.trad401k, cadence),
    roth401kAnnual: toAnnual(pay.roth401k, cadence),
    matchAnnual: toAnnual(match.match, cadence),
    extraPayMonths: extraPaycheckMonths(s.profile.nextPayDate, cadence),
  };

  // Needs the rest of `out` (cadence, net pay), so it's attached after.
  out.forecast = cashFlowForecast(s, out, num(s.forecast?.days) || 60);
  return out;
};

/** Rent affordability — the question you're actually asking while apartment hunting. */
const rentCheck = (rent, extras, d, s) => {
  const r = num(rent) + num(extras);
  const grossMonthly = d.grossMonthly;
  const pctGross = grossMonthly > 0 ? r / grossMonthly : 0;
  const pctNet = d.w2NetMonthly > 0 ? r / d.w2NetMonthly : 0;

  const otherEssentials = s.buckets
    .filter((b) => !b.archived && b.essential && !/^rent$/i.test(b.name))
    .reduce((sum, b) => sum + num(b.amountMonthly), 0);
  const leftAfter = d.w2NetMonthly - r - otherEssentials;

  let verdict = "good", note;
  if (pctNet > 0.40) { verdict = "bad"; note = "Over 40% of take-home. This crowds out saving and investing."; }
  else if (pctNet > 0.33) { verdict = "warn"; note = "Above a third of take-home. Doable, but tight once car and food are in."; }
  else { note = "Comfortably inside the usual guideline."; }
  if (leftAfter < 0) { verdict = "bad"; note = "Your essentials exceed your take-home at this rent."; }

  return { rent: r, pctGross, pctNet, otherEssentials, leftAfter, verdict, note,
           maxRecommended: d.w2NetMonthly * 0.30 - num(extras) };
};

/** Alerts surfaced on Home. Ordered most-urgent first. */
const recommendations = (s, d) => {
  const out = [];
  /**
   * `id` is what makes dismissal behave. It's a stable key for the *kind* of
   * alert, plus a coarse bucket of the number that triggered it — so
   * dismissing "you're $165 short" stays dismissed at $170, but a slide to
   * $900 is a different situation and speaks up again.
   */
  const push = (level, title, body, id) =>
    out.push({ level, title, body, id: id || title.toLowerCase().replace(/[^a-z]+/g, "-").slice(0, 40) });
  /** Bucket a figure so small drifts don't resurrect a dismissed alert. */
  const band = (v, step = 250) => Math.round(num(v) / step);

  // Running out of money on a specific date outranks everything else here.
  if (d.cashKnown && d.forecast?.goesNegative) {
    const when = new Date(todayISO(d.forecast.firstNegative) + "T00:00:00")
      .toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
    push("bad", `Checking runs dry on ${when}`,
      `Following your bills, card statements and usual spending, you go below zero${d.forecast.shortBy > 0 ? ` by about ${fmt(d.forecast.shortBy)}` : ""} before the next paycheck. Moving a due date or trimming a category now is easier than an overdraft then.`,
      `dry-${todayISO(d.forecast.firstNegative)}-${band(d.forecast.shortBy)}`);
  }

  // Cash shortfalls come first — they're the ones with a deadline.
  if (!d.cashKnown) {
    push("info", "Add your checking balance",
      "Nearly everything on Today — what's free to spend, the 60-day projection, whether your cards are covered — is measured from it. Until it's in, those are all blank rather than wrong.",
      "no-checking-balance");
  }
  if (d.cashKnown && d.card.enabled && d.card.totalBalance > 0 && !d.card.covered) {
    push("bad", "Checking won't cover your card statements",
      `${fmt(d.card.totalBalance)} across ${d.card.list.length} card${d.card.list.length === 1 ? "" : "s"} against ${fmt(s.accounts.checking)} in checking — you're ${fmt(d.card.totalBalance - num(s.accounts.checking))} short. This is the month a paid-in-full card turns into debt.`,
      `card-uncovered-${band(d.card.totalBalance - num(s.accounts.checking))}`);
  }
  // Unactivated rotating categories are free money being left on the table,
  // and the deadline is the end of the quarter.
  for (const t of d.rotatingTodo) {
    if (t.issue === "inactive") {
      push("warn", `Activate ${t.card.name}'s ${t.rate}% categories`,
        `${t.cats.map(spendLabel).join(", ")} pay ${t.rate}% this quarter, but only once you activate — until then it earns ${num(t.card.rewards.base)}%. ${daysLeftInQuarter()} days left in ${quarterLabel(t.qk)}.`,
        `activate-${t.card.id}-${t.qk}`);
    }
  }
  // One errand, not one alert per card.
  const needCats = d.rotatingTodo.filter((t) => t.issue === "unset");
  if (needCats.length) {
    const names = listJoin(needCats.map((t) => t.card.name));
    push("info", needCats.length === 1
      ? `${names} has no categories set for this quarter`
      : `${names} have no categories set for this quarter`,
      `Add what ${quarterLabel(needCats[0].qk)} pays the bonus rate on, and the card picker can tell you which one to reach for.`,
      `no-cats-${needCats.map((t) => t.card.id).join("-")}-${needCats[0].qk}`);
  }
  // A subscription that went up rarely announces itself.
  for (const h of (d.hikes || []).slice(0, 3)) {
    push("info", `${h.merchant} costs more than it used to`,
      `Now ${fmt(h.amount)} ${h.cadence}, was ${fmt(h.was)} — ${pct(h.delta * 100, 0)} more, or about ${fmt0((h.amount - h.was) * h.perYear)} a year. Worth deciding you still want it rather than finding out later.`,
      `hike-${h.key}-${band(h.amount, 5)}`);
  }

  for (const c of (d.card.list || [])) {
    if (c.utilizationWarn) {
      push("info", `${c.name} is above 30% utilisation`,
        `${fmt(c.balance)} against a ${fmt(c.card.creditLimit)} limit is ${pct(c.utilization * 100, 0)}. Even paying in full, the statement balance is what gets reported — paying down before the statement closes keeps it off your credit report.`,
      `util-${c.card.id}-${band(c.utilization * 100, 10)}`);
    }
  }
  const dueUnfunded = d.billsDueSoon.reduce((sum, b) => sum + b.amount, 0);
  if (d.cashKnown && dueUnfunded > num(s.accounts.checking) - (d.card.enabled ? d.card.totalBalance : 0)) {
    push("warn", "Bills due this week exceed free cash",
      `${fmt(dueUnfunded)} due within 7 days, and ${fmt(d.card.freeToSpend)} free after the card statement.`,
      `bills-tight-${band(dueUnfunded)}`);
  }
  if (!d.match.fullyCaptured && d.match.missing > 0) {
    push("bad", "You're leaving employer match on the table",
      `Contributing ${d.deferralPct.toFixed(1)}% gets you ${fmt(d.match.match)}/check. Going to ${(d.deferralPct + d.match.needPct).toFixed(1)}% would get the full ${fmt(d.match.maxMatch)} — an extra ${fmt(toAnnual(d.match.missing, d.cadence))} a year, free.`,
      `match-${band(d.match.missing, 5)}`);
  }
  if (d.flow.leftover < 0 || d.flow.unfunded.length > 0) {
    const short = d.flow.unfunded.reduce((sum, u) => sum + u.short, 0);
    push("bad", "Your plan doesn't fit your income",
      `${fmt(short)}/mo of what you've budgeted has nowhere to come from. ${d.flow.unfunded.slice(0, 3).map((u) => u.bucket.name).join(", ")}${d.flow.unfunded.length > 3 ? "…" : ""} come up short.`,
      `plan-short-${band(short)}`);
  }
  if (d.flow.starvedByRemainder.length > 0) {
    push("warn", "Buckets below a “whatever's left” bucket get nothing",
      `${d.flow.starvedByRemainder.join(", ")} sit below one and will always receive $0. Move them above it.`);
  }
  if (d.essentialsCoverage < 1 && d.essentialMonthly > 0) {
    push("bad", "Paycheck alone doesn't cover essentials",
      `Your W-2 take-home is ${fmt(d.w2NetMonthly)}/mo against ${fmt(d.essentialMonthly)} of essentials. Side and betting income are too variable to cover rent.`);
  }
  // The essentials ratio is a structural fact about your cost of living, not
  // a thing to do this week. It reads as nagging in an action list.
  if (d.emergencyBalance < num(s.emergency.starterTarget)) {
    push("warn", "No starter emergency fund yet",
      `${fmt(d.emergencyBalance)} saved against a ${fmt(s.emergency.starterTarget)} starter buffer. This is the single highest-value thing to fix first — it's what keeps a bad month off a credit card.`);
  }
  // "Emergency fund still filling" used to live here. It's a status, not
  // something to act on — a fund that's filling is a fund that's working.
  // It shows as progress on Grow instead.
  const rothB = s.buckets.find((b) => !b.archived && /roth ira/i.test(b.name));
  if (rothB && num(rothB.amountMonthly) > 0) {
    // Counts what's already in. Starting in August at a rate that clears the
    // remaining room is on track, and saying otherwise is just wrong.
    const pace = contributionPace(d.rothIraYtd, rothB.amountMonthly, s.limits.rothIra);
    if (!pace.maxed && !pace.onTrack && pace.monthsLeft > 1) {
      push("info", `Roth IRA lands about ${fmt0(pace.shortBy)} short of the cap`,
        `${fmt(d.rothIraYtd)} in so far and ${fmt(rothB.amountMonthly)}/mo for the ${pace.monthsLeft.toFixed(1)} months left gets you to ${fmt0(pace.projected)} of ${fmt0(s.limits.rothIra)}. ${fmt0(pace.needMonthly)}/mo from here would finish it. The room doesn't carry over.`);
    }
  }
  // Car buyout progress is a goal on Grow, not an alert. It has no deadline
  // this week and repeating it every load is noise.
  if (s.car.owned && d.car.sinkingTotalMonthly > 0) {
    const carBuckets = s.buckets.filter((b) => !b.archived && b.kind === "sinking" && /car/i.test(b.name));
    const budgeted = carBuckets.reduce((sum, b) => sum + num(b.amountMonthly), 0);
    if (budgeted < d.car.sinkingTotalMonthly * 0.8) {
      push("warn", "Car fund is underfunded",
        `A ${d.car.age}-year-old car at ${num(s.car.annualMiles).toLocaleString()} mi/yr wants about ${fmt(d.car.sinkingTotalMonthly)}/mo set aside. You're putting in ${fmt(budgeted)}.`);
    }
  }
  // The one that fires most often: money went into a book from your bank
  // rather than from another book, so the reserve is what should cover it.
  if (s.bankroll.enabled && d.bank.unfunded > 0) {
    const dry = d.bank.reserveAfterBackfill < 0;
    push(dry ? "warn" : "info", "Backfill the bankroll from your reserve",
      `${fmt(d.bank.unfunded)} went into a book without coming out of another one, so that's new money — move it from the ${fmt(d.bank.reserve)} sitting in your bankroll reserve.` +
      (dry ? ` The reserve only covers ${fmt(d.bank.reserve)} of it, so ${fmt(-d.bank.reserveAfterBackfill)} is coming out of ordinary savings.`
           : ` That leaves ${fmt(d.bank.reserveAfterBackfill)} in the reserve.`));
  }
  if (s.bankroll.enabled && d.bank.reserveShortfall > 0) {
    push("warn", "Betting tax reserve is short",
      `${fmt(d.bank.taxable)} of taxable winnings implies roughly ${fmt(d.bank.taxOwedEstimate)} owed at your ${s.bankroll.taxSetAsidePct}% set-aside. You've reserved ${fmt(s.bankroll.taxReserve)}. Winnings are ordinary income — no withholding happens automatically.` +
      (d.bank.taxFromGross
        ? ` ${fmt(d.bank.phantomIncome)} of that is phantom income: winnings you can't offset because only ${(GAMBLING_LOSS_DEDUCTIBLE * 100).toFixed(0)}% of losses are deductible from 2026.`
        : ` That's based on net profit — enter your gross won and lost figures, because the real taxable number is usually higher.`));
  }
  const highApr = (s.debts || []).filter((x) => num(x.apr) > 7);
  if (s.modules.debt && highApr.length > 0) {
    push("bad", "High-interest debt outranks investing",
      `${highApr.map((x) => x.name).join(", ")} above 7% APR. Paying that down is a guaranteed return you won't beat in a brokerage.`);
  }
  const phaseout = ROTH_IRA_PHASEOUT_2026[s.profile.filingStatus] || ROTH_IRA_PHASEOUT_2026.single;
  const annualIncome = d.grossMonthly * 12;
  if (annualIncome > phaseout[0]) {
    push("info", "Roth IRA income phase-out range",
      `At about ${fmt0(annualIncome)} you're near the ${fmt0(phaseout[0])}–${fmt0(phaseout[1])} phase-out for direct Roth IRA contributions.`);
  }
  return out;
};

/**
 * Whether a capped account will actually reach its limit this year.
 *
 * Annualising the monthly rate and comparing to the cap is the obvious test
 * and it's wrong twice over: someone who started contributing in August looks
 * hopelessly behind when their monthly rate is fine for the room that's left,
 * and someone who front-loaded the whole limit in January looks behind while
 * already being done.
 *
 * What matters is where you land: what's in, plus what's still coming.
 */
const contributionPace = (ytd, monthly, cap, d = new Date()) => {
  const soFar = num(ytd);
  const monthsLeft = Math.max(0, 12 - monthsElapsedThisYear(d));
  const projected = soFar + num(monthly) * monthsLeft;
  const room = Math.max(0, num(cap) - soFar);
  // What you'd need per month from here to finish the year at the cap.
  const needMonthly = monthsLeft > 0.05 ? room / monthsLeft : 0;
  return {
    ytd: soFar, monthsLeft, projected, room, needMonthly,
    maxed: soFar >= num(cap) - 0.5,
    onTrack: projected >= num(cap) * 0.98,
    shortBy: Math.max(0, num(cap) - projected),
  };
};

/** The roadmap. Order is deliberate — each step is worth more than the next. */
const buildRoadmap = (s, d) => {
  const highApr = (s.debts || []).filter((x) => num(x.apr) > 7);
  const totalHighApr = highApr.reduce((sum, x) => sum + num(x.balance), 0);
  const monthsCovered = d.essentialMonthly > 0 ? d.emergencyBalance / d.essentialMonthly : 0;
  const rothB = s.buckets.find((b) => !b.archived && /roth ira/i.test(b.name));

  return [
    {
      key: "car_buyout", icon: IconCar, title: "Buy the car",
      done: s.car.owned || num(s.car.saved) >= num(s.car.buyoutPrice),
      progress: num(s.car.buyoutPrice) > 0 ? clamp(num(s.car.saved) / num(s.car.buyoutPrice), 0, 1) : 1,
      detail: s.car.owned
        ? "Owned outright. The fund switches to maintenance and replacement."
        : `${fmt(s.car.saved)} of ${fmt(s.car.buyoutPrice)} set aside.`,
      why: "Owning the car outright removes a payment before you take on rent.",
    },
    {
      key: "starter_ef", icon: IconShield, title: `${fmt0(s.emergency.starterTarget)} starter buffer`,
      done: d.emergencyBalance >= num(s.emergency.starterTarget),
      progress: clamp(d.emergencyBalance / Math.max(1, num(s.emergency.starterTarget)), 0, 1),
      detail: `${fmt(d.emergencyBalance)} saved.`,
      why: "Enough to absorb a tire, a deductible, or a vet bill without borrowing.",
    },
    {
      key: "match", icon: IconGift, title: "Capture the full employer match",
      done: d.match.fullyCaptured,
      progress: d.match.maxMatch > 0 ? clamp(d.match.match / d.match.maxMatch, 0, 1) : 1,
      detail: d.match.fullyCaptured
        ? `Full ${fmt(toAnnual(d.match.maxMatch, d.cadence))}/yr captured.`
        : `Contribute ${d.match.needPct.toFixed(1)}% more to collect ${fmt(toAnnual(d.match.missing, d.cadence))}/yr.`,
      why: "An immediate 100% return. Nothing else on this list competes with it.",
    },
    {
      key: "high_interest", icon: IconWarning, title: "Kill debt above 7%",
      done: !s.modules.debt || totalHighApr === 0,
      progress: totalHighApr === 0 ? 1 : 0,
      detail: totalHighApr === 0 ? "None." : `${fmt(totalHighApr)} across ${highApr.length} account${highApr.length > 1 ? "s" : ""}.`,
      why: "A guaranteed, tax-free return equal to the interest rate.",
      warn: totalHighApr > 0 && d.deferralPct > (s.match.tiers[0]?.uptoPctOfPay || 4)
        ? "You're investing past the match while carrying high-interest debt. Mathematically that's backwards — but it's your call."
        : null,
    },
    {
      key: "full_ef", icon: IconShield, title: `${s.emergency.months}-month emergency fund`,
      done: d.emergencyBalance >= d.emergencyTarget && d.emergencyTarget > 0,
      progress: d.emergencyTarget > 0 ? clamp(d.emergencyBalance / d.emergencyTarget, 0, 1) : 0,
      detail: `${monthsCovered.toFixed(1)} of ${s.emergency.months} months covered (${fmt(d.emergencyTarget)} target).`,
      why: "Six months rather than three, because betting and side income swing and you're now on a lease.",
    },
    {
      key: "max_roth_ira", icon: IconPiggy, title: `Max the Roth IRA (${fmt0(s.limits.rothIra)})`,
      done: d.rothIraYtd >= num(s.limits.rothIra) * 0.98,
      progress: clamp(d.rothIraYtd / Math.max(1, num(s.limits.rothIra)), 0, 1),
      detail: (() => {
        const pace = contributionPace(d.rothIraYtd, rothB ? rothB.amountMonthly : 0, s.limits.rothIra);
        if (pace.maxed) return `${fmt(d.rothIraYtd)} in — done for the year.`;
        if (!rothB || num(rothB.amountMonthly) <= 0) return `${fmt(d.rothIraYtd)} in, nothing scheduled monthly.`;
        // Projects from what's already in, so a mid-year start isn't "behind".
        return pace.onTrack
          ? `${fmt(d.rothIraYtd)} in, and ${fmt(rothB.amountMonthly)}/mo gets you to the cap by December.`
          : `${fmt(d.rothIraYtd)} in. At ${fmt(rothB.amountMonthly)}/mo you'd finish at ${fmt0(pace.projected)}; ${fmt0(pace.needMonthly)}/mo would max it.`;
      })(),
      why: "Use-it-or-lose-it room each year, and it grows tax-free forever.",
    },
    {
      key: "max_401k", icon: IconTrending, title: `Max the 401(k) (${fmt0(s.limits.employee401k)})`,
      done: (num(s.ytd.trad401k) + num(s.ytd.roth401k)) >= num(s.limits.employee401k) * 0.98,
      progress: clamp((num(s.ytd.trad401k) + num(s.ytd.roth401k)) / Math.max(1, num(s.limits.employee401k)), 0, 1),
      detail: `${fmt(num(s.ytd.trad401k) + num(s.ytd.roth401k))} of ${fmt(s.limits.employee401k)}. Traditional and Roth share this limit.`,
      why: "The next-best tax shelter once the IRA is full.",
    },
    {
      key: "taxable", icon: IconChart, title: "Invest beyond tax-advantaged",
      done: d.brokerageBalance > 0,
      progress: d.brokerageBalance > 0 ? 1 : 0,
      detail: d.brokerageBalance > 0 ? `${fmt(d.brokerageBalance)} in a brokerage.` : "Not started.",
      why: "No contribution limit, no withdrawal rules. Where money goes once the shelters are full.",
    },
  ];
};

// ===================== §6  TESTS =====================
// Open index.html?test=1 to run. There's no build step, so this is the test
// runner — the tax math is worth proving before any UI sits on top of it.

const runTests = () => {
  const results = [];
  const near = (a, b, tol = 0.01) => Math.abs(a - b) <= tol;
  const t = (name, fn) => {
    try {
      const msg = fn();
      results.push({ name, pass: true, msg: msg || "" });
    } catch (e) {
      results.push({ name, pass: false, msg: e.message });
    }
  };
  const eq = (actual, expected, tol = 0.01, what = "value") => {
    if (!near(actual, expected, tol)) {
      throw new Error(`${what}: expected ${expected}, got ${actual}`);
    }
    return `${what} = ${typeof actual === "number" ? actual.toFixed(4) : actual}`;
  };
  const ok = (cond, msg) => { if (!cond) throw new Error(msg); return msg; };
  // eq() is numeric; strings need their own comparator or NaN silently passes.
  const eqs = (actual, expected, what = "value") => {
    if (actual !== expected) throw new Error(`${what}: expected "${expected}", got "${actual}"`);
    return `${what} = "${actual}"`;
  };

  const profile = { stateCode: "NC", filingStatus: "single", payCadence: "biweekly",
                    localRate: 0, stateRateOverride: null, retirementBracketGuess: 0.22 };
  const taxData = { stdDeduction: STD_DEDUCTION_2026, fica: FICA_2026, year: 2026 };
  const noPre = { trad401kPct: 0, hsaPerCheck: 0, otherPerCheck: 0 };
  const noPost = { roth401kPct: 0 };

  // ---------- computePayroll ----------
  t("payroll: $2,500 biweekly, single, NC, 4% Traditional — hand-worked case", () => {
    const p = computePayroll(2500, "biweekly", profile,
      { trad401kPct: 4, hsaPerCheck: 0, otherPerCheck: 0 }, noPost, taxData);
    // gross 2500 − 401k 100 = 2400 taxable/check → 62,400/yr − 16,100 std = 46,300
    // fed: 12,400@10% + 33,900@12% = 5,308/yr = 204.15/check
    // NC:  (62,400 − 12,750) × 3.99% = 1,981.04/yr = 76.19/check
    // FICA on the full 2,500: SS 155.00 + Medicare 36.25
    eq(p.trad401k, 100, 0.01, "401k");
    eq(p.federal, 204.1538, 0.01, "federal");
    eq(p.ss, 155, 0.01, "social security");
    eq(p.medicare, 36.25, 0.01, "medicare");
    eq(p.stateTax, 76.1937, 0.01, "NC state");
    eq(p.taxTotal, 471.5975, 0.02, "total tax");
    return eq(p.netPay, 1928.4025, 0.02, "net pay");
  });

  t("payroll: Traditional 401k cuts income tax but NOT FICA", () => {
    const base = computePayroll(2500, "biweekly", profile, noPre, noPost, taxData);
    const trad = computePayroll(2500, "biweekly", profile,
      { trad401kPct: 10, hsaPerCheck: 0, otherPerCheck: 0 }, noPost, taxData);
    ok(trad.federal < base.federal, "federal should drop");
    eq(trad.ss, base.ss, 0.001, "SS unchanged");
    return eq(trad.medicare, base.medicare, 0.001, "Medicare unchanged");
  });

  t("payroll: Roth 401k reduces no tax at all", () => {
    const base = computePayroll(2500, "biweekly", profile, noPre, noPost, taxData);
    const roth = computePayroll(2500, "biweekly", profile, noPre, { roth401kPct: 10 }, taxData);
    eq(roth.federal, base.federal, 0.001, "federal unchanged");
    eq(roth.ss, base.ss, 0.001, "SS unchanged");
    eq(roth.taxTotal, base.taxTotal, 0.001, "total tax unchanged");
    // ...it just comes straight out of the paycheck.
    return eq(roth.netPay, base.netPay - 250, 0.01, "net pay down by the contribution");
  });

  t("payroll: HSA is exempt from FICA as well as income tax", () => {
    const base = computePayroll(2500, "biweekly", profile, noPre, noPost, taxData);
    const hsa = computePayroll(2500, "biweekly", profile,
      { trad401kPct: 0, hsaPerCheck: 200, otherPerCheck: 0 }, noPost, taxData);
    ok(hsa.federal < base.federal, "federal should drop");
    return eq(hsa.ss, 2300 * 0.062, 0.01, "SS on 2,300 not 2,500");
  });

  t("payroll: Social Security stops at the wage base", () => {
    const partial = computePayroll(2500, "biweekly", profile, noPre, noPost, taxData, 184000);
    eq(partial.ss, 500 * 0.062, 0.01, "only $500 of room left");
    const done = computePayroll(2500, "biweekly", profile, noPre, noPost, taxData, 184500);
    eq(done.ss, 0, 0.001, "SS after the base");
    return ok(done.medicare > 0, "Medicare keeps going — it has no cap");
  });

  t("payroll: additional Medicare 0.9% starts at $200k", () => {
    const under = computePayroll(2500, "biweekly", profile, noPre, noPost, taxData, 150000);
    eq(under.addlMedicare, 0, 0.001, "no additional Medicare under the threshold");
    const over = computePayroll(2500, "biweekly", profile, noPre, noPost, taxData, 199000);
    // Only the $1,500 above $200,000 is subject.
    return eq(over.addlMedicare, 1500 * 0.009, 0.01, "additional Medicare");
  });

  t("payroll: no-income-tax state charges no state tax", () => {
    const tx = computePayroll(2500, "biweekly", { ...profile, stateCode: "TX" }, noPre, noPost, taxData);
    return eq(tx.stateTax, 0, 0.001, "TX state tax");
  });

  t("payroll: manual state rate override wins over the table", () => {
    const p = computePayroll(2500, "biweekly",
      { ...profile, stateCode: "NC", stateRateOverride: 0.05 }, noPre, noPost, taxData);
    return eq(p.stateRate, 0.05, 0.0001, "override applied");
  });

  t("payroll: brackets are progressive, not a flat rate on everything", () => {
    const p = computePayroll(10000, "biweekly", profile, noPre, noPost, taxData);
    // 260k/yr − 16.1k std = 243.9k taxable → top slice at 32%, blended well under it.
    eq(p.fedMarginal, 0.32, 0.0001, "marginal rate");
    return ok(p.federal / p.gross < 0.32, "effective federal rate is below marginal");
  });

  // ---------- computeMatch ----------
  t("match: 100% of the first 4% — the real formula", () => {
    const full = computeMatch(2500, 4, [{ uptoPctOfPay: 4, matchPct: 100 }]);
    eq(full.match, 100, 0.01, "match at 4%");
    ok(full.fullyCaptured, "should be fully captured");
    const half = computeMatch(2500, 2, [{ uptoPctOfPay: 4, matchPct: 100 }]);
    eq(half.match, 50, 0.01, "match at 2%");
    eq(half.missing, 50, 0.01, "free money missed");
    return eq(half.needPct, 2, 0.01, "percent needed to capture it all");
  });

  t("match: over-contributing doesn't earn extra match", () => {
    const over = computeMatch(2500, 15, [{ uptoPctOfPay: 4, matchPct: 100 }]);
    return eq(over.match, 100, 0.01, "match capped at the tier");
  });

  t("match: multi-tier safe harbor (100% of 3%, then 50% of 2%)", () => {
    const m = computeMatch(2500, 5, [{ uptoPctOfPay: 3, matchPct: 100 }, { uptoPctOfPay: 5, matchPct: 50 }]);
    return eq(m.match, 75 + 25, 0.01, "tiered match");
  });

  // ---------- runWaterfall ----------
  t("waterfall: annual cap stops contributions", () => {
    const b = mkBucket({ name: "Roth IRA", fill: "fixed", amountMonthly: 1000, capAnnual: 1200, ytd: 1000 });
    const r = runWaterfall(5000, [b]);
    return eq(r.allocations[0].amount, 200, 0.01, "only the remaining cap room");
  });

  t("waterfall: a filled goal takes nothing", () => {
    const b = mkBucket({ fill: "fillToTarget", amountMonthly: 500, target: 5000, balance: 5000 });
    const r = runWaterfall(5000, [b]);
    eq(r.allocations[0].amount, 0, 0.01, "at target");
    return eq(r.leftover, 5000, 0.01, "everything flows past it");
  });

  t("waterfall: overflow cascades to the next bucket", () => {
    const a = mkBucket({ name: "A", fill: "fillToTarget", amountMonthly: 500, target: 100, balance: 0 });
    const b = mkBucket({ name: "B", fill: "fixed", amountMonthly: 400 });
    const r = runWaterfall(1000, [a, b]);
    eq(r.allocations[0].amount, 100, 0.01, "A capped at its target");
    eq(r.allocations[1].amount, 400, 0.01, "B fully funded from the overflow");
    return eq(r.leftover, 500, 0.01, "leftover");
  });

  t("waterfall: remainder absorbs the rest", () => {
    const a = mkBucket({ name: "A", fill: "fixed", amountMonthly: 300 });
    const b = mkBucket({ name: "B", fill: "remainder" });
    const r = runWaterfall(1000, [a, b]);
    eq(r.allocations[1].amount, 700, 0.01, "remainder bucket");
    return eq(r.leftover, 0, 0.01, "nothing left over");
  });

  t("waterfall: money is conserved", () => {
    const bs = [
      mkBucket({ fill: "fixed", amountMonthly: 300 }),
      mkBucket({ fill: "pctOfNet", amountMonthly: 10 }),
      mkBucket({ fill: "fillToTarget", amountMonthly: 200, target: 1000, balance: 400 }),
    ];
    const r = runWaterfall(2000, bs);
    return eq(r.totalAllocated + r.leftover, 2000, 0.01, "allocated + leftover");
  });

  t("waterfall: shortfall is reported, never overdrawn", () => {
    const bs = [mkBucket({ name: "Rent", fill: "fixed", amountMonthly: 1500 })];
    const r = runWaterfall(1000, bs);
    eq(r.allocations[0].amount, 1000, 0.01, "capped at what's available");
    eq(r.unfunded.length, 1, 0.001, "one unfunded bucket");
    eq(r.unfunded[0].short, 500, 0.01, "shortfall");
    return eq(r.leftover, 0, 0.01, "no phantom leftover");
  });

  t("waterfall: flags buckets starved below a remainder bucket", () => {
    const bs = [
      mkBucket({ name: "Rent", fill: "fixed", amountMonthly: 300 }),
      mkBucket({ name: "Fun", fill: "remainder" }),
      mkBucket({ name: "Roth IRA", fill: "fixed", amountMonthly: 400 }),
    ];
    const r = runWaterfall(2000, bs);
    eq(r.allocations[2].amount, 0, 0.01, "starved bucket gets nothing");
    return ok(r.starvedByRemainder.includes("Roth IRA"), "and it's called out");
  });

  t("waterfall: pctOfNet scales off take-home, not off what's left", () => {
    const bs = [
      mkBucket({ name: "A", fill: "fixed", amountMonthly: 500 }),
      mkBucket({ name: "B", fill: "pctOfNet", amountMonthly: 10 }),

    eq(alloc.want, num(s.limits.rothIra) - 4000, 0.01, "capped at the real room, not the full limit");

  t("ytd: the 401(k) figure splits across Traditional and Roth by how you contribute", () => {
    // One number is enough at intake — both flavours share one limit — but it
    // has to land somewhere, and the current split is the honest guess.
    const split = (total, tradPct, rothPct) => {
      const tot = tradPct + rothPct;
      const share = tot > 0 ? tradPct / tot : 1;
      return { trad: Math.round(total * share * 100) / 100,
               roth: Math.round(total * (1 - share) * 100) / 100 };
    };
    const all = split(6000, 4, 0);
    eq(all.trad, 6000, 0.01, "all Traditional when that's all you do");
    const half = split(6000, 2, 2);
    eq(half.trad, 3000, 0.01, "half each");
    eq(half.trad + half.roth, 6000, 0.01, "and the total is preserved");
    const none = split(6000, 0, 0);
    return eq(none.trad, 6000, 0.01, "contributing nothing yet defaults to Traditional");

    eqs(quarterKey(new Date(2026, 8, 30)), "2026-Q3", "September is Q3");
    eqs(quarterKey(new Date(2026, 11, 1)), "2026-Q4", "December is Q4");
    return eqs(nextQuarterKey("2026-Q4"), "2027-Q1", "Q4 rolls into next year");
  });

  t("spend categories: guessed sensibly from a budget category's name", () => {
    eqs(guessSpendCategory("Groceries"), "groceries", "groceries");
    eqs(guessSpendCategory("Gas"), "gas", "gas");
    eqs(guessSpendCategory("Eating out"), "dining", "dining");
    eqs(guessSpendCategory("Rent"), "utilities", "rent is a bill");
    return eqs(guessSpendCategory("Something odd"), "other", "fallback");
  });

  t("migrate: a v4 single card becomes the first of the cards array", () => {
    const v4 = defaultState();
    v4.schemaVersion = 4;
    delete v4.cards; delete v4.cardsEnabled;
    v4.card = { enabled: true, name: "Old card", statementBalance: 612, dueDay: 9, creditLimit: 4000 };
    const s = migrate(v4);
    eq(s.schemaVersion, SCHEMA_VERSION, 0.001, "upgraded to the current schema");
    ok(Array.isArray(s.cards) && s.cards.length >= 1, "cards array exists");
    eqs(s.cards[0].name, "Old card", "name carried over");
    eq(s.cards[0].statementBalance, 612, 0.01, "balance carried over");
    eq(s.cards[0].dueDay, 9, 0.001, "due day carried over");
    ok(s.card === undefined, "the old single card field is gone");
    const gro = s.buckets.find((b) => /grocer/i.test(b.name));
    return eqs(gro.spendCategory, "groceries", "buckets tagged with a spend category");
  });

  // ---------- v4: bills ----------
  t("bills: due dates sort by what's next", () => {
    const buckets = [
      mkBucket({ name: "Rent", dueDay: 1, amountMonthly: 1200 }),
      mkBucket({ name: "Phone", dueDay: 20, amountMonthly: 45 }),
      mkBucket({ name: "Groceries", dueDay: null, amountMonthly: 400 }),
    ];
    const bills = upcomingBills(buckets, new Date(2026, 7, 15));
    eq(bills.length, 2, 0.001, "only dated bills appear");
    eq(bills[0].bucket.name === "Phone" ? 1 : 0, 1, 0.001, "phone (20th) before rent (1st of next)");
    return ok(bills[0].days < bills[1].days, "sorted by soonest");
  });

  t("bills: a due day past the end of a short month clamps", () => {
    const buckets = [mkBucket({ name: "Odd", dueDay: 31, amountMonthly: 50 })];
    const bills = upcomingBills(buckets, new Date(2026, 8, 15));   // September has 30 days
    return eq(bills[0].date.getDate(), 30, 0.001, "clamped to the 30th");
  });

  t("paydays: lands the right number of biweekly checks in a window", () => {
    const days = paydaysBetween("2026-08-14", "biweekly", new Date(2026, 7, 1), new Date(2026, 8, 30));
    ok(days.length >= 3, "at least three paydays in ~7 weeks");
    return ok(days.every((d, i) => i === 0 || (d - days[i - 1]) === 14 * 86400000), "exactly 14 days apart");
  });

  // ---------- v4: net worth history ----------
  t("net worth series: live month replaces a stale snapshot", () => {
    const hist = [{ month: "2026-06", total: 10000 }, { month: "2026-07", total: 12000 }, { month: "2026-08", total: 999 }];
    const series = netWorthSeries(hist, 15500, "2026-08");
    eq(series.length, 3, 0.001, "no duplicate month");
    eq(series[2].total, 15500, 0.01, "live value wins over the snapshot");
    return ok(series[0].month < series[1].month, "sorted oldest first");
  });

  // ---------- v4: migration ----------
  t("migrate: v3 upgrades to the current schema without losing anything", () => {
    const v3 = defaultState();
    v3.schemaVersion = 3;
    v3.income.w2.grossPerCheck = 2750;
    v3.accounts.checking = 900;
    delete v3.card; delete v3.netWorthHistory;
    v3.buckets = v3.buckets.map(({ dueDay, rollover, carried, ...rest }) => rest);
    const s = migrate(v3);
    eq(s.schemaVersion, SCHEMA_VERSION, 0.001, "upgraded to the current schema");
    eq(s.income.w2.grossPerCheck, 2750, 0.01, "income preserved");
    eq(s.accounts.checking, 900, 0.01, "balances preserved");
    ok(Array.isArray(s.cards) && s.cards.length > 0, "cards array added");
    ok(Array.isArray(s.netWorthHistory), "history array added");
    const gro = s.buckets.find((b) => /grocer/i.test(b.name));
    return ok(gro.rollover === true, "rollover switched on for variable categories");
  });

  t("rentCheck: an unaffordable apartment is called unaffordable", () => {
    const s = defaultState();
    const d = derive(s);
    const cheap = rentCheck(d.w2NetMonthly * 0.2, 0, d, s);
    const steep = rentCheck(d.w2NetMonthly * 0.5, 0, d, s);
    ok(cheap.verdict === "good", "20% of take-home is fine");
    return ok(steep.verdict === "bad", "50% of take-home is not");
  });

  return results;
};

function TestRunner() {
  const results = useMemo(() => {
    try { return runTests(); }
    catch (e) { return [{ name: "suite crashed", pass: false, msg: e.message + "\n" + e.stack }]; }
  }, []);
  const passed = results.filter((r) => r.pass).length;
  const failed = results.length - passed;

  return (
    <div className="min-h-screen p-5 max-w-2xl mx-auto" style={{ background: "var(--bg)" }}>
      <div className="mb-6">
        <h1 className="font-display text-3xl mb-1">Test suite</h1>
        <p className="text-sm" style={{ color: "var(--muted)" }}>
          {TAX_YEAR} tax data · engine only, no UI
        </p>
      </div>
      <div className="rounded-3xl p-5 mb-5 border"
           style={{ background: failed ? "rgba(251,113,133,0.08)" : "rgba(132,204,22,0.08)",
                    borderColor: failed ? "var(--bad)" : "var(--good)" }}>
        <div className="font-mono-num text-4xl font-semibold"
             style={{ color: failed ? "var(--bad)" : "var(--good)" }}>
          {passed}/{results.length}
        </div>
        <div className="text-sm mt-1" style={{ color: "var(--muted)" }}>
          {failed ? `${failed} failing` : "All assertions passed"}
        </div>
      </div>
      <div className="space-y-2">
        {results.map((r, i) => (
          <div key={i} className="rounded-2xl p-4 border"
               style={{ background: "var(--card)", borderColor: r.pass ? "var(--border)" : "var(--bad)" }}>
            <div className="flex items-start gap-3">
              <div className="mt-0.5 shrink-0" style={{ color: r.pass ? "var(--good)" : "var(--bad)" }}>
                {r.pass ? <IconCheck className="w-4 h-4" /> : <IconX className="w-4 h-4" />}
              </div>
              <div className="min-w-0 flex-1">
                <div className="text-sm font-medium">{r.name}</div>
                {r.msg && (
                  <div className="text-xs mt-1 font-mono-num whitespace-pre-wrap break-words"
                       style={{ color: r.pass ? "var(--faint)" : "var(--bad)" }}>{r.msg}</div>
                )}
              </div>
            </div>
          </div>
        ))}
      </div>
      <a href="index.html" className="block text-center mt-6 py-3 rounded-2xl text-sm font-medium"
         style={{ background: "var(--card)", border: "1px solid var(--border)", color: "var(--muted)" }}>
        ← Back to the app
      </a>
    </div>
  );
}

// ===================== §6.5  CHARTS =====================
//
// All inline SVG — no chart library, and everything is painted with CSS
// variables so light/dark swap without a re-render. Marks are thin, grids are
// recessive, and every chart carries visible value labels: three of the light
// series steps sit below 3:1 on white, and labels are the required relief.

/** Shared: a recessive horizontal gridline set with value labels. */
const GridLines = ({ ticks, w, h, pad, fmtTick }) => (
  <g>
    {ticks.map((t, i) => (
      <g key={i}>
        <line x1={pad.l} x2={w - pad.r} y1={t.y} y2={t.y}
              stroke="var(--chart-grid)" strokeWidth="1" />
        <text x={pad.l - 6} y={t.y + 3.5} textAnchor="end"
              fill="var(--faint)" fontSize="9" className="font-mono-num">
          {fmtTick(t.v)}
        </text>
      </g>
    ))}
  </g>
);

/**
 * Net worth over time. One series, so no legend — the title names it.
 * Area fill under the line reads as accumulation; the last point is marked and
 * directly labelled rather than labelling every point.
 */
/**
 * Projected checking balance, day by day.
 *
 * The zero line is drawn whenever the projection comes near it, because the
 * whole point of this chart is the distance between the line and nothing.
 */
function ForecastChart({ forecast, height = 180 }) {
  const [hover, setHover] = useState(null);
  const w = 340, pad = { l: 44, r: 12, t: 14, b: 22 };
  const pts = (forecast?.series || []).filter((p) => isFinite(p.checking));
  if (pts.length < 2) {
    return <div className="text-xs py-8 text-center" style={{ color: "var(--faint)" }}>
      Set your pay date and a few bills, and this projects the next two months.
    </div>;
  }

  const vals = pts.map((p) => p.checking);
  const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  const span = hi - lo || 1;
  const x = (i) => pad.l + (i / (pts.length - 1)) * (w - pad.l - pad.r);
  const y = (v) => pad.t + (1 - (v - lo) / span) * (height - pad.t - pad.b);

  const line = pts.map((p, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(p.checking).toFixed(1)}`).join(" ");
  const area = `${line} L${x(pts.length - 1).toFixed(1)},${y(lo).toFixed(1)} L${x(0).toFixed(1)},${y(lo).toFixed(1)} Z`;
  const ticks = [0, 0.5, 1].map((f) => ({ v: lo + f * span, y: y(lo + f * span) }));
  const active = hover !== null ? pts[hover] : null;
  const lowIdx = pts.findIndex((p) => p.checking === forecast.low.balance);
  const under = forecast.goesNegative;

  const shortDate = (iso) => new Date(iso + "T00:00:00")
    .toLocaleDateString("en-US", { month: "short", day: "numeric" });

  return (
    <div>
      <div className="flex items-baseline gap-2 mb-1">
        <span className="num-hero text-3xl"
              style={{ color: (active ? active.checking : forecast.low.balance) < 0 ? "var(--bad)" : "var(--text)" }}>
          {fmt0(active ? active.checking : forecast.low.balance)}
        </span>
        <span className="text-[11px]" style={{ color: "var(--faint)" }}>
          {active ? shortDate(active.date) : "lowest point"}
        </span>
      </div>
      <div className="text-[11px] mb-2" style={{ color: "var(--faint)" }}>
        {active
          ? (active.events.length
              ? active.events.map((e) => `${e.label} ${fmt0(e.amount)}`).join(" · ")
              : "nothing due")
          : `${shortDate(pts[0].date)} – ${shortDate(pts[pts.length - 1].date)} · ${shortDate(forecast.low.date instanceof Date ? todayISO(forecast.low.date) : forecast.low.date)} is the trough`}
      </div>
      <svg viewBox={`0 0 ${w} ${height}`} width="100%" height={height} role="img"
           aria-label={`Projected checking balance over the next ${forecast.days} days, lowest ${fmt0(forecast.low.balance)}`}
           onMouseLeave={() => setHover(null)}>
        <defs>
          <linearGradient id="fcFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={under ? "var(--s3)" : "var(--s2)"} stopOpacity="0.22" />
            <stop offset="100%" stopColor={under ? "var(--s3)" : "var(--s2)"} stopOpacity="0" />
          </linearGradient>
        </defs>
        <GridLines ticks={ticks} w={w} h={height} pad={pad} fmtTick={fmtShort} />
        {lo < 0 && (
          <line x1={pad.l} x2={w - pad.r} y1={y(0)} y2={y(0)}
                stroke="var(--bad)" strokeWidth="1" strokeDasharray="3 3" opacity="0.7" />
        )}
        <path d={area} fill="url(#fcFill)" />
        <path d={line} fill="none" stroke={under ? "var(--s3)" : "var(--s2)"} strokeWidth="2"
              strokeLinecap="round" strokeLinejoin="round" />
        {lowIdx >= 0 && (
          <circle cx={x(lowIdx)} cy={y(pts[lowIdx].checking)} r="4.5"
                  fill={under ? "var(--s3)" : "var(--s2)"} stroke="var(--card)" strokeWidth="2" />
        )}
        {active && (
          <>
            <line x1={x(hover)} x2={x(hover)} y1={pad.t} y2={height - pad.b}
                  stroke="var(--border-hi)" strokeWidth="1" />
            <circle cx={x(hover)} cy={y(active.checking)} r="4.5"
                    fill={under ? "var(--s3)" : "var(--s2)"} stroke="var(--card)" strokeWidth="2" />
          </>
        )}
        {pts.map((p, i) => (
          <rect key={i} x={x(i) - 3} y={0} width="6" height={height} fill="transparent"
                onMouseEnter={() => setHover(i)} onTouchStart={() => setHover(i)} />
        ))}
      </svg>
    </div>
  );
}

/** A category's month-by-month actuals, with its budget as a reference line. */
function TrendChart({ trend, budget, height = 90, slot = 0 }) {
  const pts = (trend || []).filter((p) => p.value !== null);
  if (pts.length < 2) {
    return <div className="text-[11px] py-4 text-center" style={{ color: "var(--faint)" }}>
      One month logged. A second and this becomes a trend.
    </div>;
  }
  const w = 320, pad = { l: 4, r: 4, t: 10, b: 16 };
  const hi = Math.max(num(budget), ...pts.map((p) => p.value)) || 1;
  const bw = (w - pad.l - pad.r) / trend.length;
  const y = (v) => pad.t + (1 - v / hi) * (height - pad.t - pad.b);

  return (
    <svg viewBox={`0 0 ${w} ${height}`} width="100%" height={height} role="img"
         aria-label="Spending by month for this category">
      {num(budget) > 0 && (
        <line x1={pad.l} x2={w - pad.r} y1={y(budget)} y2={y(budget)}
              stroke="var(--border-hi)" strokeWidth="1" strokeDasharray="3 3" />
      )}
      {trend.map((p, i) => {
        if (p.value === null) return null;
        const h = Math.max(2, height - pad.b - y(p.value));
        const over = num(budget) > 0 && p.value > num(budget);
        return (
          <g key={p.month}>
            {/* 2px gap between bars, per the surface-gap rule */}
            <rect x={pad.l + i * bw + 1} y={y(p.value)} width={Math.max(2, bw - 2)} height={h}
                  rx="3" fill={over ? "var(--s3)" : `var(--s${(slot % SERIES_SLOTS) + 1})`} />
          </g>
        );
      })}
      {trend.map((p, i) => (
        <text key={p.month} x={pad.l + i * bw + bw / 2} y={height - 4} textAnchor="middle"
              fontSize="8" fill="var(--faint)">{monthShort(p.month).slice(0, 3)}</text>
      ))}
    </svg>
  );
}

function NetWorthChart({ series, height = 170 }) {
  const [hover, setHover] = useState(null);
  const w = 340, pad = { l: 42, r: 12, t: 14, b: 20 };
  const pts = (series || []).filter((p) => isFinite(p.total));
  if (pts.length < 2) {
    return (
      <div className="text-xs py-8 text-center" style={{ color: "var(--faint)" }}>
        Two months of history and this becomes a chart.<br />
        <span style={{ color: "var(--muted)" }}>A snapshot is saved each time you add a paycheck.</span>
      </div>
    );
  }

  const vals = pts.map((p) => p.total);
  const lo = Math.min(0, ...vals), hi = Math.max(...vals);
  const span = hi - lo || 1;
  const x = (i) => pad.l + (i / (pts.length - 1)) * (w - pad.l - pad.r);
  const y = (v) => pad.t + (1 - (v - lo) / span) * (height - pad.t - pad.b);

  const line = pts.map((p, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(p.total).toFixed(1)}`).join(" ");
  const area = `${line} L${x(pts.length - 1).toFixed(1)},${y(lo).toFixed(1)} L${x(0).toFixed(1)},${y(lo).toFixed(1)} Z`;

  const ticks = [0, 0.5, 1].map((f) => ({ v: lo + f * span, y: y(lo + f * span) }));
  const last = pts[pts.length - 1];
  const first = pts[0];
  const change = last.total - first.total;
  const active = hover !== null ? pts[hover] : null;

  return (
    <div>
      <div className="flex items-baseline gap-2 mb-1">
        <span className="num-hero text-3xl">{fmt0(active ? active.total : last.total)}</span>
        {change !== 0 && (
          <span className="font-mono-num text-xs" style={{ color: change >= 0 ? "var(--good)" : "var(--bad)" }}>
            {change >= 0 ? "↑" : "↓"} {fmtShort(Math.abs(change))}
          </span>
        )}
      </div>
      <div className="text-[11px] mb-2" style={{ color: "var(--faint)" }}>
        {active ? monthLabel(active.month) : `${monthShort(first.month)} – ${monthShort(last.month)}`}
      </div>
      <svg viewBox={`0 0 ${w} ${height}`} width="100%" height={height} role="img"
           aria-label={`Net worth from ${monthLabel(first.month)} to ${monthLabel(last.month)}`}
           onMouseLeave={() => setHover(null)}>
        <defs>
          <linearGradient id="nwFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="var(--s1)" stopOpacity="0.22" />
            <stop offset="100%" stopColor="var(--s1)" stopOpacity="0" />
          </linearGradient>
        </defs>
        <GridLines ticks={ticks} w={w} h={height} pad={pad} fmtTick={fmtShort} />
        <path d={area} fill="url(#nwFill)" />
        <path d={line} fill="none" stroke="var(--s1)" strokeWidth="2"
              strokeLinecap="round" strokeLinejoin="round" />
        {active && (
          <line x1={x(hover)} x2={x(hover)} y1={pad.t} y2={height - pad.b}
                stroke="var(--border-hi)" strokeWidth="1" />
        )}
        {/* 2px surface ring so the marker reads on top of the line */}
        <circle cx={x(pts.length - 1)} cy={y(last.total)} r="4.5"
                fill="var(--s1)" stroke="var(--card)" strokeWidth="2" />
        {active && (
          <circle cx={x(hover)} cy={y(active.total)} r="4.5"
                  fill="var(--s1)" stroke="var(--card)" strokeWidth="2" />
        )}
        {/* hit targets, wider than the marks */}
        {pts.map((p, i) => (
          <rect key={i} x={x(i) - 14} y={0} width="28" height={height} fill="transparent"
                onMouseEnter={() => setHover(i)} onTouchStart={() => setHover(i)} />
        ))}
        {pts.map((p, i) => (
          (i === 0 || i === pts.length - 1) && (
            <text key={`t${i}`} x={x(i)} y={height - 6}
                  textAnchor={i === 0 ? "start" : "end"}
                  fill="var(--faint)" fontSize="9">{monthShort(p.month)}</text>
          )
        ))}
      </svg>
    </div>
  );
}

/**
 * Spending by category. Donut with the total in the middle; every slice is
 * direct-labelled in the legend with its value, which is also the contrast
 * relief for the lighter series steps.
 */
function CategoryDonut({ rows, total, size = 180 }) {
  const [active, setActive] = useState(null);
  const data = (rows || []).filter((r) => r.value > 0).sort((a, b) => b.value - a.value);
  const sum = total ?? data.reduce((s, r) => s + r.value, 0);
  if (!data.length || sum <= 0) {
    return <EmptyState icon={IconChart} title="Nothing logged yet"
      body="Enter what you actually spent and this fills in." />;
  }

  // Past eight categories, the rest folds into "Other" rather than inventing
  // a ninth hue — a generated colour would break the validated palette.
  const shown = data.slice(0, SERIES_SLOTS);
  const rest = data.slice(SERIES_SLOTS);
  const segs = rest.length
    ? [...shown, { name: "Other", value: rest.reduce((s, r) => s + r.value, 0), slot: null, count: rest.length }]
    : shown;

  const R = size / 2, stroke = 26, r = R - stroke / 2 - 2;
  const circ = 2 * Math.PI * r;
  let acc = 0;
  const arcs = segs.map((sgm, i) => {
    const frac = sgm.value / sum;
    const a = { ...sgm, frac, offset: acc, len: frac * circ, i };
    acc += frac;
    return a;
  });
  const cur = active !== null ? arcs[active] : null;

  return (
    <div>
      <div className="flex justify-center mb-4">
        <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size} role="img"
             aria-label="Spending by category">
          <g transform={`rotate(-90 ${R} ${R})`}>
            {arcs.map((a) => (
              <circle key={a.i} cx={R} cy={R} r={r} fill="none"
                      stroke={a.slot === null ? "var(--faint)" : slotVar(a.slot)}
                      strokeWidth={active === a.i ? stroke + 4 : stroke}
                      strokeDasharray={`${Math.max(0, a.len - 2)} ${circ - Math.max(0, a.len - 2)}`}
                      strokeDashoffset={-a.offset * circ}
                      style={{ transition: "stroke-width .15s var(--ease)" }}
                      onMouseEnter={() => setActive(a.i)} onMouseLeave={() => setActive(null)}
                      onTouchStart={() => setActive(a.i)} />
            ))}
          </g>
          <text x={R} y={R - 4} textAnchor="middle" className="font-mono-num"
                fill="var(--text)" fontSize="20" fontWeight="600">
            {fmtShort(cur ? cur.value : sum)}
          </text>
          <text x={R} y={R + 14} textAnchor="middle" fill="var(--faint)" fontSize="10">
            {cur ? cur.name : "total"}
          </text>
        </svg>
      </div>
      <div className="space-y-1.5">
        {arcs.map((a) => (
          <div key={a.i} className="flex items-center justify-between gap-2"
               onMouseEnter={() => setActive(a.i)} onMouseLeave={() => setActive(null)}>
            <div className="flex items-center gap-2 min-w-0">
              <span className="w-2.5 h-2.5 rounded-full shrink-0"
                    style={{ background: a.slot === null ? "var(--faint)" : slotVar(a.slot) }} />
              <span className="text-xs truncate" style={{ color: "var(--muted)" }}>
                {a.name}{a.count ? ` (${a.count})` : ""}
              </span>
            </div>
            <div className="flex items-baseline gap-2 shrink-0">
              <span className="font-mono-num text-xs">{fmt0(a.value)}</span>
              <span className="font-mono-num text-[10px] w-8 text-right" style={{ color: "var(--faint)" }}>
                {(a.frac * 100).toFixed(0)}%
              </span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/**
 * Budget vs actual. The bar means "how did this category do", so it wears
 * STATUS colour (over / under), never a series hue — reusing a series colour
 * for good-vs-bad would make a category look like a state.
 */
function BudgetBars({ rows, showAll }) {
  const data = (rows || []).filter((r) => r.budget > 0 || r.actual > 0);
  if (!data.length) return <EmptyState icon={IconChart} title="No categories to compare yet" />;
  const max = Math.max(...data.map((r) => Math.max(r.budget, r.actual)), 1);
  const list = showAll ? data : data.slice(0, 8);

  return (
    <div className="space-y-3">
      {list.map((r) => {
        const over = r.actual > r.budget + 0.5;
        const logged = r.actual !== null && r.actual !== undefined;
        return (
          <div key={r.id}>
            <div className="flex items-baseline justify-between mb-1 gap-2">
              <span className="text-xs truncate" style={{ color: "var(--muted)" }}>{r.name}</span>
              <span className="font-mono-num text-xs shrink-0">
                {logged ? fmt0(r.actual) : "—"}
                <span style={{ color: "var(--faint)" }}> / {fmt0(r.budget)}</span>
              </span>
            </div>
            <div className="relative rounded-full overflow-hidden" style={{ height: 10, background: "var(--card-2)" }}>
              {/* planned: a recessive track */}
              <div className="absolute inset-y-0 left-0 rounded-full"
                   style={{ width: `${r.budget / max * 100}%`, background: "var(--border-hi)" }} />
              {/* actual: status-coloured, 2px gap keeps it off the track edge */}
              {logged && (
                <div className="absolute inset-y-0 left-0 rounded-full bar-grow"
                     style={{ width: `${Math.min(r.actual, max) / max * 100}%`,
                              background: over ? "var(--st-crit)" : "var(--st-good)" }} />
              )}
            </div>
            {logged && Math.abs(r.actual - r.budget) > 0.5 && (
              <div className="text-[10px] mt-0.5 font-mono-num"
                   style={{ color: over ? "var(--bad)" : "var(--good)" }}>
                {over ? "over by " : "under by "}{fmt0(Math.abs(r.actual - r.budget))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/**
 * Where the paycheck goes. A descending waterfall from gross to what's left —
 * each step shows what that deduction costs and what survives it.
 */
function PaycheckWaterfall({ steps, gross }) {
  if (!gross || gross <= 0) return null;
  let running = gross;
  const rows = steps.filter((s) => s.amount > 0.005).map((s) => {
    const from = running;
    running -= s.amount;
    return { ...s, from, to: running };
  });

  return (
    <div>
      <div className="flex items-baseline justify-between mb-3">
        <span className="text-xs" style={{ color: "var(--muted)" }}>Gross</span>
        <span className="num-hero text-lg">{fmt(gross)}</span>
      </div>
      <div className="space-y-2">
        {rows.map((r, i) => (
          <div key={i}>
            <div className="flex items-baseline justify-between gap-2 mb-1">
              <span className="text-xs truncate flex items-center gap-1.5" style={{ color: "var(--muted)" }}>
                <span className="w-2 h-2 rounded-full shrink-0" style={{ background: r.color }} />
                {r.label}
              </span>
              {/* Text wears text ink; the swatch beside it carries the colour.
                  Status/series hues are calibrated as MARK colours (3:1) and
                  fail AA when used for small text. */}
              <span className="font-mono-num text-xs shrink-0" style={{ color: "var(--text)" }}>
                −{fmt(r.amount)}
              </span>
            </div>
            <div className="relative rounded-full overflow-hidden" style={{ height: 8, background: "var(--card-2)" }}>
              {/* what survives this step */}
              <div className="absolute inset-y-0 left-0 rounded-full"
                   style={{ width: `${Math.max(0, r.to) / gross * 100}%`, background: "var(--border-hi)" }} />
              {/* what this step takes, sitting where it comes off */}
              <div className="absolute inset-y-0 rounded-full bar-grow"
                   style={{ left: `${Math.max(0, r.to) / gross * 100}%`,
                            width: `${r.amount / gross * 100}%`,
                            background: r.color, borderLeft: "2px solid var(--card)" }} />
            </div>
          </div>
        ))}
      </div>
      <div className="flex items-baseline justify-between mt-4 pt-3" style={{ borderTop: "1px solid var(--border)" }}>
        <span className="text-sm font-semibold">Left to you</span>
        <span className="num-hero text-lg" style={{ color: "var(--good)" }}>{fmt(Math.max(0, running))}</span>
      </div>
    </div>
  );
}

/**
 * Number input that holds a STRING while focused, so partial entry like "1."
 * or "-" survives instead of being stomped by numeric coercion. This is why
 * decimal entry doesn't fight you on mobile — don't "simplify" it.
 */
function NumInput({ value, onChange, className, style, placeholder, autoFocus, onBlur, onKeyDown }) {
  const [text, setText] = useState(String(value ?? ""));
  const [focused, setFocused] = useState(false);
  useEffect(() => { if (!focused) setText(String(value ?? "")); }, [value, focused]);

  const commit = (raw) => {
    if (raw === "" || raw === "-" || raw === "." || raw === "-.") { onChange(0); return; }
    const n = parseFloat(raw);
    onChange(isNaN(n) ? 0 : n);
  };

  return (
    <input
      type="text" inputMode="decimal"
      value={focused ? text : (value === 0 || value === "0" ? "0" : String(value ?? ""))}
      placeholder={placeholder} autoFocus={autoFocus}
      onFocus={(e) => { setFocused(true); setText(String(value ?? "")); e.target.select?.(); }}
      onChange={(e) => {
        const raw = e.target.value;
        if (/^-?\d*\.?\d*$/.test(raw)) { setText(raw); commit(raw); }
      }}
      onBlur={(e) => { setFocused(false); commit(text); if (onBlur) onBlur(e); }}
      onKeyDown={onKeyDown} className={className} style={style}
    />
  );
}

    document.body.style.overflow = "hidden";

  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center"

/** Percentage slider with a tap-to-edit dollar readout. */
function DualSlider({ label, sublabel, percent, onChange, base, color, max = 30, step = 0.5, footnote }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(0);
  const dollars = base * num(percent) / 100;
  const commitDollars = () => {
    onChange(base > 0 ? Math.round(clamp(draft / base * 100, 0, max) * 100) / 100 : 0);
    setEditing(false);
  };
  const filled = num(percent) / max * 100;

  return (
    <div className="py-2">
      <div className="flex items-center justify-between mb-2.5 gap-3">
        <div className="min-w-0">
          <div className="text-[13px] font-medium flex items-center gap-2">
            <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: color }} />
            <span className="truncate">{label}</span>
          </div>
          {sublabel && <div className="text-[11px] mt-0.5 ml-4.5" style={{ color: "var(--faint)" }}>{sublabel}</div>}
        </div>
        <div className="flex items-center gap-2 shrink-0">
          <span className="font-mono-num text-[11px] px-2 py-1 rounded-full"
                style={{ background: "var(--card-2)", color: "var(--muted)" }}>{num(percent).toFixed(1)}%</span>
          {editing ? (
            <div className="flex items-center rounded-xl px-2" style={{ background: "var(--card-2)", border: `1px solid ${color}` }}>
              <span className="text-[12px]" style={{ color: "var(--faint)" }}>$</span>
              <NumInput value={draft} onChange={setDraft} autoFocus onBlur={commitDollars}
                onKeyDown={(e) => { if (e.key === "Enter") commitDollars(); }}
                className="w-16 bg-transparent outline-none py-1.5 font-mono-num text-[14px] text-right"
                style={{ color: "var(--text)" }} />
            </div>
          ) : (
            /* The swatch beside the label already carries the series colour.
               Series hues are calibrated as mark colours and miss AA as text. */
            <button onClick={() => { setDraft(Math.round(dollars * 100) / 100); setEditing(true); }}
              className="font-mono-num text-[15px] font-semibold pressable" style={{ color: "var(--text)" }}>
              {fmt(dollars)}
            </button>
          )}
        </div>
      </div>
      <input type="range" min="0" max={max} step={step} value={num(percent)}
        onChange={(e) => onChange(parseFloat(e.target.value))} className="slider" aria-label={label}
        style={{ background: `linear-gradient(to right, ${color} 0%, ${color} ${filled}%, var(--card-2) ${filled}%, var(--card-2) 100%)` }} />
      {footnote && <div className="text-[11px] mt-2" style={{ color: "var(--faint)" }}>{footnote}</div>}
    </div>
  );
}

  { key: "today", label: "Today", icon: IconHome },
  { key: "spend", label: "Spend", icon: IconCard },
  { key: "bills", label: "Bills", icon: IconCalendar },
  { key: "grow",  label: "Grow",  icon: IconTrending },
];

function App() {
  const [state, setState] = useState(loadState);
  const [tab, setTab] = useState("today");
  const [setupOpen, setSetupOpen] = useState(false);
  const [planOpen, setPlanOpen] = useState(false);
  const [toast, setToast] = useState(null);

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
  }, [state]);

  // Keep the document theme in sync with the preference. Shares the pre-paint
  // helper so there's one implementation, not two that can drift.
  const themePref = state.profile.themeChosen ? (state.profile.theme || "dark") : "dark";
  useEffect(() => {
    window.__applyTheme?.(themePref);
    if (themePref !== "system") return;
    // In system mode, follow live OS changes so the status-bar colour keeps up
    // (the CSS media queries already handle the page itself).
    const mq = window.matchMedia("(prefers-color-scheme: light)");
