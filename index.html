<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Budget" />
<meta name="theme-color" id="tc-light" content="#0d0d0c" media="(prefers-color-scheme: light)" />
<meta name="theme-color" id="tc-dark"  content="#0d0d0c" media="(prefers-color-scheme: dark)" />
<script>
  /* Theme is applied BEFORE first paint. Doing it in React would flash the
     wrong background for a frame on every load.
     Dark is the default; "system" is opt-in from Settings. */
  window.__DEFAULT_THEME = 'dark';

  window.__applyTheme = function (pref) {
    var root = document.documentElement;
    if (pref === 'light' || pref === 'dark') root.setAttribute('data-theme', pref);
    else root.removeAttribute('data-theme');   // let the media queries decide

    var resolved = pref === 'system'
      ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      : pref;

    /* Keep the browser/status-bar colour honest. In system mode each meta keeps
       its own media-matched colour; when a theme is forced, both are pinned to
       it so whichever one the OS matches is still right. */
    var lightMeta = document.getElementById('tc-light');
    var darkMeta  = document.getElementById('tc-dark');
    if (lightMeta && darkMeta) {
      lightMeta.setAttribute('content', pref === 'system' ? '#f7f6f4' : (resolved === 'light' ? '#f7f6f4' : '#0d0d0c'));
      darkMeta.setAttribute('content',  pref === 'system' ? '#0d0d0c' : (resolved === 'light' ? '#f7f6f4' : '#0d0d0c'));
    }
    return resolved;
  };

  (function () {
    var pref = window.__DEFAULT_THEME;
    try {
      var raw = localStorage.getItem('budget_v6') || localStorage.getItem('budget_v5')
             || localStorage.getItem('budget_v4') || localStorage.getItem('budget_v3');
      if (raw) {
        var s = JSON.parse(raw);
        /* Only a DELIBERATE choice overrides the default. A stored theme with
           no themeChosen flag is just an older build's default sitting in
           localStorage — honouring it would mean the product default could
           never reach anyone who had already opened the app once. */
        if (s.profile && s.profile.themeChosen && s.profile.theme) pref = s.profile.theme;
      }
    } catch (e) {}
    window.__applyTheme(pref);
  })();
</script>

<style>
  /* ========================================================================
     DESIGN TOKENS
     Light and dark are both first-class. DARK IS THE DEFAULT: the base :root
     below carries the dark values at the lowest specificity, the media queries
     override for a light OS, and [data-theme] on <html> beats both.

     Cascade order matters here and is deliberate:
       1. :root                              (0,1,0)  dark default
       2. @media + :root:not([data-theme=x]) (0,2,0)  follows the OS
       3. :root[data-theme="light"|"dark"]   (0,2,0)  explicit, and last in
                                                      source so it wins ties

     The accent needs two values: #d4a574 is lovely on near-black but fails
     contrast on white, so light mode uses a darkened #8a5a28. Same hue, same
     identity, legible in both.
     ======================================================================== */
  :root {
    /* radii — generous, the spacious look */
    --r-sm: 12px; --r-md: 16px; --r-lg: 20px; --r-xl: 28px; --r-full: 9999px;
    /* motion */
    --ease: cubic-bezier(0.32, 0.72, 0, 1);

    /* --- dark, the default theme --- */
    color-scheme: dark;
    --bg:#0d0d0c; --bg-elev:#131312; --card:#191918; --card-2:#212120; --card-hover:#262625;
    --border:#2b2b29; --border-hi:#3a3a37; --text:#f7f7f5; --muted:#a3a09a; --faint:#8a8780;
    --accent:#d4a574; --accent-soft:rgba(212,165,116,0.14); --accent-text:#d4a574; --on-accent:#0d0d0c;
    --good:#7fc93a; --good-soft:rgba(127,201,58,0.14);
    --warn:#f0b429; --warn-soft:rgba(240,180,41,0.14);
    --bad:#fb7185;  --bad-soft:rgba(251,113,133,0.14);
    --shadow-sm:none; --shadow-md:none; --shadow-lg:0 12px 40px rgba(0,0,0,0.5);
    --chart-grid:#262624; --skeleton:#212120;
    /* Series slots. NOTE these names are colours, not a spacing scale — an
       earlier --s1..--s8 spacing scale lived here and silently collided. */
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --st-good:#0ca30c; --st-warn:#fab219; --st-serious:#ec835a; --st-crit:#d03b3b;
  }

  /* ---- dark (default when the OS says dark) ---- */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg:          #0d0d0c;
      --bg-elev:     #131312;
      --card:        #191918;
      --card-2:      #212120;
      --card-hover:  #262625;
      --border:      #2b2b29;
      --border-hi:   #3a3a37;
      --text:        #f7f7f5;
      --muted:       #a3a09a;
      /* --faint carries 10–11px labels. WCAG wants MORE contrast at small
         sizes, not less, so this is tuned to clear 4.5:1 on every surface
         it lands on (bg, card, card-2) rather than to look pleasantly dim. */
      --faint:       #8a8780;
      --accent:      #d4a574;
      --accent-soft: rgba(212,165,116,0.14);
      --accent-text: #d4a574;
      --on-accent:   #0d0d0c;
      --good:        #7fc93a;  --good-soft: rgba(127,201,58,0.14);
      --warn:        #f0b429;  --warn-soft: rgba(240,180,41,0.14);
      --bad:         #fb7185;  --bad-soft:  rgba(251,113,133,0.14);
      --shadow-sm:   none;
      --shadow-md:   none;
      --shadow-lg:   0 12px 40px rgba(0,0,0,0.5);
      --chart-grid:  #262624;
      --skeleton:    #212120;
      /* Series palette — dark steps. Validated as a set against this surface:
         lightness band, chroma floor, CVD separation and normal-vision floor
         all pass. Slot ORDER is the colorblind-safety mechanism; assign in
         sequence and never reorder or cycle. */
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
      --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
      /* Chart status — reserved meaning, never used for "series 4". */
      --st-good:#0ca30c; --st-warn:#fab219; --st-serious:#ec835a; --st-crit:#d03b3b;
    }
  }

  /* ---- light (default when the OS says light) ---- */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg:          #f7f6f4;
      --bg-elev:     #fbfbfa;
      --card:        #ffffff;
      --card-2:      #f4f3f0;
      --card-hover:  #eeece8;
      --border:      #e7e4df;
      --border-hi:   #d5d1ca;
      --text:        #1b1a18;
      /* Darkened from #6b6862, which reached only 4.34 on the tinted alert
         surfaces — and alert bodies are the text that most needs reading. */
      --muted:       #605d57;
      --faint:       #726d64;
      --accent:      #8a5a28;
      --accent-soft: rgba(138,90,40,0.10);
      --accent-text: #8a5a28;
      --on-accent:   #ffffff;
      --good:        #4d7c0f;  --good-soft: rgba(77,124,15,0.10);
      /* Darkened from #a16207: on its own soft tint at 9px (the badges) that
         only reached 4.32, just under AA. This clears it on both. */
      --warn:        #965906;  --warn-soft: rgba(161,98,7,0.10);
      --bad:         #be123c;  --bad-soft:  rgba(190,18,60,0.10);
      --shadow-sm:   0 1px 2px rgba(24,20,14,0.05);
      --shadow-md:   0 2px 8px rgba(24,20,14,0.06), 0 1px 2px rgba(24,20,14,0.04);
      --shadow-lg:   0 12px 32px rgba(24,20,14,0.12);
      --chart-grid:  #eae7e1;
      --skeleton:    #eeece8;
      /* Series palette — light steps, same eight hues as dark. Three of these
         (aqua, yellow, magenta) sit below 3:1 on white by design, so every
         chart using them ships visible value labels as the relief channel. */
      --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
      --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
      --st-good:#0ca30c; --st-warn:#fab219; --st-serious:#ec835a; --st-crit:#d03b3b;
    }
  }

  /* ---- explicit overrides: these must beat both media queries ----
     CAUTION: every token below is a SECOND declaration of one defined in the
     annotated blocks above, and these win whenever a theme is explicitly
     chosen. Change a colour in one place and not the other and the app looks
     right in System mode and wrong the moment someone picks a theme. Edit
     both, always. */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:#0d0d0c; --bg-elev:#131312; --card:#191918; --card-2:#212120; --card-hover:#262625;
    --border:#2b2b29; --border-hi:#3a3a37; --text:#f7f7f5; --muted:#a3a09a; --faint:#8a8780;
    --accent:#d4a574; --accent-soft:rgba(212,165,116,0.14); --accent-text:#d4a574; --on-accent:#0d0d0c;
    --good:#7fc93a; --good-soft:rgba(127,201,58,0.14);
    --warn:#f0b429; --warn-soft:rgba(240,180,41,0.14);
    --bad:#fb7185;  --bad-soft:rgba(251,113,133,0.14);
    --shadow-sm:none; --shadow-md:none; --shadow-lg:0 12px 40px rgba(0,0,0,0.5);
    --chart-grid:#262624; --skeleton:#212120;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --st-good:#0ca30c; --st-warn:#fab219; --st-serious:#ec835a; --st-crit:#d03b3b;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg:#f7f6f4; --bg-elev:#fbfbfa; --card:#ffffff; --card-2:#f4f3f0; --card-hover:#eeece8;
    --border:#e7e4df; --border-hi:#d5d1ca; --text:#1b1a18; --muted:#605d57; --faint:#726d64;
    --accent:#8a5a28; --accent-soft:rgba(138,90,40,0.10); --accent-text:#8a5a28; --on-accent:#ffffff;
    --good:#4d7c0f; --good-soft:rgba(77,124,15,0.10);
    --warn:#965906; --warn-soft:rgba(161,98,7,0.10);
    --bad:#be123c;  --bad-soft:rgba(190,18,60,0.10);
    --shadow-sm:0 1px 2px rgba(24,20,14,0.05);
    --shadow-md:0 2px 8px rgba(24,20,14,0.06), 0 1px 2px rgba(24,20,14,0.04);
    --shadow-lg:0 12px 32px rgba(24,20,14,0.12);
    --chart-grid:#eae7e1; --skeleton:#eeece8;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
    --st-good:#0ca30c; --st-warn:#fab219; --st-serious:#ec835a; --st-crit:#d03b3b;
  }
  /* No separate no-preference fallback: the base :root above already IS dark,
     so a browser reporting nothing simply keeps it. A :root:not([data-theme])
     rule here would tie the light media query on specificity and, sitting
     later in the source, silently beat it in System mode. */

  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body, #root {
    background: var(--bg); color: var(--text);
    min-height: 100vh; min-height: 100dvh;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    letter-spacing: -0.011em;
  }
  body {
    padding-top: env(safe-area-inset-top);
    margin: 0;
    transition: background-color .25s var(--ease), color .25s var(--ease);
  }
  .font-mono-num {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  /* Big figures should feel typeset, not just large. */
  .num-hero { font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;
              letter-spacing:-0.04em; font-weight:600; }

  input, textarea, select, button { font-family: inherit; letter-spacing: inherit; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  input::placeholder, textarea::placeholder { color: var(--faint); }

  .slider {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px; border-radius: var(--r-full);
    outline: none; cursor: pointer; touch-action: pan-y;
  }
  .slider::-webkit-slider-runnable-track { height: 6px; border-radius: var(--r-full); background: transparent; }
  .slider::-moz-range-track { height: 6px; border-radius: var(--r-full); background: transparent; }
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--card); cursor: grab;
    border: 2px solid var(--border-hi);
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    margin-top: -10px;
    transition: transform .15s var(--ease);
  }
  .slider::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.12); }
  .slider::-moz-range-thumb {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--card); cursor: grab;
    border: 2px solid var(--border-hi);
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }

  @keyframes fadeIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform:none; } }
  .animate-fade-in { animation: fadeIn .28s var(--ease) both; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .animate-slide-up { animation: slideUp .3s var(--ease); }
  @keyframes popIn { from { opacity:0; transform: scale(.96); } to { opacity:1; transform: scale(1); } }
  .animate-pop { animation: popIn .2s var(--ease) both; }
  /* Charts draw themselves in rather than appearing fully formed. */
  @keyframes drawLine { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes growBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .bar-grow { transform-origin: left center; animation: growBar .5s var(--ease) both; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: var(--r-full); }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* Bottom tab bar sits above the home indicator. */
  .tabbar { padding-bottom: max(env(safe-area-inset-bottom), 10px); }
  .pressable { transition: transform .12s var(--ease), background-color .15s var(--ease); }
  .pressable:active { transform: scale(0.975); }
</style>
</head>
<body>
<div id="root">
  <div id="boot-fallback" style="padding:24px;font-family:system-ui,sans-serif;color:#a8a29e;font-size:13px;line-height:1.6;">
    Loading… if this message doesn't go away in a few seconds, something failed to load (check your connection) — tap and hold to reload, or view the error below.
  </div>
</div>
<script>
  window.addEventListener('error', function (e) {
    var root = document.getElementById('root');
    if (root && document.getElementById('boot-fallback')) {
      root.innerHTML = '<div style="padding:24px;font-family:ui-monospace,monospace;color:#fb7185;font-size:12px;white-space:pre-wrap;">App failed to load:\n\n' +
        (e.message || 'Unknown error') + (e.filename ? ('\n\nFile: ' + e.filename + (e.lineno ? (':' + e.lineno) : '')) : '') +
        '\n\nThis usually means a CDN script (React/Babel/Tailwind) failed to load or changed. Try reloading, or check your connection.</div>';
    }
  });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>

<!--
  ============================================================================
  BUDGET — single-file React app, no build step.
  ============================================================================
  Sections, in order:

    §1  ICONS            inline SVG
    §2  CONSTANTS        2026 tax data, contribution limits, state rates,
                         cadence table, palette, bucket presets
    §3  HELPERS          formatting, cadence math, dates, deepMerge
    §4  SCHEMA           default state, migrate v2->v3, load/save
    §5  ENGINE           computePayroll, runWaterfall, carOwnershipCost,
                         tradVsRoth, recommendations, roadmap
    §6  TESTS            ?test=1 assertion suite
    §7  PRIMITIVES       NumInput, DualSlider, Modal, Card, ...
    §8  APP              root state, header, tab bar
    §9  HOME tab
    §10 PAYCHECK tab
    §11 BUDGET tab
    §12 GOALS tab
    §13 INVEST tab
    §14 SETUP
    §15 WIZARD           first-run setup
    §16 RENDER

  Tax figures live in §2 in one block marked VERIFY EACH JANUARY. Everything
  there is also editable at runtime in Setup, so an IRS change never requires
  a code edit.
  ============================================================================
-->

/**
 * Whether a figure has actually been entered.

 * Zero and "you never told me" are different facts and the app used to
 * conflate them: with no checking balance on file it reported "free to spend
 * −$782" and raised two alerts about a shortfall, all derived from a blank
 * field. A budgeting app that invents a crisis is worse than one that asks.
 */
const isSet = (v) => v !== null && v !== undefined && v !== "";
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
/**
 * Strictly increasing numeric id.
 *
 * The previous version was `Date.now() * 1000 + random(0..999)`. Every bucket
 * in a fresh state is created inside the same millisecond, so uniqueness rested
 * entirely on 1000 random values — with 13 default buckets that's about a 7.5%
 * chance of a collision per state creation (birthday problem). Two categories
 * sharing an id silently share their logged spending, rollover and paycheck
 * allocations, because everything is keyed by id.
 *
 * A monotonic counter removes the guesswork: ids stay numeric and roughly
 * timestamp-ordered, but can never repeat within a session, and a new session
 * starts far ahead of anything already persisted.
 */
let __lastUid = 0;
const uid = () => {
  __lastUid = Math.max(Date.now() * 1000, __lastUid + 1);
  return __lastUid;
};

// Cadence conversion — the single source of truth for timeframe math.
const toAnnual  = (amt, cadence) => num(amt) * (PER_YEAR[cadence] || 12);

const fromMonthly = (monthlyAmt, cadence) => num(monthlyAmt) * 12 / (PER_YEAR[cadence] || 12);

const quarterKey = (d = new Date()) => `${d.getFullYear()}-Q${Math.floor(d.getMonth() / 3) + 1}`;
const quarterLabel = (qk) => {
  const [y, q] = String(qk).split("-Q");
  const names = { 1: "Jan–Mar", 2: "Apr–Jun", 3: "Jul–Sep", 4: "Oct–Dec" };
  return `Q${q} ${y} · ${names[q] || ""}`;
};
const nextQuarterKey = (qk) => {
  const [y, q] = String(qk).split("-Q").map(Number);
  return q >= 4 ? `${y + 1}-Q1` : `${y}-Q${q + 1}`;
};
/** Days until the current quarter ends — drives the "use it or lose it" nudge. */
const daysLeftInQuarter = (d = new Date()) => {
  const endMonth = (Math.floor(d.getMonth() / 3) + 1) * 3;   // 3, 6, 9 or 12
  const end = new Date(d.getFullYear(), endMonth, 0);         // last day of it
  return Math.max(0, Math.round((end - d) / 86400000));
};

  const start = new Date(d.getFullYear(), 0, 1);
  const end = new Date(d.getFullYear() + 1, 0, 1);
  return Math.max(0.5, ((d - start) / (end - start)) * 12);
};

/** Local calendar date as ISO. Not toISOString(), which shifts to UTC and can
 *  file an evening transaction under tomorrow. */
const todayISO = (d = new Date()) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const monthLabel = (key) => {
  const [y, m] = String(key).split("-").map(Number);
  if (!y || !m) return key;
  return new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
};
const monthShort = (key) => {
  const [y, m] = String(key).split("-").map(Number);
  if (!y || !m) return key;
  return new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "short" });
};
const addMonths = (key, delta) => {
  const [y, m] = String(key).split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return monthKey(d);
};
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

// Which months this year contain a 3rd paycheck (biweekly/weekly only).
const extraPaycheckMonths = (nextPayDate, cadence) => {
  if (cadence !== "biweekly" && cadence !== "weekly") return [];
  const step = cadence === "biweekly" ? 14 : 7;
  const normal = cadence === "biweekly" ? 2 : 4;
  const start = nextPayDate ? new Date(nextPayDate + "T12:00:00") : new Date();
  if (isNaN(start)) return [];
  const counts = {};
  // Walk back to the start of the current month, then forward 13 months.
  const cursor = new Date(start);
  while (cursor > new Date(start.getFullYear(), start.getMonth(), 1)) cursor.setDate(cursor.getDate() - step);
  const end = new Date(start.getFullYear(), start.getMonth() + 13, 1);
  while (cursor < end) {
    const k = monthKey(cursor);
    counts[k] = (counts[k] || 0) + 1;
    cursor.setDate(cursor.getDate() + step);
  }
  return Object.keys(counts)
    .filter((k) => counts[k] > normal && k >= monthKey(start))
    .sort()
    .slice(0, 2);
};

// "September", or "March 2027" once it's a different year.
const monthNameLabel = (key) => {
  const [y, m] = String(key).split("-").map(Number);
  if (!y || !m) return key;
  const name = new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "long" });
  return y === new Date().getFullYear() ? name : `${name} ${y}`;
};

const listJoin = (arr) => arr.length <= 1 ? (arr[0] || "")
  : arr.length === 2 ? `${arr[0]} and ${arr[1]}`
  : `${arr.slice(0, -1).join(", ")} and ${arr[arr.length - 1]}`;

// Recursive merge so newly-added nested keys get defaults instead of undefined.
// (The v2 app used a shallow spread here, which silently produced undefined
// for any key added inside contributions/caps/ytd/accounts.)
const isPlainObject = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
const deepMerge = (base, override) => {
  if (!isPlainObject(base)) return override === undefined ? base : override;
  const out = { ...base };
  if (!isPlainObject(override)) return out;
  for (const k of Object.keys(override)) {
    const b = base[k], o = override[k];
    if (isPlainObject(b) && isPlainObject(o)) { out[k] = deepMerge(b, o); continue; }
    // A null/undefined override must never replace a structure. A truncated or
    // hand-edited backup with "buckets": null would otherwise wipe every
    // category. Scalars keep normal null semantics — several fields use null
    // to mean "unset" on purpose.
    if ((o === undefined || o === null) && (Array.isArray(b) || isPlainObject(b))) { out[k] = b; continue; }
    out[k] = o === undefined ? b : o;
  }
  return out;
};

const stateInfo = (code) => STATE_TAX.find((s) => s.code === code) || STATE_TAX.find((s) => s.code === "NC");


// ===================== §4  SCHEMA =====================
const STORAGE_KEY = "budget_v6";
const V5_KEY = "budget_v5";
const V4_KEY = "budget_v4";
const V3_KEY = "budget_v3";
const LEGACY_KEY = "paycheck_allocator_v2";
const SCHEMA_VERSION = 10;

/**
 * One line off a statement.
 *
 * `bucketId` null means uncategorised — surfaced for review rather than
 * silently dropped. `excluded` marks lines that must NOT count as spending:
 * a credit-card payment made from checking is the same money as the purchases
 * already on that card's statement, so counting both double-counts it.
 */
const mkTxn = (o = {}) => ({
  id: uid(),
  date: "",              // ISO yyyy-mm-dd
  description: "",       // the raw statement string
  merchant: "",          // cleaned-up name for grouping
  amount: 0,             // positive = money spent (YOUR share, if split)
  bucketId: null,
  source: "",            // which card/account it came from
  excluded: false,
  excludeReason: "",
  edited: false,         // true once you've touched it, so re-imports leave it alone
  // A guess you shouldn't trust. "low" puts it in the review list next to the
  // uncategorised ones instead of quietly counting under a wrong category.
  confidence: "high",    // "high" | "low"
  // Set when one charge was divided — either between people or across
  // categories. All parts share the group id and sum to the original charge.
  splitGroup: null,
  splitNote: "",         // e.g. "1 of 5" or "your share"
  // Money you fronted that's coming back to you. NOT spending and NOT a
  // transfer — it's a debt owed to you, which stays visible until it's either
  // paid back or written off. See `receivables` for why this needs its own
  // state rather than a silent exclusion.
  owed: false,
  owedFrom: "",          // who owes you, if you bothered to say
  // Who's on the hook. Work reimbursements behave identically to a friend's
  // Venmo — money out now, money back later — but they're worth separating
  // because an employer that hasn't paid up is a different conversation.
  owedType: "person",    // "person" | "work"
  writtenOff: false,     // they're never paying; it became your spending
  // Set on a repayment line (the Venmo landing in your account). It points at
  // the fronted charge it cancels, which is what stops a repayment from
  // looking like income.
  settlesTxnId: null,
  ...o,
});

/**
 * Divide one charge into parts.
 *
 * Two things this covers, with the same mechanism:
 *   • You fronted money for other people — their portion becomes an excluded
 *     part, so only your share counts as your spending.
 *   • One charge spans categories — a shop run that's half groceries, half
 *     household.
 *
 * Parts must sum to the original amount; anything else is a transcription
 * error rather than a split, so it's rejected.
 */
const splitTransaction = (txn, parts) => {
  const total = parts.reduce((s, p) => s + num(p.amount), 0);
  if (Math.abs(total - num(txn.amount)) > 0.02) {
    return { ok: false, error: `Parts add up to ${fmt(total)}, but the charge was ${fmt(txn.amount)}.` };
  }
  if (parts.length < 2) return { ok: false, error: "A split needs at least two parts." };
  // Without this, an oversized share sneaks through: claiming $900 of a $277
  // charge leaves a −$623 part, and the two still sum to the original.
  if (parts.some((p) => num(p.amount) <= 0)) {
    return { ok: false, error: "Every part has to be more than zero." };
  }
  const group = txn.splitGroup || txn.id;
  return {
    ok: true,
    parts: parts.map((p, i) => mkTxn({
      ...txn,
      id: uid(),
      amount: num(p.amount),
      bucketId: p.excluded ? null : (p.bucketId ?? txn.bucketId),
      excluded: !!p.excluded,
      excludeReason: p.excluded ? (p.excludeReason || "paid for someone else") : "",
      confidence: p.excluded ? "high" : (p.confidence || txn.confidence),
      // Their share isn't gone, it's owed. Held on the part itself so the
      // money has somewhere to live between leaving and coming back.
      owed: !!p.owed,
      owedFrom: p.owedFrom || "",
      owedType: p.owedType || "person",
      // A part that lands in a category is spending, so it keeps the
      // original's bucket; only the fronted part carries the debt.
      splitGroup: group,
      splitNote: p.note || `${i + 1} of ${parts.length}`,
      edited: true,
    })),
  };
};

/** Split a charge evenly between people, keeping only your share. */
const splitEvenly = (txn, ways, yourCategory, owedFrom = "") => {
  const each = Math.round((num(txn.amount) / ways) * 100) / 100;
  const others = Math.round((num(txn.amount) - each) * 100) / 100;
  return splitTransaction(txn, [
    { amount: each, bucketId: yourCategory ?? txn.bucketId, note: `your share, 1 of ${ways}` },
    { amount: others, excluded: true, owed: true, owedFrom,
      excludeReason: `covering ${ways - 1} other${ways - 1 === 1 ? "" : "s"}`,
      note: `${ways - 1} of ${ways}` },
  ]);
};

/**
 * A credit card.
 *
 * `rewards` is what makes the "which card do I use" question answerable:
 *   base        — % back on everything
 *   categories  — always-on bonus categories, e.g. 3% dining forever
 *   rotating    — the quarterly-cycling kind (Chase Freedom, Discover it).
 *                 These usually have to be ACTIVATED each quarter and are
 *                 capped on spend, so both are tracked — forgetting to
 *                 activate is the single most common way people lose this money.
 */
const mkCard = (o = {}) => ({
  id: uid(),
  name: "Credit card",
  slot: 0,
  statementBalance: 0,
  dueDay: 22,
  creditLimit: 0,
  autopay: true,

  rewards: {

    rotating: {
      enabled: false,

const mkBucket = (o = {}) => ({

// ---- v2 -> v3 migration ------------------------------------------------
// The old app stored per-PAYCHECK expense amounts and biweekly-only settings.
// Convert those to monthly, and map the flat tax rate onto a state override so
// take-home doesn't jump the moment someone upgrades.
const migrateV2 = (v2) => {
  const s = defaultState();
  const cadence = "biweekly";
  s.income.w2.grossPerCheck = num(v2.paycheckAmount) || 2500;
  s.income.bonus.amount = num(v2.yearlyBonus);

  // v2 had one 401k percentage with no Trad/Roth split — treat it as Traditional.
  s.preTax.trad401kPct = num(v2.contributions?.contrib401k);
  s.postTax.roth401kPct = 0;

  // v2 match was "employerMatch% of contributions up to matchCap% of pay".
  s.match.tiers = [{
    uptoPctOfPay: num(v2.matchCap) || 4,
    matchPct: num(v2.employerMatch) || 100,
  }];

  // v2's single blended taxRate is deliberately NOT carried over. It conflated
  // federal, FICA and state into one number; v3 computes all three properly, so
  // take-home will shift on upgrade. That shift is the correction, not a bug.

  if (v2.caps) {
    s.limits.employee401k = num(v2.caps.contrib401k) || s.limits.employee401k;
    s.limits.rothIra = num(v2.caps.rothIra) || s.limits.rothIra;
  }
  if (v2.ytd) {
    s.ytd.trad401k = num(v2.ytd.contrib401k);
    s.ytd.rothIra = num(v2.ytd.rothIra);
  }
  s.ytd.year = num(v2.ytdYear) || new Date().getFullYear();

  // Expenses were per-paycheck. Convert to monthly.
  const expenseBuckets = (v2.expenses || []).map((e, i) =>
    mkBucket({
      name: e.name || "Expense",
      kind: "expense",
      essential: true,
      fill: "fixed",
      amountMonthly: Math.round(toMonthly(num(e.amount), cadence) * 100) / 100,
      slot: i % SERIES_SLOTS,
    })
  );

  // Custom allocations were % of gross. Convert to a monthly dollar figure.
  const grossMonthly = toMonthly(s.income.w2.grossPerCheck, cadence);
  const customBuckets = (v2.customAllocations || []).map((c, i) =>
    mkBucket({
      name: c.name || "Investment",
      kind: "invest",
      fill: c.capAnnual > 0 ? "fillToTarget" : "fixed",
      amountMonthly: Math.round(grossMonthly * num(c.percent) / 100 * 100) / 100,
      capAnnual: num(c.capAnnual),
      ytd: num(c.ytd),
      balance: num(c.balance),
      slot: (i + 5) % SERIES_SLOTS,
    })
  );

  const emergencyMonthly = Math.round(toMonthly(grossMonthly * num(v2.contributions?.emergency) / 100 / checksPerMonth(cadence), cadence) * 100) / 100;
  const keep = defaultBuckets().filter((b) =>
    ["Emergency fund", "Roth IRA", "Brokerage", "Fun money", "Car maintenance", "Car replacement"].includes(b.name)
  );
  const emergency = keep.find((b) => b.name === "Emergency fund");
  if (emergency && emergencyMonthly > 0) emergency.amountMonthly = emergencyMonthly;
  const rothB = keep.find((b) => b.name === "Roth IRA");
  if (rothB) {
    rothB.amountMonthly = Math.round(grossMonthly * num(v2.contributions?.rothIra) / 100 * 100) / 100;
    rothB.ytd = num(v2.ytd?.rothIra);
    rothB.balance = num(v2.accounts?.rothIra);   // v3 tracks this on the bucket
  }
  if (emergency) emergency.balance = num(v2.accounts?.savings);

  s.buckets = [...expenseBuckets, ...keep.filter((b) => b.kind !== "discretionary"), ...customBuckets,
               ...keep.filter((b) => b.kind === "discretionary")];

  if (v2.accounts) {
    s.accounts.checking = num(v2.accounts.checking);
    s.accounts.trad401k = num(v2.accounts.contrib401k);
    // savings and rothIra moved onto their buckets above — leaving them here
    // too would double-count them in net worth.
    s.accounts.savings = 0;
  }
  if (Array.isArray(v2.debts) && v2.debts.length) {
    s.debts = v2.debts.map((d) => ({
      id: d.id || uid(), name: d.name || "Debt", balance: num(d.balance),
      apr: num(d.apr), minPayment: num(d.minPayment), extraPayment: num(d.extraPayment),
    }));
    s.modules.debt = true;
  }
  s.completedPhases = v2.completedPhases || [];
  s.lastExportAt = v2.lastExportAt || null;
  s.history = [];              // v2 history stored deltas only; not portable
  s.setupComplete = true;
  s.migratedFrom = "v2";
  return s;
};

// ---- v3 -> v4 ----------------------------------------------------------
// v4 adds due dates, rollover, the credit card, net worth history and the
// month-level budget/carried/moves ledger. Nothing in v3 is dropped; the new
// fields just get sensible defaults, and rollover switches itself on for the
// categories where it actually helps.
const migrateV3 = (v3) => {
  const s = deepMerge(defaultState(), v3);
  s.schemaVersion = SCHEMA_VERSION;
  const variable = /grocer|gas|fuel|fun|dining|eating|entertain|misc|subscription|utilit/i;
  s.buckets = (s.buckets || []).map((b, i) => {
    const { color, ...rest } = b;   // v3 stored an unvalidated hex; v4 uses slots
    return {
      ...mkBucket(), ...rest,
      slot: b.slot === undefined ? i % SERIES_SLOTS : b.slot,
      dueDay: b.dueDay === undefined ? null : b.dueDay,
      rollover: b.rollover === undefined
        ? (b.kind === "expense" || b.kind === "discretionary") && variable.test(b.name || "")
        : b.rollover,
      carried: num(b.carried),
    };
  });
  s.migratedFrom = (v3.migratedFrom ? v3.migratedFrom + "+" : "") + "v3";
  return s;
};

// ---- v4 -> v5 ----------------------------------------------------------
// v5 turns the single `card` into a `cards` array with rewards, and tags each
// budget category with a spend category so the best-card picker can work
// without the user re-labelling everything.
const migrateV4 = (v4) => {
  const base = defaultState();
  const s = deepMerge(base, v4);
  s.schemaVersion = SCHEMA_VERSION;

  if (Array.isArray(v4.cards) && v4.cards.length) {
    s.cards = v4.cards.map((c) => deepMerge(mkCard(), c));
  } else if (v4.card) {
    // The old single card becomes the first of the three, keeping its numbers.
    const first = mkCard({
      name: v4.card.name || "Card 1",
      slot: 0,
      statementBalance: num(v4.card.statementBalance),
      dueDay: num(v4.card.dueDay) || 22,
      creditLimit: num(v4.card.creditLimit),
      autopay: v4.card.autopay !== false,
    });
    s.cards = [first, ...base.cards.slice(1)];
    s.cardsEnabled = v4.card.enabled !== false;
  }
  delete s.card;

  s.buckets = (s.buckets || []).map((b) => ({
    ...b,
    spendCategory: b.spendCategory || guessSpendCategory(b.name),
  }));
  s.migratedFrom = (v4.migratedFrom ? v4.migratedFrom + "+" : "") + "v4";
  return s;
};

/**
 * Integrity pass, run on every load regardless of version.
 *
 * An earlier uid() used a random suffix and collided often enough that saved
 * states really do contain duplicate bucket ids — and since spending, rollover
 * and paycheck allocations are all keyed by id, two categories sharing one
 * silently share their data. The first holder keeps the id (and its history);
 * later duplicates get fresh ones and start clean, because their data was
 * fused and can't be untangled.
 */
const dedupeIds = (s) => {
  const seen = new Set();
  let repaired = 0;
  const fix = (arr) => (arr || []).map((item) => {
    if (!item || item.id === undefined) return item;
    if (seen.has(item.id)) { repaired++; return { ...item, id: uid() }; }
    seen.add(item.id);
    return item;
  });
  s.buckets = fix(s.buckets);
  s.cards = fix(s.cards);
  s.goals = fix(s.goals);
  s.debts = fix(s.debts);
  if (repaired) s.idsRepaired = (num(s.idsRepaired) || 0) + repaired;
  return s;
};

// ---- v5 -> v6 ----------------------------------------------------------
// v6 adds imported statement transactions per month. Nothing existing changes:
// months without transactions keep using their manually-entered actuals.
const migrateV5 = (v5) => {
  const s = deepMerge(defaultState(), v5);
  s.schemaVersion = SCHEMA_VERSION;
  const months = {};
  for (const [k, m] of Object.entries(s.months || {})) {
    months[k] = { ...m, transactions: m.transactions || [], imports: m.imports || [] };
  }
  s.months = months;
  s.migratedFrom = (v5.migratedFrom ? v5.migratedFrom + "+" : "") + "v5";
  return s;
};

/**
 * v6 → v7. v6 excluded money you'd fronted for other people and said nothing
 * more about it, which silently assumed you'd be paid back. Promote those
 * exclusions to real receivables so they show up as outstanding until they're
 * either repaid or written off.
 */
const migrateV6 = (v6) => {
  const s = deepMerge(defaultState(), v6);
  s.schemaVersion = SCHEMA_VERSION;
  const fronted = /cover|someone else|paid for|fronted/i;
  const months = {};
  for (const [k, m] of Object.entries(s.months || {})) {
    months[k] = { ...m, transactions: (m.transactions || []).map((t) =>
      t.excluded && !t.owed && fronted.test(t.excludeReason || "") ? { ...t, owed: true } : t) };
  }
  s.months = months;
  s.migratedFrom = (v6.migratedFrom ? v6.migratedFrom + "+" : "") + "v6";
  return s;
};

/**
 * v7 → v8. The bankroll gains a movement log and a reserve. Nothing to
 * convert — the old `deposited`/`withdrawn` totals stay as the opening
 * baseline and movements accumulate on top, so history isn't lost.
 */
const migrateV7 = (v7) => {
  const s = deepMerge(defaultState(), v7);
  s.schemaVersion = SCHEMA_VERSION;
  s.bankroll = { ...s.bankroll, movements: s.bankroll.movements || [], books: s.bankroll.books || [] };
  s.migratedFrom = (v7.migratedFrom ? v7.migratedFrom + "+" : "") + "v7";
  return s;
};

/**
 * v8 → v9. Work-expensed charges become receivables.
 *
 * v8 excluded them and stopped caring, which is the same mistake the fronted-
 * for-friends case had: the money left your account and nothing tracked
 * whether it came back. An employer that quietly never reimburses $227 of
 * parking is exactly the thing a budget should catch.
 */
const migrateV8 = (v8) => {
  const s = deepMerge(defaultState(), v8);
  s.schemaVersion = SCHEMA_VERSION;
  const work = /expens|reimburs|work/i;
  const months = {};
  for (const [k, m] of Object.entries(s.months || {})) {
    months[k] = { ...m, transactions: (m.transactions || []).map((t) =>
      t.excluded && !t.owed && !t.settlesTxnId && work.test(t.excludeReason || "")
        ? { ...t, owed: true, owedType: "work" }
        : { ...t, owedType: t.owedType || "person" }) };
  }
  s.months = months;
  s.migratedFrom = (v8.migratedFrom ? v8.migratedFrom + "+" : "") + "v8";
  return s;
};

/**
 * v9 → v10. Account balances become "unknown" rather than zero.
 *
 * Only for states that plainly never set them: no paycheck ever logged and no
 * net-worth snapshot taken. Someone who really does have $0 in checking and
 * has been using the app keeps their zero — the point is to stop inventing a
 * shortfall for people who simply hadn't filled the field in yet.
 */
const migrateV9 = (v9) => {
  const out = deepMerge(defaultState(), v9);
  out.schemaVersion = SCHEMA_VERSION;
  const untouched = (out.history || []).length === 0 && (out.netWorthHistory || []).length === 0;
  if (untouched) {
    const acc = { ...out.accounts };
    for (const k of ["checking", "savings"]) if (num(acc[k]) === 0) acc[k] = null;
    out.accounts = acc;
  }
  out.migratedFrom = (v9.migratedFrom ? v9.migratedFrom + "+" : "") + "v9";
  return out;
};

const migrate = (raw) => {
  if (!raw || typeof raw !== "object") return defaultState();
  const v = num(raw.schemaVersion);
  const chain = (from) => {
    // migrateVN takes a vN state one rung up, so index 0 is the v3 step and a
    // state at version N starts at index N−3.
    const steps = [migrateV3, migrateV4, migrateV5, migrateV6, migrateV7, migrateV8, migrateV9];
    return steps.slice(Math.max(0, from - 3)).reduce((acc, step) => step(acc), raw);
  };
  let out;
  if (v >= 10) out = deepMerge(defaultState(), raw);
  else if (v >= 3) out = chain(v);
  // Anything without schemaVersion that has v2's fingerprint fields is v2.
  else if ("paycheckAmount" in raw || "customAllocations" in raw || "contributions" in raw) {
    out = [migrateV2, migrateV3, migrateV4, migrateV5, migrateV6, migrateV7, migrateV8, migrateV9]
      .reduce((acc, step) => step(acc), raw);
  } else out = deepMerge(defaultState(), raw);
  return dedupeIds(out);
};

// Reads the newest store present and upgrades. Older keys are left in place as
// a rollback — this app is the only copy of the data, so nothing gets deleted.
const loadState = () => {
  try {
    for (const key of [STORAGE_KEY, V5_KEY, V4_KEY, V3_KEY, LEGACY_KEY]) {
      const raw = localStorage.getItem(key);
      if (raw) return migrate(JSON.parse(raw));
    }
    return defaultState();
  } catch { return defaultState(); }
};

// ===================== §5  ENGINE =====================
// Pure functions. No React, no state mutation — everything here is testable
// from the ?test=1 suite in §6.

// Progressive bracket application. `brackets` is [[ceiling, rate], ...].
const applyBrackets = (taxable, brackets) => {
  let tax = 0, prev = 0;
  for (const [ceiling, rate] of brackets) {
    if (taxable <= prev) break;
    tax += (Math.min(taxable, ceiling) - prev) * rate;
    prev = ceiling;
  }
  return tax;
};

const marginalRate = (taxable, brackets) => {
  for (const [ceiling, rate] of brackets) if (taxable <= ceiling) return rate;
  return brackets[brackets.length - 1][1];
};

const effectiveStateRate = (profile) => {
  if (profile.stateRateOverride !== null && profile.stateRateOverride !== undefined) {
    return num(profile.stateRateOverride);
  }
  return stateInfo(profile.stateCode).rate;
};

/**
 * Per-paycheck payroll calculation.
 *
 * The tax rules that actually matter here:
 *   • Traditional 401k reduces federal + state income tax but NOT FICA.
 *   • HSA through payroll reduces federal, state AND FICA (Section 125).
 *   • Roth 401k reduces nothing — it comes out after every tax.
 *   • Social Security stops at the wage base; Medicare never does, and gains
 *     an extra 0.9% above the threshold.
 *
 * ytdWages lets the wage-base and additional-Medicare thresholds behave
 * correctly partway through a year.
 */
const computePayroll = (gross, cadence, profile, preTax, postTax, taxData, ytdWages = 0) => {
  const g = num(gross);
  const periods = PER_YEAR[cadence] || 26;
  const status = profile.filingStatus || "single";
  const brackets = FED_BRACKETS_2026[status] || FED_BRACKETS_2026.single;

  // --- deductions off the top ---
  const trad401k = g * num(preTax.trad401kPct) / 100;
  const hsa = num(preTax.hsaPerCheck);
  const otherPreTax = num(preTax.otherPerCheck);
  const preTaxTotal = trad401k + hsa + otherPreTax;

  const fedTaxableWages = Math.max(0, g - preTaxTotal);
  const ficaWages = Math.max(0, g - hsa);   // 401k is NOT exempt from FICA

  // --- federal income tax (annualize, deduct, bracket, divide back) ---
  const annualTaxable = fedTaxableWages * periods;
  const stdDed = num(taxData.stdDeduction?.[status]) || STD_DEDUCTION_2026[status];
  const afterStd = Math.max(0, annualTaxable - stdDed);
  const annualFederal = applyBrackets(afterStd, brackets);
  const federal = annualFederal / periods;
  const fedMarginal = marginalRate(afterStd, brackets);

  // --- FICA ---
  const fica = taxData.fica || FICA_2026;
  const ssRoom = Math.max(0, num(fica.ssWageBase) - num(ytdWages));
  const ss = Math.min(ficaWages, ssRoom) * num(fica.ssRate);
  const medicare = ficaWages * num(fica.medicareRate);
  const addlThreshold = num(fica.addlMedicareThreshold?.[status]) || 200000;
  const overThreshold = Math.max(0, (num(ytdWages) + ficaWages) - addlThreshold);
  const addlMedicare = Math.min(ficaWages, overThreshold) * num(fica.addlMedicareRate);

  // --- state + local ---
  const info = stateInfo(profile.stateCode);
  const rate = effectiveStateRate(profile);
  // For genuinely flat states we apply that state's standard deduction. For
  // progressive states the table already holds an EFFECTIVE rate on income,
  // so applying a deduction on top would double-count it.
  const stateStdDed = info.kind === "flat" ? num(info.sd) : 0;
  const stateAnnualTaxable = Math.max(0, annualTaxable - stateStdDed);
  const stateTax = (stateAnnualTaxable * rate) / periods;
  const local = fedTaxableWages * num(profile.localRate);

  // --- post-tax ---
  const roth401k = g * num(postTax.roth401kPct) / 100;

  const taxTotal = federal + ss + medicare + addlMedicare + stateTax + local;
  const netPay = g - preTaxTotal - taxTotal - roth401k;

  return {
    gross: g, periods,
    trad401k, roth401k, hsa, otherPreTax, preTaxTotal,
    fedTaxableWages, ficaWages, annualTaxable,
    federal, ss, medicare, addlMedicare, stateTax, local, taxTotal,
    netPay,
    fedMarginal, stateRate: rate, stateKind: info.kind, stateName: info.name,
    effectiveTaxRate: g > 0 ? taxTotal / g : 0,
    total401k: trad401k + roth401k,
  };
};

/**
 * Employer match. Tiers are evaluated against the EMPLOYEE's total elective
 * deferral (Traditional + Roth both count), each tier covering a slice of pay.
 * Default: one tier, 100% of the first 4%.
 */
const computeMatch = (gross, employeeDeferralPct, tiers) => {
  const g = num(gross);
  let covered = 0, match = 0;
  const detail = [];
  for (const t of (tiers || [])) {
    const upto = num(t.uptoPctOfPay);
    const slice = Math.max(0, Math.min(num(employeeDeferralPct), upto) - covered);
    const amt = g * slice / 100 * num(t.matchPct) / 100;
    if (slice > 0) detail.push({ slicePct: slice, matchPct: num(t.matchPct), amount: amt });
    match += amt;
    covered = Math.max(covered, upto);
  }
  const maxTierPct = (tiers || []).reduce((m, t) => Math.max(m, num(t.uptoPctOfPay)), 0);
  const maxMatch = (tiers || []).reduce((sum, t, i, arr) => {
    const prev = i === 0 ? 0 : num(arr[i - 1].uptoPctOfPay);
    return sum + g * Math.max(0, num(t.uptoPctOfPay) - prev) / 100 * num(t.matchPct) / 100;
  }, 0);
  return {
    match, detail, maxMatch,
    missing: Math.max(0, maxMatch - match),
    needPct: Math.max(0, maxTierPct - num(employeeDeferralPct)),
    fullyCaptured: num(employeeDeferralPct) >= maxTierPct,
  };
};

/**
 * The waterfall. Money flows down the ordered bucket list; each bucket takes
 * what its fill rule asks for, clipped by its target and annual cap, and the
 * overflow passes to the next.
 *
 * This is what makes caps behave: a Roth IRA bucket fills to $7,500 for the
 * year and then automatically stops taking money instead of silently
 * overfunding, which the old percent-of-gross model could not express.
 *
 * A `remainder` bucket takes everything left AT ITS POSITION — so anything
 * below it gets nothing. The UI warns when one isn't last.
 */
const runWaterfall = (available, buckets) => {
  let remaining = num(available);
  const allocations = [];
  const unfunded = [];
  const live = (buckets || []).filter((b) => !b.archived);

  for (const b of live) {
    let want;
    switch (b.fill) {
      case "pctOfNet":
        want = num(available) * num(b.amountMonthly) / 100;
        break;
      case "fillToTarget": {
        const capRoom = num(b.capAnnual) > 0 ? Math.max(0, num(b.capAnnual) - num(b.ytd)) : Infinity;
        const targetRoom = num(b.target) > 0 ? Math.max(0, num(b.target) - num(b.balance)) : Infinity;
        want = Math.min(num(b.amountMonthly), capRoom, targetRoom);
        break;
      }
      case "remainder":
        want = Math.max(0, remaining);
        break;
      case "fixed":
      default: {
        const capRoom = num(b.capAnnual) > 0 ? Math.max(0, num(b.capAnnual) - num(b.ytd)) : Infinity;
        want = Math.min(num(b.amountMonthly), capRoom);
      }
    }
    if (!isFinite(want) || want < 0) want = 0;
    const take = Math.max(0, Math.min(want, remaining));
    remaining -= take;
    allocations.push({ bucket: b, want, amount: take, short: want - take });
    if (want - take > 0.005) unfunded.push({ bucket: b, short: want - take });
  }

  const remainderIdx = live.findIndex((b) => b.fill === "remainder");
  return {
    allocations, unfunded,
    leftover: Math.max(0, remaining),
    totalAllocated: allocations.reduce((s, a) => s + a.amount, 0),
    starvedByRemainder: remainderIdx >= 0 && remainderIdx < live.length - 1
      ? live.slice(remainderIdx + 1).map((b) => b.name)
      : [],
  };
};

/**
 * Car cost of ownership → the recommended monthly sinking-fund amounts.
 *
 * Depreciation is deliberately surfaced as a REPLACEMENT RESERVE rather than
 * an abstract paper number: what you'd have to set aside monthly so the next
 * car is paid for in cash.
 */
const carOwnershipCost = (car) => {
  const age = Math.max(0, new Date().getFullYear() - num(car.year));
  const ageMult = (CAR_AGE_MULT.find((r) => age <= r.maxAge) || CAR_AGE_MULT[CAR_AGE_MULT.length - 1]).mult;
  const miles = num(car.annualMiles);

  const maintenanceMonthly = Math.max(
    CAR_DEFAULTS.maintFloorMonthly,
    num(car.maintPerMile) * ageMult * miles / 12
  );
  const tiresMonthly = num(car.tireLifeMiles) > 0
    ? num(car.tireSetCost) / num(car.tireLifeMiles) * miles / 12
    : 0;
  const registrationMonthly = num(car.registrationAnnual) / 12;
  const replacementMonthly = num(car.replaceInMonths) > 0
    ? Math.max(0, num(car.nextCarBudget) - num(car.resaleValue)) / num(car.replaceInMonths)
    : 0;

  const sinkingTotalMonthly = maintenanceMonthly + tiresMonthly + registrationMonthly + replacementMonthly;

  // Bills, not sinking funds — but they belong in true cost of ownership.
  const insuranceMonthly = num(car.insuranceMonthly);
  const fuelMonthly = num(car.mpg) > 0 ? (miles / num(car.mpg)) * num(car.gasPrice) / 12 : 0;

  const trueMonthlyTotal = sinkingTotalMonthly + insuranceMonthly + fuelMonthly;

  return {
    age, ageMult,
    maintenanceMonthly, tiresMonthly, registrationMonthly, replacementMonthly,
    sinkingTotalMonthly, insuranceMonthly, fuelMonthly, trueMonthlyTotal,
    costPerMile: miles > 0 ? (trueMonthlyTotal * 12) / miles : 0,
    upkeepOnlyMonthly: maintenanceMonthly + tiresMonthly + registrationMonthly,
  };
};

/**
 * Traditional vs Roth 401k. Runs the real payroll both ways at the same total
 * deferral so the "cost today" figure is the actual paycheck difference, not a
 * rule of thumb.
 */
const tradVsRoth = (gross, cadence, profile, preTax, postTax, taxData) => {
  const totalPct = num(preTax.trad401kPct) + num(postTax.roth401kPct);
  if (totalPct <= 0) return null;

  const allTrad = computePayroll(gross, cadence, profile,
    { ...preTax, trad401kPct: totalPct }, { roth401kPct: 0 }, taxData);
  const allRoth = computePayroll(gross, cadence, profile,
    { ...preTax, trad401kPct: 0 }, { roth401kPct: totalPct }, taxData);
  const current = computePayroll(gross, cadence, profile, preTax, postTax, taxData);

  const rothCostPerCheck = allTrad.netPay - allRoth.netPay;
  const nowRate = allTrad.fedMarginal + (profile.stateCode ? effectiveStateRate(profile) : 0);
  const laterRate = num(profile.retirementBracketGuess);

  let verdict, why;
  if (allTrad.fedMarginal <= 0.12) {
    verdict = "roth";
    why = `You're in the ${(allTrad.fedMarginal * 100).toFixed(0)}% federal bracket. Paying tax now at this rate is cheap — Roth almost certainly wins.`;
  } else if (allTrad.fedMarginal >= 0.24) {
    verdict = "trad";
    why = `You're in the ${(allTrad.fedMarginal * 100).toFixed(0)}% bracket. Deducting now at that rate is usually worth more than tax-free growth later.`;
  } else {
    verdict = laterRate > allTrad.fedMarginal ? "roth" : laterRate < allTrad.fedMarginal ? "trad" : "split";
    why = `You're in the ${(allTrad.fedMarginal * 100).toFixed(0)}% bracket — genuinely close to the line. It hinges on whether your retirement rate lands above or below ${(allTrad.fedMarginal * 100).toFixed(0)}%, which nobody knows. A split hedges it.`;
  }

  return {
    totalPct, current, allTrad, allRoth,
    rothCostPerCheck,
    rothCostAnnual: rothCostPerCheck * (PER_YEAR[cadence] || 26),
    fedMarginal: allTrad.fedMarginal,
    combinedMarginal: nowRate,
    laterRate, verdict, why,
  };
};

/** Side income: 1099/self-employment pays SE tax; gambling/betting doesn't. */
const computeSideIncome = (sideArr, marginalCombined) => {
  const items = (sideArr || []).map((s) => {
    const gross = num(s.amountMonthly);
    let seTax = 0, incomeTax = 0;
    if (s.taxTreatment === "se") {
      seTax = gross * SE_TAX.netEarningsFactor * SE_TAX.rate;
      incomeTax = Math.max(0, gross - seTax * SE_TAX.deductibleHalf) * marginalCombined;
    } else if (s.taxTreatment === "w2") {
      incomeTax = 0;   // already withheld at the source
    }
    return { ...s, gross, seTax, incomeTax, net: gross - seTax - incomeTax };
  });
  return {
    items,
    grossMonthly: items.reduce((s, i) => s + i.gross, 0),
    netMonthly: items.reduce((s, i) => s + i.net, 0),
    taxMonthly: items.reduce((s, i) => s + i.seTax + i.incomeTax, 0),
  };
};

/**
 * One movement of money into, out of, or around the bankroll.
 *
 *   deposit   new money from your bank into a book. This is the one that
 *             matters: it's capital leaving your spending accounts.
 *   withdraw  money out of a book, back to your bank.
 *   transfer  book A to book B. The bankroll total doesn't move, so it costs
 *             you nothing and needs no funding.
 *
 * `funded` records whether a deposit was covered by the reserve. An unfunded
 * deposit is money that came out of ordinary savings, which is exactly the
 * thing to be told about.
 */
const mkMovement = (o = {}) => ({
  id: uid(),
  date: todayISO(),
  type: "deposit",       // "deposit" | "withdraw" | "transfer"
  amount: 0,
  fromBook: "",          // withdraw/transfer: where it left
  toBook: "",            // deposit/transfer: where it landed
  note: "",
  funded: false,         // deposits only: covered from the reserve
  ...o,
});

/** Where the bankroll reserve actually sits — a normal waterfall bucket. */
const reserveBucket = (state) =>
  (state?.buckets || []).find((b) => String(b.id) === String(state?.bankroll?.reserveBucketId)) || null;

/**
 * Taxable gambling income, which is NOT your net profit.
 *
 * Winnings are ordinary income and losses are an itemised deduction — and from
 * tax year 2026 only 90% of losses are deductible. So a bettor who wins
 * $100k and loses $93k nets $7k but is taxed on $16.3k: the disallowed 10% of
 * losses is income you never actually kept. High turnover makes the gap
 * enormous, which is why net profit is the wrong number to plan around.
 *
 * With no gross figures on hand this falls back to net, and says so — an
 * estimate that is knowingly low beats a number that looks authoritative.
 */
const gamblingTaxable = (grossWon, grossLost, netProfit) => {
  const won = num(grossWon);
  const lost = num(grossLost);
  if (won <= 0 || lost <= 0) {
    return { taxable: Math.max(0, num(netProfit)), phantom: 0, fromGross: false };
  }
  const deductible = lost * GAMBLING_LOSS_DEDUCTIBLE;
  const taxable = Math.max(0, won - deductible);
  return { taxable, phantom: Math.max(0, taxable - Math.max(0, won - lost)), fromGross: true };
};

/**
 * Time-weighted return across balance marks.
 *
 * The right question for a bankroll is "how did the money I had working
 * perform", which is not the same as profit over deposits. Deposits aren't the
 * capital at risk — the bankroll is — so a big win funded by a small deposit
 * produces a meaningless percentage. Chaining the return between marks and
 * netting out the cash that moved in or out answers the real question, and is
 * immune to when those movements happened.
 *
 * Flows are assumed to land mid-period (Simple Dietz). With marks every few
 * weeks the approximation is well inside the noise of the thing being measured.
 */
const timeWeightedReturn = (marks, movements) => {
  const pts = [...(marks || [])]
    .filter((m) => num(m.balance) > 0 && m.date)
    .sort((a, b) => String(a.date).localeCompare(String(b.date)));
  if (pts.length < 2) return { ok: false, periods: 0, twr: 0 };

  const flowsBetween = (from, to) => (movements || [])
    .filter((m) => m.type !== "transfer" && m.date > from && m.date <= to)
    .reduce((s, m) => s + (m.type === "deposit" ? num(m.amount) : -num(m.amount)), 0);

  let chain = 1;
  let periods = 0;
  for (let i = 1; i < pts.length; i++) {
    const b0 = num(pts[i - 1].balance);
    const b1 = num(pts[i].balance);
    const f = flowsBetween(String(pts[i - 1].date).slice(0, 10), String(pts[i].date).slice(0, 10));
    const denom = b0 + f / 2;
    if (denom <= 0) continue;
    chain *= 1 + (b1 - b0 - f) / denom;
    periods++;
  }
  return periods === 0 ? { ok: false, periods: 0, twr: 0 } : { ok: true, periods, twr: chain - 1 };
};

/**
 * Betting bankroll P&L. Profit is ordinary income with NO FICA and no SE tax
 * (gambling winnings aren't self-employment income for a recreational bettor),
 * so the correct set-aside is just your marginal income-tax rate.
 *
 * Everything here is measured since `trackingSince`. Nothing claims to know
 * lifetime numbers, because for a bankroll that's been cycling for years
 * nobody does.
 */
const bankrollStats = (bankroll, marginalCombined, state) => {
  const moves = bankroll.movements || [];
  const sum = (type) => moves.filter((m) => m.type === type)
    .reduce((s, m) => s + num(m.amount), 0);

  const balance = num(bankroll.balance);
  const deposited = num(bankroll.deposited) + sum("deposit");
  const withdrawn = num(bankroll.withdrawn) + sum("withdraw");

  // Profit since tracking began: what's there now, plus what you took out,
  // minus what you put in, minus what was already there on day one.
  const tracking = !!bankroll.trackingSince;
  const startBalance = num(bankroll.startBalance);
  const profit = balance + withdrawn - deposited - (tracking ? startBalance : 0);

  const ret = timeWeightedReturn(bankroll.marks, moves);

  // Deposits that weren't covered from the reserve. A transfer between books
  // never appears here — no new money went in, so nothing needs backfilling.
  const unfundedMoves = moves.filter((m) => m.type === "deposit" && !m.funded);
  const unfunded = unfundedMoves.reduce((s, m) => s + num(m.amount), 0);

  const rb = reserveBucket(state);
  const reserve = rb ? num(rb.balance) : 0;

  const suggestedRate = marginalCombined;
  // Tax runs off what you know you're up this year, not off tracked profit —
  // tracking starts today and the tax bill doesn't.
  const tax = gamblingTaxable(bankroll.grossWon, bankroll.grossLost, num(bankroll.ytdStatedProfit));
  const taxOwedEstimate = tax.taxable * num(bankroll.taxSetAsidePct) / 100;

  return {
    balance, deposited, withdrawn, profit,
    atRisk: balance,
    tracking, trackingSince: bankroll.trackingSince, startBalance,
    // Return on capital employed, chained across marks. `ok` false means
    // there aren't enough marks yet to say anything — which is the honest
    // answer, not zero.
    twr: ret.twr, twrOk: ret.ok, twrPeriods: ret.periods,
    ytdStatedProfit: num(bankroll.ytdStatedProfit),
    movements: moves,
    unfunded, unfundedCount: unfundedMoves.length,
    reserve,
    // What's left in the reserve once every outstanding deposit is covered.
    // Negative means the reserve is dry and deposits are eating living money.
    reserveAfterBackfill: reserve - unfunded,
    transferred: sum("transfer"),
    taxable: tax.taxable,
    taxFromGross: tax.fromGross,
    phantomIncome: tax.phantom,
    suggestedSetAsidePct: suggestedRate * 100,
    taxOwedEstimate,
    taxOwedAtSuggested: tax.taxable * suggestedRate,
    reserveShortfall: Math.max(0, taxOwedEstimate - num(bankroll.taxReserve)),
  };
};

// ---------- transactions ----------

/** Live (non-excluded) transactions for a month. */
const liveTxns = (month) => (month?.transactions || []).filter((t) => !t.excluded);

/**
 * What each category actually cost in a month.
 *
 * Transactions win where they exist: once a category has imported lines, its
 * total is the sum of those lines and the manually-typed figure steps aside,
 * so the two can never disagree. Categories with no transactions keep using
 * whatever you entered by hand.
 */
const monthActuals = (month) => {
  const out = {};
  const fromTxns = {};
  for (const t of liveTxns(month)) {
    if (t.bucketId === null || t.bucketId === undefined) continue;
    fromTxns[t.bucketId] = num(fromTxns[t.bucketId]) + num(t.amount);
  }
  for (const [k, v] of Object.entries(month?.actual || {})) out[k] = v;
  for (const [k, v] of Object.entries(fromTxns)) out[k] = v;
  return out;
};

/** Whether a category's number came from statements or from typing. */
const actualSource = (month, bucketId) =>
  liveTxns(month).some((t) => String(t.bucketId) === String(bucketId)) ? "transactions" : "manual";

/** Statement lines that haven't been assigned a category yet. */
const uncategorised = (month) =>
  liveTxns(month).filter((t) => t.bucketId === null || t.bucketId === undefined);

/**
 * Everything worth a human look: unfiled lines AND low-confidence guesses.
 *
 * A guess you can't see is worse than no guess — it lands in a category and
 * quietly skews the total. Surfacing them together means one review pass
 * covers both.
 */
const needsReview = (month) =>
  liveTxns(month).filter((t) =>
    t.bucketId === null || t.bucketId === undefined || (t.confidence === "low" && !t.edited));

// ---------- money owed to you ----------

/**
 * Every transaction in the file, tagged with the month it sits in.
 *
 * Receivables have to be cross-month: you front the money for concert tickets
 * in July and the Venmo lands in August. Scoping any of this to one month
 * would leave the July side permanently unpaid and count the August side as
 * income.
 */
const allTxns = (state) =>
  Object.entries(state?.months || {}).flatMap(([mk, m]) =>
    (m?.transactions || []).map((t) => ({ ...t, monthKey: mk })));

/**
 * Money you fronted, and how much of it has come back.
 *
 * Fronting money for other people is neither spending nor a transfer — it's a
 * short-term debt owed TO you, and it has to stay visible until it resolves,
 * because the two ways it resolves are completely different:
 *
 *   • They pay you back. The repayment cancels the debt. Neither side is
 *     spending and neither side is income — treating the Venmo as income
 *     would inflate your earnings by money that was always yours.
 *   • They don't. Then you really did spend it, and it belongs in a category
 *     (`writeOff`), retroactively, in the month you were charged.
 *
 * Excluding it and saying nothing quietly assumes the first case. That's the
 * bug this replaces.
 */
const receivables = (state) => {
  const all = allTxns(state);
  const paid = {};
  for (const t of all) {
    if (t.settlesTxnId === null || t.settlesTxnId === undefined) continue;
    paid[t.settlesTxnId] = num(paid[t.settlesTxnId]) + num(t.amount);
  }
  return all
    .filter((t) => t.owed && !t.writtenOff)
    .map((t) => {
      const back = num(paid[t.id]);
      const outstanding = Math.round(Math.max(0, num(t.amount) - back) * 100) / 100;
      // The fronted part has no category of its own — it isn't spending. If it
      // ever becomes spending it belongs wherever your own share of the same
      // charge went, so carry that across for the write-off default.
      const sibling = t.splitGroup
        ? all.find((x) => x.splitGroup === t.splitGroup && !x.excluded &&
                          x.bucketId !== null && x.bucketId !== undefined)
        : null;
      return { ...t, paidBack: back, outstanding, settled: outstanding <= 0.01,
               siblingBucketId: sibling ? sibling.bucketId : null };
    })
    .sort((a, b) => String(a.date).localeCompare(String(b.date)));
};

/** Still outstanding — what people owe you right now, across every month. */
const owedToYou = (state, type) =>
  receivables(state)
    .filter((r) => !r.settled && (!type || (r.owedType || "person") === type))
    .reduce((s, r) => s + r.outstanding, 0);

/** Open receivables split by who's on the hook, for a UI that groups them. */
const owedBreakdown = (state) => {
  const open = receivables(state).filter((r) => !r.settled);
  const by = { person: [], work: [] };
  for (const r of open) by[(r.owedType || "person") === "work" ? "work" : "person"].push(r);
  return {
    open,
    person: by.person, work: by.work,
    personTotal: by.person.reduce((s, r) => s + r.outstanding, 0),
    workTotal: by.work.reduce((s, r) => s + r.outstanding, 0),
    total: open.reduce((s, r) => s + r.outstanding, 0),
  };
};

/** Fronted charges belonging to one month, whether or not they've been repaid. */
const frontedIn = (state, mk) => receivables(state).filter((r) => r.monthKey === mk);

/**
 * Record a repayment against a fronted charge.
 *
 * It files as an excluded line in the month the money actually arrived, which
 * is usually not the month of the original charge. `settlesTxnId` is what
 * keeps it out of income.
 */
const mkSettlement = (receivable, amount, date) => mkTxn({
  date: date || todayISO(),
  description: `Paid back — ${receivable.merchant || receivable.description || "fronted charge"}`,
  merchant: receivable.merchant || "",
  amount: Math.round(num(amount) * 100) / 100,
  excluded: true,
  excludeReason: "repayment of money you fronted",
  settlesTxnId: receivable.id,
  edited: true,
});

/**
 * They're not paying. The money was yours after all, so it stops being a debt
 * and becomes spending — in the month you were charged, not today, because
 * that's when it left.
 *
 * Only the UNPAID part converts. If two of four friends squared up, their half
 * really did come back and was never your spending; writing off the full
 * original would charge you for money you already have.
 */
const writeOffReceivable = (txn, bucketId, amount) => {
  const unpaid = amount === undefined
    ? num(txn.amount)
    : Math.round(num(amount) * 100) / 100;
  const partial = unpaid < num(txn.amount) - 0.01;
  return {
    ...txn,
    amount: unpaid,
    owed: false,
    writtenOff: true,
    excluded: false,
    excludeReason: "",
    bucketId: bucketId ?? txn.bucketId ?? null,
    splitNote: (txn.splitNote ? txn.splitNote + " · " : "") +
      (partial ? `${fmt(num(txn.amount) - unpaid)} came back, rest never did` : "never paid back"),
    edited: true,
  };
};

// ---------- pace, patterns and search ----------

/**
 * How far through the month you are, against how much of a budget is gone.
 *
 * Being 78% through a dining budget on day 12 isn't over budget yet, which is
 * exactly why it's worth saying — the overspend is still avoidable. By the
 * time the total crosses the line the month is over and nothing can be done.
 */
const spendingPace = (budget, actual, date = new Date()) => {
  const daysInMonth = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
  const day = date.getDate();
  const throughMonth = day / daysInMonth;
  const b = num(budget), a = num(actual);
  if (b <= 0) return { ok: false, day, daysInMonth, throughMonth };
  const expected = b * throughMonth;
  // Straight-line projection. Crude, but it's the number that changes
  // behaviour: "carry on like this and you land at X".
  const projected = throughMonth > 0 ? a / throughMonth : 0;
  return {
    ok: true, day, daysInMonth, throughMonth,
    spentPct: a / b,
    expected,
    projected,
    overBy: Math.max(0, projected - b),
    // 15% of slack before nagging. A category that's 3% ahead on day 9 is
    // noise, and an alert that fires on noise gets ignored when it matters.
    ahead: a > expected * 1.15 && projected > b,
  };
};

/** Normalised merchant key, so "AMAZON MKTPL*A1" and "AMAZON.COM*B2" group. */
const merchantKey = (t) => (t.merchant || t.description || "")
  .toLowerCase().replace(/[^a-z ]/g, " ").replace(/\s+/g, " ").trim().slice(0, 18);

const median = (xs) => {
  if (!xs.length) return 0;
  const s = [...xs].sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};

/**
 * Group amounts into distinct price points, within 1% of each other.
 *
 * A subscription that never changed is one cluster; one that went up is two.
 * A restaurant is as many clusters as there are visits, which is exactly how
 * this tells them apart.
 */
const priceClusters = (amounts, tol = 0.01) => {
  const out = [];
  for (const a of [...amounts].sort((x, y) => x - y)) {
    const hit = out.find((c) => Math.abs(a - c.price) / c.price <= tol);
    if (hit) { hit.count++; hit.total += a; hit.price = hit.total / hit.count; }
    else out.push({ price: a, count: 1, total: a });
  }
  return out;
};

const RECURRENCE = [
  { name: "weekly", lo: 5, hi: 9, perYear: 52 },
  { name: "every 2 weeks", lo: 12, hi: 16, perYear: 26 },
  { name: "monthly", lo: 25, hi: 35, perYear: 12 },
  { name: "quarterly", lo: 80, hi: 100, perYear: 4 },
  { name: "yearly", lo: 350, hi: 380, perYear: 1 },
];

/**
 * Charges that keep coming back, and the ones that quietly went up.
 *
 * Everything here is pattern-matching over transactions already imported —
 * same merchant, evenly spaced, similar amount. Needs at least three
 * occurrences: two points make a line through any two dates, and calling that
 * a subscription produces false positives on things you happened to buy twice.
 *
 * Price changes under `tolerance` are ignored on purpose. A subscription that
 * moves by 40 cents is not news, and an alert that cries wolf gets muted.
 */
const recurringCharges = (state, { minCount = 3, tolerance = 0.10 } = {}) => {
  const groups = {};
  for (const t of allTxns(state)) {
    if (t.excluded || !t.date || num(t.amount) <= 0) continue;
    const k = merchantKey(t);
    if (!k) continue;
    (groups[k] = groups[k] || []).push(t);
  }

  const out = [];
  for (const [key, txns] of Object.entries(groups)) {
    if (txns.length < minCount) continue;
    const sorted = [...txns].sort((a, b) => String(a.date).localeCompare(String(b.date)));

    const gaps = [];
    for (let i = 1; i < sorted.length; i++) {
      gaps.push(Math.round(
        (new Date(sorted[i].date + "T00:00:00") - new Date(sorted[i - 1].date + "T00:00:00")) / 86400000));
    }
    const gap = median(gaps);
    const cadence = RECURRENCE.find((r) => gap >= r.lo && gap <= r.hi);
    if (!cadence) continue;

    // The gaps have to be regular, not just regular on average. One stray is
    // forgiven (a weekend shifts a billing date); two means it's a habit.
    const irregular = gaps.filter((g) => g < cadence.lo || g > cadence.hi).length;
    if (irregular > 1) continue;

    const amounts = sorted.map((t) => num(t.amount));
    if (median(amounts) <= 0) continue;

    // The real tell. A subscription bills the same amount to the cent; a shop
    // you happen to visit monthly never does. Without this a barber and a
    // brewery both look like Netflix.
    //
    // Testing against a single median would fail the case that matters most —
    // a subscription that changed price partway through has no one median —
    // so amounts are clustered instead. A subscription is at most two price
    // points (before the rise and after), with at least one of them repeating.
    const clusters = priceClusters(amounts);
    if (clusters.length > 2) continue;
    if (Math.max(...clusters.map((c) => c.count)) < 2) continue;

    const latest = sorted[sorted.length - 1];
    const priorClusters = priceClusters(amounts.slice(0, -1));
    const priorMid = priorClusters.sort((a, b) => b.count - a.count || b.price - a.price)[0]?.price || 0;
    const delta = priorMid > 0 ? (num(latest.amount) - priorMid) / priorMid : 0;
    const mid = clusters.sort((a, b) => b.count - a.count)[0].price;

    out.push({
      key,
      merchant: latest.merchant || latest.description,
      count: sorted.length,
      cadence: cadence.name,
      perYear: cadence.perYear,
      amount: num(latest.amount),
      typical: mid,
      annual: mid * cadence.perYear,
      lastSeen: latest.date,
      bucketId: latest.bucketId,
      priceChanged: Math.abs(delta) > tolerance,
      delta,
      was: priorMid,
    });
  }
  return out.sort((a, b) => b.annual - a.annual);
};

/** Every recurring charge that costs more than it used to. */
const priceHikes = (state, opts) =>
  recurringCharges(state, opts).filter((r) => r.priceChanged && r.delta > 0);

/** Free-text search across every month. Matches merchant or raw description. */
const searchTxns = (state, query) => {
  const q = String(query || "").trim().toLowerCase();
  if (q.length < 2) return { ok: false, matches: [], total: 0, count: 0 };
  const matches = allTxns(state)
    .filter((t) => `${t.merchant} ${t.description}`.toLowerCase().includes(q))
    .sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const counted = matches.filter((t) => !t.excluded);
  return {
    ok: true, matches,
    count: matches.length,
    total: counted.reduce((s, t) => s + num(t.amount), 0),
    months: new Set(matches.map((t) => t.monthKey)).size,
  };
};

/** A category's actuals across the last N months, oldest first, for a chart. */
const categoryTrend = (state, bucketId, months = 6, endKey = monthKey()) => {
  const out = [];
  for (let i = months - 1; i >= 0; i--) {
    const mk = addMonths(endKey, -i);
    const m = state.months?.[mk];
    const v = m ? monthActuals(m)[bucketId] : undefined;
    out.push({ month: mk, value: v === undefined || v === null ? null : num(v) });
  }
  return out;
};

/** Group a category's transactions by merchant, biggest first. */
const merchantRollup = (month, bucketId) => {
  const by = {};
  for (const t of liveTxns(month)) {
    if (String(t.bucketId) !== String(bucketId)) continue;
    const key = (t.merchant || t.description || "Unknown").trim();
    if (!by[key]) by[key] = { merchant: key, total: 0, count: 0 };
    by[key].total += num(t.amount);
    by[key].count++;
  }
  return Object.values(by).sort((a, b) => b.total - a.total);
};

/**
 * Merge an import file into a month.
 *
 * Rules that keep repeat imports safe:
 *   • A file already imported is skipped entirely (tracked in month.imports).
 *   • A transaction you've hand-edited is never overwritten.
 *   • Same date + amount + description = the same line, not a new one.
 */
const mergeImport = (state, payload, { force = false } = {}) => {
  const mk = payload.month;
  if (!mk) return { ok: false, error: "That file doesn't say which month it covers." };
  const month = state.months[mk] || { actual: {}, transactions: [], imports: [] };
  const existingImports = month.imports || [];
  const fileId = payload.fileId || (payload.sources || []).map((s) => s.file).join("|") || payload.generatedAt;

  if (!force && existingImports.some((i) => i.id === fileId)) {
    return { ok: false, error: "Already imported", duplicate: true, month: mk };
  }

  const existing = month.transactions || [];
  const key = (t) => `${t.date}|${Math.round(num(t.amount) * 100)}|${(t.description || "").slice(0, 40).toUpperCase()}`;
  const seen = new Set(existing.map(key));

  const added = [];
  let skipped = 0;
  for (const raw of (payload.transactions || [])) {
    const t = mkTxn({
      date: raw.date || "",
      description: raw.description || "",
      merchant: raw.merchant || raw.description || "",
      amount: Math.abs(num(raw.amount)),
      bucketId: raw.bucketId ?? null,
      source: raw.source || "",
      excluded: !!raw.excluded,
      excludeReason: raw.excludeReason || "",
      // Carried through, not dropped: a guess the importer already knew was
      // shaky has to arrive shaky, or it lands in a total looking certain.
      confidence: raw.confidence === "low" ? "low" : "high",
      owed: !!raw.owed,
      owedFrom: raw.owedFrom || "",
    });
    // Dedupe on the whole charge, so a split still collides with a previous
    // import of the same line rather than sneaking in beside it.
    if (seen.has(key(t))) { skipped++; continue; }
    seen.add(key(t));

    // A charge the importer already knows wasn't all yours arrives as one line
    // plus a `split`, and gets divided here.
    const sp = raw.split;
    if (sp && (num(sp.ways) > 1 || Array.isArray(sp.parts))) {
      let res;
      if (Array.isArray(sp.parts)) {
        res = splitTransaction(t, sp.parts.map((p) => ({ ...p, bucketId: p.bucketId ?? null })));
      } else if (num(sp.yourShare) > 0) {
        // An explicit share wins over an even one — a group dinner rarely
        // divides cleanly, and the importer may have read the actual figures.
        const mine = Math.round(num(sp.yourShare) * 100) / 100;
        const ways = num(sp.ways);
        res = splitTransaction(t, [
          { amount: mine, bucketId: t.bucketId, note: `your share, 1 of ${ways}` },
          { amount: Math.round((num(t.amount) - mine) * 100) / 100, excluded: true, owed: true,
            owedFrom: sp.owedFrom || "",
            excludeReason: `covering ${ways - 1} other${ways - 1 === 1 ? "" : "s"}`,
            note: `${ways - 1} of ${ways}` },
        ]);
      } else {
        res = splitEvenly(t, num(sp.ways), t.bucketId, sp.owedFrom || "");
      }
      if (res.ok) { added.push(...res.parts); continue; }
      // A split that doesn't add up is a parse error, not a reason to drop the
      // charge — keep the whole thing and flag it for review.
      added.push({ ...t, confidence: "low" });
      continue;
    }
    added.push(t);
  }

  const months = { ...state.months,
    [mk]: { ...month,
      transactions: [...existing, ...added],
      imports: [...existingImports, { id: fileId, importedAt: new Date().toISOString(), count: added.length,
                                      files: (payload.sources || []).map((s) => s.file) }] } };
  return { ok: true, state: { ...state, months }, added: added.length, skipped, month: mk };
};

/**
 * Map an import's category hints onto real buckets.
 *
 * Tries the explicit bucket name first, then the spend-category tag, then the
 * name-guesser. Anything still unmatched is left null for you to sort out
 * rather than being forced into a wrong category.
 */
const resolveBuckets = (payload, buckets) => {
  const live = buckets.filter((b) => !b.archived);
  const byName = {};
  for (const b of live) byName[b.name.trim().toLowerCase()] = b.id;
  const bySpend = {};
  for (const b of live) {
    const sc = b.spendCategory || guessSpendCategory(b.name);
    if (sc && !bySpend[sc]) bySpend[sc] = b.id;
  }
  let matched = 0, unmatched = 0;
  const transactions = (payload.transactions || []).map((t) => {
    let bucketId = null;
    const n = (t.bucketName || "").trim().toLowerCase();
    if (n && byName[n] !== undefined) bucketId = byName[n];
    else if (t.category && bySpend[t.category] !== undefined) bucketId = bySpend[t.category];
    else if (t.merchant || t.description) {
      const guess = guessSpendCategory(t.merchant || t.description);
      if (guess !== "other" && bySpend[guess] !== undefined) bucketId = bySpend[guess];
    }
    if (bucketId === null) unmatched++; else matched++;
    return { ...t, bucketId };
  });
  return { ...payload, transactions, matched, unmatched };
};

/**
 * Rollover. An unspent grocery budget should still be there next month, and an
 * overspend should eat into next month rather than vanishing. Without this,
 * variable categories are a monthly failure you can't win.
 *
